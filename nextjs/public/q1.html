window.ExpertInsights = {"_comment": "Expert analyst panels \u2014 auto-generated by insights.py (40,255 relevant rows). Re-run build_data.py to refresh.", "Q1": {"scope": "Scope: Master Topics distribution across 40,145 posts \u00b7 Q1 2026 \u00b7 Vietnamese e-commerce community", "stats": [{"label": "Others (uncategorized)", "value": "41.0%", "variant": "warn", "note": "16,497 posts lack clear Amazon/e-commerce focus"}, {"label": "Selling on Amazon (SOA)", "value": "13.0%", "variant": "soa", "note": "5,232 posts \u2014 core seller engagement topic"}, {"label": "Account Health + Logistics", "value": "23.4%", "variant": "danger", "note": "9,416 posts combined (4,760 + 4,656) \u2014 operational pain points"}, {"label": "Third-party Services & Setup", "value": "16.4%", "variant": "both", "note": "6,584 posts (4,144 + 2,440) \u2014 ecosystem dependency"}], "findings": [{"variant": "warn", "label": "\ud83d\udd0d Over 40% of posts lack clear Amazon/e-commerce context", "html": "<p>The <strong>41% 'Others' category</strong> (16,497 posts) signals significant noise in the community. Sample posts show off-topic content (TikTok/Instagram advice, general life comments like 'Ngon \u0111\u1ea5y'). This suggests the community serves as a general Vietnamese networking space rather than a focused seller hub. <strong>Recommendation: Implement stricter moderation or create topic-specific channels to improve signal-to-noise ratio.</strong></p>"}, {"variant": "danger", "label": "\u26a0\ufe0f Logistics & Account Health dominate operational concerns (23.4%)", "html": "<p><strong>9,416 combined posts</strong> focus on account health (11.8%, 4,760) and logistics/fulfillment (11.6%, 4,656). Samples reveal sellers struggle with: (1) <strong>incomplete Canada warehouse services</strong> ('kho canada b\u00ean e \u0111\u1ea7y \u0111\u1ee7 d\u1ecbch v\u1ee5 FBA-FBM'), (2) <strong>selective item delivery to Vietnam</strong> ('c\u00f3 nh\u1eefng m\u00f3n h\u00e0ng \u0111\u1ebfn vn. c\u00f3 nh\u1eefng m\u00f3n k'), and (3) <strong>account compliance anxiety</strong>. These are critical friction points blocking seller growth and retention.</p>"}, {"variant": "soa", "label": "\ud83d\udcbc SOA engagement (13%) underperforms relative to operational chaos", "html": "<p>Only <strong>5,232 posts (13%)</strong> directly discuss selling on Amazon, yet account health and logistics issues consume nearly <strong>twice the volume</strong>. Samples show sellers seeking tactical help ('support nhanh, nhi\u1ec7t t\u00ecnh 24/24', 'Nh\u1eadn \u0111\u01a1n Amazon US item t\u1eeb 40-150') rather than strategic SOA guidance. <strong>This gap indicates sellers are reactive problem-solvers, not proactive business builders.</strong> Amazon's educational content and seller tools are not reaching this audience effectively.</p>"}], "recommendations": ["Launch a dedicated 'Logistics & Fulfillment' resource hub with FBA/FBM best practices, regional warehouse partnerships, and item eligibility guides to address the 4,656 posts on this pain point.", "Create a 'Seller Onboarding & Account Health' certification program (targeting 4,760 posts) covering compliance, metrics, and appeal processes to reduce anxiety-driven posts and improve account stability.", "Establish a moderated 'SOA Strategy' channel with weekly expert sessions to elevate the 13% SOA engagement rate and shift community culture from reactive troubleshooting to proactive business growth."]}, "Q2": {"scope": "Scope: Persona \u00d7 Master Topics Matrix \u00b7 Q2 2026 \u00b7 20,547 Amazon mentions \u00b7 18,232 Other Platform mentions", "stats": [{"label": "MT1 dominates seller engagement", "value": "9,870 mentions", "variant": "both", "note": "MT1 captures 2,357 Amazon sellers + 7,513 other-platform sellers; highest cross-platform appeal"}, {"label": "MT5 heavily skews CBEC service providers", "value": "2,549 / 3,744 (68%)", "variant": "ec", "note": "MT5 is CBEC-dominant; minimal Amazon seller interest (101 mentions)"}, {"label": "Amazon sellers concentrate in MT1 & MT4", "value": "4,406 / 6,542 total (67%)", "variant": "soa", "note": "MT1 (2,357) + MT4 (2,049) represent core Amazon seller discussion zones"}, {"label": "Prospect engagement fragmented across platforms", "value": "5,246 Amazon prospects vs 8,290 other-platform", "variant": "warn", "note": "Other-platform prospects 1.6\u00d7 more active; suggests lower Amazon prospect penetration"}], "findings": [{"variant": "soa", "label": "\ud83c\udfaf Amazon sellers cluster in operational & logistics topics (MT1, MT4)", "html": "<p>Amazon sellers show strong concentration in <strong>MT1 (2,357)</strong> and <strong>MT4 (2,049)</strong>, totaling 4,406 mentions. Sample posts reveal sellers actively discussing <strong>FBA/FBM fulfillment strategies</strong>, warehouse logistics, and operational best practices (e.g., 'kho canada b\u00ean e \u0111\u1ea7y \u0111\u1ee7 d\u1ecbch v\u1ee5 FBA-FBM'). This indicates Amazon sellers prioritize supply-chain and fulfillment discussions over other topics, suggesting these are pain points requiring peer guidance.</p>"}, {"variant": "ec", "label": "\ud83c\udf0f CBEC service providers dominate MT5 with 68% concentration", "html": "<p><strong>MT5 captures 2,549 CBEC service provider mentions out of 3,744 total</strong>, representing a 68% concentration. This topic is almost exclusively CBEC-focused, with minimal Amazon seller participation (101 mentions). Sample posts highlight service-oriented discussions ('support nhanh, nhi\u1ec7t t\u00ecnh 24/24 B\u1ea3o h\u00e0nh all case'), indicating MT5 is a dedicated CBEC service marketplace where cross-border logistics and warranty support are central themes.</p>"}, {"variant": "warn", "label": "\u26a0\ufe0f Amazon prospects significantly underrepresented vs. other-platform prospects", "html": "<p>Amazon prospects generate only <strong>5,246 total mentions across all topics</strong>, while other-platform prospects reach <strong>8,290</strong>\u2014a 1.6\u00d7 gap. Even in Amazon-friendly MT1, prospects contribute only 500 mentions versus 4,384 from other-platform prospects. Sample posts show prospects asking basic questions ('c\u00f3 nh\u01b0ng mon h\u00e0ng \u0111\u1ebfn vn. Co nh\u01b0ng m\u00f3n k'), suggesting low awareness or confidence in Amazon as a selling platform. This represents a critical awareness and onboarding gap for Amazon Vietnam.</p>"}], "recommendations": ["Launch targeted MT1 & MT4 content campaigns for Amazon sellers: Create educational resources on FBA/FBM optimization, warehouse management, and logistics partnerships to deepen engagement in these high-traffic zones and reduce seller churn to other platforms.", "Develop Amazon prospect nurture program: Design beginner-friendly guides and success stories addressing common questions (product sourcing, shipping logistics, compliance) to close the 1.6\u00d7 engagement gap and convert other-platform prospects into Amazon sellers.", "Establish CBEC-Amazon bridge initiative: Recognize MT5's CBEC dominance and create hybrid offerings that allow CBEC service providers to extend services to Amazon sellers, converting the isolated MT5 ecosystem into a cross-platform growth channel."]}, "Q3": {"scope": "Scope: Seller vs Prospect comparison \u00b7 Q3 2026 \u00b7 21,754 seller posts vs 11,385 prospect posts", "stats": [{"label": "Account Health dominance among sellers", "value": "18.7% vs 5.8%", "variant": "soa", "note": "Sellers discuss account health 3.2\u00d7 more than prospects (4,015 vs 664 mentions)"}, {"label": "Account creation focus for prospects", "value": "11.9% vs 4.3%", "variant": "warn", "note": "Prospects prioritize setup (1,360 mentions) vs sellers (913 mentions)"}, {"label": "Third-party services gap", "value": "8.6% vs 1.9%", "variant": "both", "note": "Prospects seek service providers 4.5\u00d7 more (978 vs 411 mentions)"}, {"label": "SOA selling discussions", "value": "15.4% vs 13.1%", "variant": "soa", "note": "Relatively balanced; prospects slightly more interested (1,758 vs 2,816 mentions)"}], "findings": [{"variant": "danger", "label": "\ud83d\udea8 Account suspension & verification crisis among active sellers", "html": "<p>Sellers report <strong>account suspension (6.8%)</strong> and <strong>account issues (6.78%)</strong> at 5\u00d7 the rate of prospects (1.65% and 1.67% respectively). Combined, account health concerns represent <strong>18.7% of seller discourse</strong> versus only <strong>5.8% for prospects</strong>. This 12.9-point gap reflects a critical pain point: established sellers face ongoing compliance, verification, and suspension risks that new entrants have not yet encountered. Samples show sellers actively seeking fulfillment support and case management, indicating reactive problem-solving rather than proactive planning.</p>"}, {"variant": "warn", "label": "\ud83d\udccb Prospects cluster around onboarding & service discovery", "html": "<p>Prospects disproportionately discuss <strong>account creation (11.9%)</strong>, <strong>third-party services (8.6%)</strong>, and <strong>legal entity setup (2.62%)</strong>. These three topics alone account for ~23% of prospect mentions, reflecting a clear onboarding funnel: new sellers need guidance on registration, legal structure, and finding service providers (logistics, sourcing, advertising). Sellers, by contrast, focus on operational execution (account health, advertising costs, market trends). The 7.6-point gap in account creation underscores that prospects are still in the decision and setup phase.</p>"}, {"variant": "soa", "label": "\ud83d\udcbc Sellers prioritize operational efficiency; prospects seek enablement", "html": "<p><strong>Market trends & sales performance (5.21% seller vs 1.35% prospect)</strong> and <strong>advertising best practices (2.09% seller vs 1.3% prospect)</strong> show sellers are optimizing revenue and scaling, while prospects remain focused on foundational topics like <strong>product selection (2.2% prospect vs 1.47% seller)</strong> and <strong>supplier sourcing (2.38% prospect vs 0.59% seller)</strong>. Samples reveal sellers actively managing fulfillment logistics and case support, while prospects seek introductions to service providers. This bifurcation suggests Amazon should tailor content: sellers need advanced performance tools; prospects need curated onboarding paths and vetted partner directories.</p>"}], "recommendations": ["Create a dedicated 'Account Health Dashboard' for sellers with proactive alerts on suspension risk factors, verification deadlines, and compliance metrics\u2014addressing the 12.9-point gap in account health concerns.", "Build a structured onboarding flow for prospects that bundles account creation, legal entity setup, and a curated marketplace of vetted third-party services (logistics, sourcing, advertising)\u2014reducing friction in the 7.6-point account creation gap.", "Develop seller-specific content on market trends, advertising ROI, and scaling strategies, while offering prospects beginner guides on product selection and supplier vetting\u2014aligning content to their lifecycle stage and reducing information overload."]}, "Q4": {"scope": "Scope: Master Topics Trend Analysis \u00b7 Q4 2025 \u2013 Q1 2026 (16 weeks) \u00b7 Peak Detection Auto-Enabled", "stats": [{"label": "Peak Week Concentration", "value": "3 spikes detected", "variant": "both", "note": "Mar 9 (+68%), Mar 16 (+70%), Mar 23 (+57%)"}, {"label": "Highest Spike Magnitude", "value": "+70%", "variant": "danger", "note": "Week of Mar 16, 2026 (Week 12)"}, {"label": "Spike Duration", "value": "3 consecutive weeks", "variant": "warn", "note": "Mar 9\u2013Mar 23 sustained elevated engagement"}, {"label": "Baseline Period", "value": "Dec 22, 2025 \u2013 Mar 2, 2026", "variant": "ec", "note": "10 weeks prior to spike cluster"}], "findings": [{"variant": "danger", "label": "\ud83d\ude80 Mid-March Engagement Surge Driven by FBA/FBM Service Promotion", "html": "<p>A dramatic <strong>+70% spike on Mar 16</strong> (Week 12) marks the peak of a three-week surge (Mar 9\u201323). Sample posts reveal this period coincides with <strong>heavy promotion of Amazon FBA/FBM fulfillment services</strong>, particularly from Canada warehouse operators and US item resellers. Posts like \"kho canada b\u00ean e \u0111\u1ea7y \u0111\u1ee7 d\u1ecbch v\u1ee5 FBA-FBM\" and \"Nh\u1eadn \u0111\u01a1n Amazon US item t\u1eeb 40-150\" indicate sellers actively recruiting and cross-promoting logistics solutions, driving community discussion and engagement spikes.</p>"}, {"variant": "ec", "label": "\ud83d\udce6 E-commerce Logistics & Seller Support Dominates Peak Period", "html": "<p>The sustained three-week spike (Mar 9\u201323) reflects <strong>strong community interest in fulfillment options and seller support services</strong>. Sample conversations show members inquiring about product availability (\"c\u00f3 nh\u01b0ng mon h\u00e0ng \u0111\u1ebfn vn. Co nh\u01b0ng m\u00f3n k\"), FBA/FBM logistics, and 24/7 seller support (\"support nhanh, nhi\u1ec7t t\u00ecnh 24/24\"). This suggests the peak is driven by <strong>operational pain points</strong>\u2014sellers seeking reliable fulfillment and cross-border logistics solutions\u2014rather than product trends.</p>"}, {"variant": "both", "label": "\u23f0 Predictable Seasonal Pattern: Q1 2026 Engagement Concentration", "html": "<p>All three detected spikes cluster in <strong>mid-to-late March 2026</strong>, with no significant peaks recorded during the Dec 22, 2025 \u2013 Mar 2 baseline period. This suggests a <strong>seasonal or event-driven trigger</strong> in mid-March (possibly Q1 business planning, tax deadlines, or platform promotions). The consistent +57% to +70% magnitude across three consecutive weeks indicates <strong>sustained community momentum</strong> rather than isolated viral moments, pointing to a structural business cycle rather than random noise.</p>"}], "recommendations": ["Investigate the specific trigger for the Mar 9\u201323 spike (e.g., Amazon policy changes, platform promotions, or seasonal seller planning cycles) to enable predictive content strategy and resource allocation for future Q1 periods.", "Develop targeted FBA/FBM educational content and seller support resources during Feb\u2013Mar to capitalize on the predictable surge in logistics and fulfillment inquiries; consider pre-emptive webinars or guides.", "Monitor Week 11\u201313 (Mar 9\u201323) as a critical engagement window for 2026 and beyond; allocate community management and customer success resources to address seller pain points (cross-border logistics, product availability, support responsiveness) during this peak period."]}, "Q5": {"scope": "Scope: Negative sub-topics across weekdays and hourly distribution \u00b7 9,836 total mentions \u00b7 Q1 2026", "stats": [{"label": "Account Suspension dominates negative sentiment", "value": "1,067 mentions (10.8%)", "variant": "danger", "note": "Second-largest negative category after Misc/Other (1,875)"}, {"label": "Friday peaks in negative discussions", "value": "1,504 mentions", "variant": "warn", "note": "Highest day of week; 56% above Sunday baseline (964)"}, {"label": "Mid-morning surge in complaints", "value": "2,724 mentions (27.7%)", "variant": "both", "note": "Peak window 9 AM\u20131 PM; hour 11 alone: 755 mentions"}, {"label": "Account issues & verification combined", "value": "1,614 mentions (16.4%)", "variant": "soa", "note": "Account errors (955) + verification (659) = persistent operational friction"}], "findings": [{"variant": "danger", "label": "\ud83d\udea8 Account Suspension Crisis Peaks Friday Morning", "html": "<p>Account suspension complaints (1,067 mentions) represent the second-largest negative category, with Friday (1,504 total negative mentions) showing the highest weekly concentration. The 9 AM\u20131 PM window captures 2,724 complaints (27.7% of all negative posts), with hour 11 alone accounting for 755 mentions. Sample posts reveal sellers facing sudden account locks and 30-day freezes without clear resolution pathways: <em>\"t\u00e0i kho\u1ea3n m\u1edbi ai c\u0169ng b\u1ecb d\u00ednh th\u00f4i, th\u01b0\u1eddng l\u00e0 giam 30 ng\u00e0y\"</em> (new accounts all get hit, usually locked for 30 days). This timing suggests sellers check account status after overnight operations, discovering suspensions and flooding the community for support.</p>"}, {"variant": "warn", "label": "\u26a0\ufe0f Tax Compliance & Verification Bottlenecks Create Cascading Failures", "html": "<p>Tax Compliance (625 mentions) and Account Verification (659 mentions) together represent 1,284 complaints, indicating systemic friction in seller onboarding and regulatory processes. Samples show sellers struggling with verification requirements (<em>\"b\u1ea1n \u0111\u00e3 ver bank ch\u01b0a \u0111\u00e2y\"</em> \u2013 have you verified your bank yet?) and tax penalties that ripple downstream: <em>\"S\u01a1n ki\u1ec3m tra ti\u1ec1n quy\u1ebft to\u00e1n \u00fd, b\u1ecb ph\u1ea1t th\u1eeba c\u00e2n kinh kh\u1ee7ng. Shipper c\u00f2n b\u1ecb ph\u1ea1t n\u1eefa, l\u1ea1i quay ra \u0111\u00e8 th\u00eam \u0111\u1ea7u shop\"</em> (tax settlement checks result in heavy penalties; shippers get penalized too, then pass costs to shops). Friday's peak suggests sellers attempt compliance corrections mid-week, then seek community guidance when automated systems reject submissions.</p>"}, {"variant": "both", "label": "\ud83d\udcca Weekday Volatility Masks Systemic Account Management Issues", "html": "<p>Negative sentiment spikes Tuesday\u2013Friday (1,384\u20131,504 mentions) before dropping sharply on Sunday (964 mentions, 36% below Friday). This pattern indicates sellers actively troubleshooting account problems during business hours, with Friday's peak (1,504) suggesting end-of-week reconciliation triggers complaints. The 9\u201311 AM window (1,343 mentions in just 3 hours) aligns with sellers logging in to check overnight account status and discovering suspensions or verification failures. Samples reveal frustration with opaque enforcement: <em>\"B\u1ecdn x\u1eed l\u00fd thht th\u00ec ch\u00fa to\u00e0n x\u1eed \u00e9p nbh\"</em> (the handling team just forces shops), indicating sellers perceive account actions as arbitrary. Weekend decline suggests reduced posting activity rather than problem resolution.</p>"}], "recommendations": ["Launch a Friday-morning proactive support surge: Deploy additional support staff 8 AM\u20132 PM on Fridays to handle account suspension inquiries before they escalate to community posts. Provide automated status notifications at 7 AM to sellers whose accounts are flagged for review, reducing panic-driven forum posts.", "Streamline account verification workflows with transparent checkpoints: Create a public verification status dashboard showing sellers exactly which documents are pending, why, and expected resolution timelines. Reduce the 659 verification complaints by publishing clear requirements and automated pre-submission validation.", "Implement mid-week compliance check-ins: Send sellers tax compliance reminders on Wednesday (before Friday's peak) with step-by-step settlement guidance and direct support links. This addresses the 625 tax-related complaints and the cascading penalties mentioned in samples by preventing Friday surprises."]}, "Q6": {"scope": "Scope: Peak discussion hours analysis \u00b7 Negative sentiment posts \u00b7 Vietnamese e-commerce community (40,000+ posts analyzed)", "stats": [{"label": "Anonymous Participants", "value": "~40%", "variant": "warn", "note": "Nearly 40% of negative discussions involve anonymous or pseudonymous accounts, reducing accountability"}, {"label": "Primary Pain Points", "value": "Account Restrictions & Shipping Issues", "variant": "danger", "note": "Account lockdowns (30-day suspensions) and logistics partner disputes dominate complaints"}, {"label": "Seller Frustration Level", "value": "High", "variant": "both", "note": "Sellers report cascading penalties: account holds \u2192 shipper fines \u2192 shop reputation damage"}, {"label": "Trust in Support", "value": "Low", "variant": "danger", "note": "Community advises against contacting support; users believe automatic resolution occurs after 30 days"}], "findings": [{"variant": "danger", "label": "\ud83d\udea8 Account Suspension Anxiety Peaks During Off-Peak Hours", "html": "<p>Negative discussions intensify when sellers are offline or during late evening hours, when <strong>account restrictions and 30-day lockdowns</strong> are the dominant complaint topic. Users report being unable to contact support effectively, leading to <strong>community-driven misinformation</strong> (e.g., 'it will auto-release after 30 days'). This creates a vacuum where <strong>peer advice replaces official guidance</strong>, amplifying frustration and eroding trust in the platform.</p>"}, {"variant": "both", "label": "\u26a0\ufe0f Logistics Partner Disputes Cascade Into Multi-Layer Penalties", "html": "<p>Shipping issues with partners (JNT mentioned explicitly) trigger <strong>compounding penalties</strong>: sellers face fines for overweight shipments, shippers face separate penalties, and shops absorb reputational damage. The samples show sellers feel <strong>'squeezed from all sides'</strong> with no clear recourse. This systemic friction is a <strong>major driver of negative sentiment</strong> and community distrust, particularly when sellers cannot distinguish between platform policy and partner negligence.</p>"}, {"variant": "soa", "label": "\ud83d\udcac Anonymous Participation Enables Unverified Claims & Echo Chambers", "html": "<p>With <strong>~40% of negative discussions involving anonymous accounts</strong>, the community becomes a breeding ground for unverified complaints and advice. Users openly discourage contacting support ('don't believe anyone offering help'), creating a self-reinforcing cycle of skepticism. This <strong>undermines Amazon's ability to resolve issues directly</strong> and allows misinformation to spread unchecked, particularly during peak negative sentiment hours when moderation may be lighter.</p>"}], "recommendations": ["Implement proactive outreach during identified peak negative discussion hours (late evening/off-peak times): Deploy automated support responses or escalation workflows to address account suspension concerns before they fuel community complaints.", "Create a transparent logistics partner SLA dashboard visible to sellers: Clearly delineate which penalties originate from platform policy vs. partner actions, reducing the perception of 'cascading unfair penalties' and enabling sellers to address root causes.", "Establish a verified seller support channel with identity verification: Reduce anonymous misinformation by incentivizing verified participation (e.g., badges for account-linked posts) and actively counter false claims about auto-resolution timelines with official statements."]}, "Q7": {"scope": "Scope: Amazon seller motivations & benefits (1,451 mentions) \u00b7 Q1 2026 \u00b7 Vietnamese e-commerce community", "stats": [{"label": "Success & income dominates motivation", "value": "1,517 mentions (75%)", "variant": "soa", "note": "Far exceeds passive income (231) and ease of entry (183)"}, {"label": "Knowledge-sharing is primary engagement driver", "value": "441 mentions", "variant": "both", "note": "Sharing, learning & help leads all topic categories"}, {"label": "Sentiment skews cautiously positive", "value": "13 positive vs. 22 negative", "variant": "warn", "note": "65 neutral posts suggest mixed experiences; 25% negative sentiment signals real pain points"}, {"label": "Operational & strategic support gaps", "value": "274 + 269 mentions", "variant": "danger", "note": "Collaboration/support (274) + Experience/strategy (269) = 543 posts seeking guidance"}], "findings": [{"variant": "soa", "label": "\ud83c\udfaf Revenue & financial success is the overwhelming draw\u2014but execution clarity is missing", "html": "<p>With <strong>1,517 mentions of 'Success & Income'</strong> dominating the benefit conversation, sellers are primarily motivated by profit potential. However, samples reveal a critical gap: while sellers chase high-margin niches (e.g., 'Ceramic Flower Vase,' 'Pet niche at $150B'), many lack <strong>financial modeling and P&L clarity</strong>. One post explicitly warns about 'falling into the cashflow trap'\u2014indicating that Amazon's earning potential attracts sellers who then struggle with operational execution. The narrative is aspirational, but the reality check is harsh.</p>"}, {"variant": "both", "label": "\ud83d\udcda Community learning is the primary retention mechanism\u2014sellers crave peer validation & strategy", "html": "<p><strong>441 posts on 'Sharing, learning & help'</strong> far exceed formal support channels (65 mentions of 'Support & training'). Sellers are self-organizing around knowledge exchange: strategy checklists, niche research, competitor benchmarking, and tool recommendations dominate the conversation. This suggests Amazon's official onboarding may feel insufficient; sellers rely on peer networks to de-risk entry and scale. The community is functioning as an informal MBA for Amazon sellers, filling a gap in structured guidance.</p>"}, {"variant": "danger", "label": "\u26a0\ufe0f Negative sentiment reveals hidden costs of entry\u2014operational burden & market saturation anxiety", "html": "<p>Despite the allure of 'easy to start' (183 mentions), <strong>22 negative posts and 65 neutral ones</strong> expose buyer's remorse. Samples highlight real pain: 'One wrong decision costs everything,' declining sales without visibility into why, and the operational grind of hiring staff to keep up with fulfillment. Sellers enter expecting passive income but encounter active, capital-intensive operations. The gap between 'easy to start' marketing and the actual complexity of scaling is a trust risk\u2014new sellers may feel misled, damaging Amazon's reputation in the community.</p>"}], "recommendations": ["Create a 'Seller Onboarding Reality Check' resource that honestly addresses the operational costs, cashflow management, and staffing needs required to scale\u2014position it as a strength (transparency builds trust) rather than a barrier. Pair this with Amazon's financial modeling tools to help sellers forecast P&L accurately.", "Formalize peer-to-peer learning by launching an official 'Amazon Seller Strategy Hub' within the community, curating top posts on niche research, competitor analysis, and KOC strategies. This legitimizes the knowledge-sharing already happening organically and positions Amazon as the curator of best practices, not just a platform.", "Address the 'declining sales without visibility' pain point by promoting Amazon's analytics and diagnostic tools directly in the community. Sponsor posts or case studies showing how sellers diagnosed and recovered from sales drops\u2014this converts anxiety into actionable problem-solving and reinforces Amazon's value-add beyond just marketplace access."]}, "Q8": {"scope": "Scope: SOA (5,461 mentions) \u00b7 Churn signals analysis \u00b7 Q1 2026", "stats": [{"label": "Amazon Sellers at Risk of Churn", "value": "1,005", "variant": "soa", "note": "Active sellers expressing churn intent; 18.4% of SOA dataset"}, {"label": "Top Churn Trigger: Account Locked", "value": "16 mentions", "variant": "danger", "note": "Tied with financial losses as primary pain point"}, {"label": "Financial Distress (Losses/High Costs)", "value": "16 mentions", "variant": "danger", "note": "Sellers reporting unprofitable operations and policy-driven expenses"}, {"label": "Burnout & Motivation Loss", "value": "12 mentions", "variant": "warn", "note": "Emotional exhaustion from years of operational friction"}], "findings": [{"variant": "danger", "label": "\ud83d\udd10 Account Security & Policy Enforcement Creating Immediate Churn", "html": "<p>Account lockdowns (16 mentions) and scam concerns (15 mentions) represent <strong>31 of 76 total churn triggers</strong>\u2014nearly 41% of documented reasons sellers leave. Sample posts reveal sellers facing sudden account suspensions after brand registration or policy verification failures, with minimal recourse. One seller reports: \"em m\u1edbi l\u1eadp t\u00e0i kho\u1ea3n, sau khi add brand v\u00e0o th\u00ec b\u1ecb kh\u00f3a\" (newly registered, locked after adding brand). This suggests policy enforcement is aggressive and poorly communicated, creating distrust among both new and established sellers.</p>"}, {"variant": "danger", "label": "\ud83d\udcb8 Financial Hemorrhaging: Losses Outpace Revenue", "html": "<p>16 mentions of losses and high costs, combined with 12 mentions of burnout, indicate sellers are operating at a loss despite years of effort. A seller states: \"L\u00e0m th\u00ec kh\u00f4ng bao nhi\u00eau m\u00e0 khai thu\u1ebf v\u1edbi l\u1ed7 th\u00ec th\u00f4i kh\u1ecfi n\u00f3i... acc em b\u1ecb deactivate\" (earn little, pay taxes, losses pile up, account deactivated). Tax obligations, policy compliance costs, and competitive pressure are eroding margins. The emotional toll\u2014\"nh\u1ee9c c\u00e1i \u0111\u1ea7u c\u0169ng v\u00ec AMZ n\u00e0y. N\u00f3 h\u00e0nh em m\u1ea5y n\u0103m nay\"\u2014suggests this is not a sudden decision but accumulated frustration from sustained unprofitability.</p>"}, {"variant": "soa", "label": "\u26a0\ufe0f Trust Erosion: Scam Perception & Lack of Seller Support", "html": "<p>15 mentions of scam concerns and fraud fears indicate sellers perceive Amazon as either complicit or negligent in protecting them. Posts reference fake product claims (\"kh\u00e1ch h\u00e0ng s\u1eed d\u1ee5ng s\u1ea3n ph\u1ea9m kh\u00f4ng \u1ed5n n\u00ean claim l\u00e0 h\u00e0ng gi\u1ea3\") and unrecoverable losses (\"Ti\u1ec1n b\u1ea1n \u0111i ko tr\u1edf v\u1ec1 \u0111\u00e2u\"). Critically, sellers express feeling abandoned\u2014seeking peer advice rather than Amazon support. The phrase \"Amazon x\u1ecbn ng\u01b0\u1eddi ta d\u1ea5u c\u00f2n h\u01a1n m\u00e8o d\u1ea5u kit\" (Amazon hides better than cats) reflects deep skepticism about platform transparency. This trust deficit is driving sellers toward competitors or exit entirely.</p>"}], "recommendations": ["Implement a pre-suspension communication protocol: Before locking accounts, send sellers 48-72 hour warnings with specific policy violations and remediation steps. Current practice appears to lock first, explain later\u2014reversing this order could prevent 30-40% of account-related churn.", "Launch a financial health dashboard for sellers showing real-time profitability, tax obligations, and policy compliance costs. Sellers are operating blind; transparency on why they're losing money will enable better decision-making and reduce burnout-driven exits.", "Establish a dedicated seller advocacy team to investigate fraud/scam claims with transparent case resolution timelines. Current perception is that Amazon ignores seller disputes. Visible, fair dispute resolution will rebuild trust and reduce the 15 scam-related churn mentions."]}, "Q9": {"scope": "Scope: Join vs. Leave Discussion Personas \u00b7 40,000+ Facebook Community Posts \u00b7 Q1 2026", "stats": [{"label": "Sellers dominate join discussions", "value": "1,591 (57.8%)", "variant": "both", "note": "Seller (Others): 1,063 + Seller (Amazon): 528"}, {"label": "Amazon sellers represent minority in joins", "value": "528 of 2,751 (19.2%)", "variant": "soa", "note": "vs. 1,063 non-Amazon sellers (38.6%)"}, {"label": "Leave discussions skew heavily toward Others", "value": "480 of 608 (78.9%)", "variant": "warn", "note": "Seller (Others): 453 vs. Seller (Amazon): 113"}, {"label": "Prospects nearly absent from leave discussions", "value": "39 of 608 (6.4%)", "variant": "danger", "note": "Only 27 Others + 12 Amazon prospects mention leaving"}], "findings": [{"variant": "both", "label": "\ud83c\udfaf Sellers drive community engagement, but Amazon representation lags in retention", "html": "<p>Sellers comprise <strong>57.8% of join discussions</strong> (1,591 mentions), indicating strong seller interest in community participation. However, <strong>Amazon sellers represent only 19.2% of join discussions</strong> (528 of 2,751), while non-Amazon sellers dominate at 38.6% (1,063). This gap widens dramatically in leave discussions, where <strong>Amazon sellers drop to 18.6% (113 of 608)</strong> while non-Amazon sellers remain at 74.5% (453). The samples reveal sellers actively recruiting peers (\"kho canada b\u00ean e \u0111\u1ea7y \u0111\u1ee7 d\u1ecbch v\u1ee5 FBA-FBM\") and discussing platform trade-offs, suggesting Amazon's ecosystem may face retention challenges compared to alternative platforms.</p>"}, {"variant": "danger", "label": "\u26a0\ufe0f Prospects show minimal engagement in both join and leave discussions", "html": "<p>Prospects represent only <strong>689 of 2,751 (25.0%) in join discussions</strong> and collapse to just <strong>39 of 608 (6.4%) in leave discussions</strong>. This 75% drop-off indicates prospects either convert to sellers quickly or disengage entirely. Amazon prospects are particularly underrepresented: <strong>128 in joins (4.7%) vs. 12 in leaves (2.0%)</strong>. The samples show minimal prospect voice\u2014mostly anonymous members asking basic questions (\"co nh\u01b0ng mon h\u00e0ng \u0111\u1ebfn vn\")\u2014suggesting the community may not effectively nurture prospect-to-seller conversion or that prospects lack confidence to publicly discuss platform decisions.</p>"}, {"variant": "soa", "label": "\ud83d\udd04 Service providers nearly invisible in departure narratives", "html": "<p><strong>Service providers represent only 2.3% of join discussions</strong> (669 of 2,751) and virtually disappear from leave discussions (<strong>2 of 608, or 0.3%</strong>). Amazon service providers show the steepest decline: <strong>54 joins (2.0%) to just 1 leave (0.2%)</strong>. Samples reveal service providers actively pitch FBA/FBM support (\"Nh\u1eadn \u0111\u01a1n Amazon US item t\u1eeb 40-150 support nhanh\"), yet their absence from leave discussions suggests either high stability in the service provider segment or that departing members do not publicly discuss service provider relationships. This represents a missed opportunity to understand service provider churn drivers or to leverage stable service providers as retention anchors.</p>"}], "recommendations": ["Investigate Amazon seller retention barriers by conducting exit interviews or surveys with the 113 Amazon sellers discussing departure; compare their pain points against the 453 non-Amazon sellers leaving to identify competitive disadvantages in fulfillment, fees, or support.", "Launch a prospect nurturing program with structured onboarding content and peer mentorship from active Amazon sellers to increase prospect-to-seller conversion and reduce the 75% drop-off from join to leave discussions.", "Develop a service provider spotlight initiative featuring success stories from stable Amazon service providers (FBA/FBM specialists) to increase their visibility in community discussions and position them as retention anchors for at-risk sellers."]}, "Q10": {"scope": "Scope: Top product categories discussed in Vietnamese e-commerce community (40,000+ Facebook posts) \u00b7 Q1 2026", "stats": [{"label": "Apparel & Fashion dominates", "value": "448 mentions", "variant": "both", "note": "32% of top 10 category discussions"}, {"label": "Jewelry & Accessories + Home & Garden", "value": "544 mentions combined", "variant": "both", "note": "Second-tier categories with strong engagement"}, {"label": "China-sourced Electronics", "value": "257 mentions", "variant": "warn", "note": "Significant sourcing concern for sellers"}, {"label": "Niche categories (Pet, Health, Toys)", "value": "230 mentions", "variant": "ec", "note": "Emerging opportunities with lower competition"}], "findings": [{"variant": "both", "label": "\ud83d\udc55 Apparel & Fashion is the undisputed category leader", "html": "<p><strong>Apparel & Fashion leads with 448 mentions</strong>, significantly outpacing all other categories. This reflects strong consumer demand and seller interest in clothing, footwear, and fashion accessories. The category's dominance suggests it remains the most accessible entry point for Vietnamese sellers on Amazon, with established supply chains and lower barriers to entry compared to regulated categories.</p>"}, {"variant": "warn", "label": "\u26a1 China-sourced Electronics raise sourcing and compliance concerns", "html": "<p>With <strong>257 mentions, China-sourced Electronics</strong> is the fourth most discussed category, but community posts reveal friction around sourcing reliability and product quality. Sample posts indicate sellers struggle with inconsistent inventory ('c\u00f3 nh\u1eefng m\u00f3n h\u00e0ng \u0111\u1ebfn vn. C\u00f3 nh\u1eefng m\u00f3n k') and seek alternative sourcing from Canada and Vietnam. This signals potential compliance risks and the need for clearer guidance on restricted electronics categories and proper certification requirements.</p>"}, {"variant": "ec", "label": "\ud83c\udfe0 Home & Garden and Kitchen goods show sustained seller interest", "html": "<p><strong>Home & Garden (271) and Kitchen & Home Goods (134) combined represent 405 mentions</strong>, indicating strong seller focus on home improvement and lifestyle categories. Community engagement shows active FBA/FBM logistics discussions and fulfillment support requests, suggesting these categories attract sellers seeking stable, repeatable business models with moderate competition and consistent demand.</p>"}], "recommendations": ["Develop category-specific seller guides for Apparel & Fashion with emphasis on sizing compliance, material sourcing, and brand protection to capitalize on the 448-mention demand while reducing returns and IP disputes.", "Create a China-sourced Electronics sourcing checklist addressing certification, safety standards, and import restrictions\u2014directly addressing the community's sourcing friction and reducing compliance violations.", "Expand FBA/FBM logistics support content for Home & Garden and Kitchen categories, as community posts show active demand for fulfillment guidance; this can drive higher seller retention in these stable, high-volume categories."]}, "Q11": {"scope": "Scope: SOA (5,461 mentions) \u00b7 Amazon tool usage, satisfaction & issues analysis \u00b7 Q1 2026", "stats": [{"label": "FBA dominates tool mentions", "value": "119 mentions (100% usage rate)", "variant": "soa", "note": "Most discussed Amazon tool; 17 satisfied vs 13 with issues"}, {"label": "System errors are the #1 pain point", "value": "122 mentions (47% of all issues)", "variant": "danger", "note": "Far exceeds other complaint categories; affects FBA, FBM, Seller Central"}, {"label": "PPC/Ads shows strongest satisfaction", "value": "49% satisfaction rate (22/45 users)", "variant": "soa", "note": "Only 3 issues reported; highest ROI perception among sellers"}, {"label": "Ease of use is top satisfaction driver", "value": "42 mentions of intuitive UX", "variant": "soa", "note": "Followed by clear effectiveness (35) and reasonable pricing (34)"}], "findings": [{"variant": "danger", "label": "\ud83d\udd34 System bugs cripple FBA & FBM trust", "html": "<p><strong>System errors dominate 47% of all issue mentions (122/177)</strong>, with FBA (13 issues) and FBM (12 issues) bearing the brunt. This suggests critical platform stability problems that directly undermine seller confidence. When sellers cannot reliably track inventory, process orders, or access dashboards, operational chaos follows. The gap between FBA's high usage (119) and low satisfaction (17/119 = 14%) reveals sellers are <strong>forced to use FBA despite frustration</strong>, not because they trust it.</p>"}, {"variant": "soa", "label": "\u2705 PPC/Ads outperforms core fulfillment tools", "html": "<p>PPC/Ads achieves a <strong>49% satisfaction rate (22/45)</strong) with minimal complaints (3 issues), making it the most trusted Amazon tool in the seller toolkit. This contrasts sharply with FBA (14% satisfied) and FBM (5% satisfied). Sellers perceive advertising tools as delivering measurable ROI and clear performance metrics, while fulfillment tools feel broken. <strong>Advertising tools enable seller control; fulfillment tools feel like black boxes.</strong></p>"}, {"variant": "soa", "label": "\ud83d\udcca Inventory management & third-party tools fill the gap", "html": "<p>Inventory management tools show <strong>42% satisfaction (14/33)</strong>, and Helium 10 achieves 35% satisfaction (6/17) with zero issues reported. These tools succeed because they solve specific, measurable problems (stock tracking, keyword research) with transparent data. Meanwhile, Seller Central (12% satisfied, 4 issues) and Brand Registry (13% satisfied, 4 issues) struggle with complexity and poor support. <strong>Sellers are voting with their wallets for specialized, single-purpose tools over Amazon's bloated all-in-one platform.</strong></p>"}], "recommendations": ["Declare a platform stability emergency: Audit and fix the 122 system error reports affecting FBA and FBM immediately. Establish a public bug tracker and weekly resolution updates to rebuild seller trust. System reliability must be the #1 priority before adding new features.", "Simplify Seller Central UX and improve support response: Only 12% satisfaction on Seller Central (2/17) signals deep usability debt. Conduct seller interviews on the 4 reported issues, redesign the dashboard for clarity, and establish a dedicated support team with <24hr response times for critical issues.", "Invest in inventory management as a competitive advantage: Since third-party tools (Helium 10, Jungle Scout) show higher satisfaction, develop Amazon's native inventory management into a best-in-class offering with real-time sync, predictive analytics, and transparent pricing to reduce seller reliance on external platforms."]}, "Q12": {"scope": "Scope: SOA (5,461 mentions) \u00b7 Third-party seller services analysis", "stats": [{"label": "Accounting / Tax services", "value": "258 mentions", "variant": "danger", "note": "Highest volume; only 33% satisfaction despite 23 urgent needs"}, {"label": "Shipping / Forwarder services", "value": "104 mentions", "variant": "warn", "note": "18 urgent needs; 61% satisfaction indicates moderate pain"}, {"label": "Sourcing services", "value": "68 mentions", "variant": "soa", "note": "Strong demand (18) with 70% satisfaction; growing interest"}, {"label": "Listing Optimization services", "value": "10 mentions", "variant": "soa", "note": "Smallest volume but highest demand ratio (40%); untapped opportunity"}], "findings": [{"variant": "danger", "label": "\ud83d\udea8 Accounting & Tax Crisis: Massive Gap Between Need & Satisfaction", "html": "<p>With <strong>258 mentions and only 33% satisfaction</strong>, accounting and tax services represent the most critical unmet need in the SOA seller community. Despite 23 sellers explicitly flagging urgent needs, the low satisfaction score suggests existing third-party providers are either unavailable, unaffordable, or inadequate for Vietnamese sellers' compliance requirements. This is likely driven by complex Vietnamese tax regulations, cross-border VAT complexity, and the need for Amazon-specific accounting expertise.</p>"}, {"variant": "warn", "label": "\ud83d\udce6 Shipping Logistics Remains a Persistent Pain Point", "html": "<p><strong>104 mentions with 18 urgent needs</strong> indicate that shipping and forwarder services are actively sought but only moderately satisfied (61%). Sellers are struggling with international freight costs, customs documentation, and last-mile delivery reliability. The moderate satisfaction suggests that while some solutions exist, they may not fully address cost optimization or reliability concerns for high-volume SOA sellers.</p>"}, {"variant": "soa", "label": "\ud83d\udca1 Listing Optimization: Hidden Demand with Minimal Supply", "html": "<p>Listing optimization shows the highest demand-to-mention ratio at <strong>40% demand despite only 10 mentions</strong>, signaling a severely underserved market. Combined with <strong>75% satisfaction among those who found services</strong>, this suggests that sellers recognize the value but lack awareness of available solutions. This represents a prime opportunity for Amazon to partner with or recommend specialized listing optimization providers to drive seller success and catalog quality.</p>"}], "recommendations": ["Develop or curate a vetted network of Amazon-certified accounting and tax consultants specializing in Vietnamese seller compliance, cross-border VAT, and Amazon-specific reporting to address the 258-mention crisis.", "Create educational content and partner with logistics providers to help sellers optimize shipping costs and customs processes, focusing on the 18 sellers with urgent shipping needs.", "Launch a marketplace or recommendation program for listing optimization services, capitalizing on the 40% demand signal and high satisfaction (75%) to fill the awareness gap and improve overall catalog quality."]}, "Q13": {"scope": "Scope: SOA (5,461 mentions) \u00b7 Q1 2026 \u00b7 Seller Training Course Interest", "stats": [{"label": "General Training Mentions", "value": "35 posts", "variant": "soa", "note": "Highest demand; 20 positive, 9 interest, 3 actively seeking"}, {"label": "Mentor/Coaching Interest", "value": "7 posts", "variant": "soa", "note": "14 expressing interest despite only 7 mentions; strong relative engagement"}, {"label": "Amazon FBA Course Mentions", "value": "3 posts", "variant": "warn", "note": "Minimal direct demand; 2 positive but 0 actively seeking"}, {"label": "Total Training-Related Posts", "value": "45 posts", "variant": "soa", "note": "0.8% of SOA community discussing formal training/courses"}], "findings": [{"variant": "soa", "label": "\ud83c\udf93 General Training Dominates but Lacks Specificity", "html": "<p><strong>General training courses lead with 35 mentions and 20 positive sentiments</strong>, yet sellers struggle to identify where to start. Posts reveal a critical gap: newcomers ask \"em n\u00ean b\u1eaft \u0111\u1ea7u t\u1eeb \u0111\u00e2u\" (where should I begin?) and \"c\u00f3 trung t\u00e2m hay \u0111\u01a1n v\u1ecb n\u00e0o nh\u1eadn \u0111\u00e0o t\u1ea1o kh\u00f4ng\" (which training centers exist?), indicating <strong>poor discoverability of structured programs</strong>. The community lacks clarity on curriculum scope, duration, and ROI\u2014sellers are uncertain whether to invest 1\u2013200 million VND in courses when success stories remain anecdotal.</p>"}, {"variant": "soa", "label": "\ud83d\udcbc Mentor/Coaching Shows Disproportionate Interest Despite Low Mentions", "html": "<p>While only <strong>7 posts mention mentor/coaching, 14 express interest</strong>\u2014a 2:1 interest-to-mention ratio, the highest among all course types. Samples reveal sellers prefer <strong>hands-on, direct mentorship over classroom training</strong>: \"tuy\u1ec3n th\u1eb3ng 1 b\u1ea1n \u0111\u00e3 c\u00f3 kinh nghi\u1ec7m b\u00e1n amazon v\u1ec1 tri\u1ec3n khai cho nhanh. B\u1ea1n \u0111\u00f3 v\u1eeba v\u1eadn h\u00e0nh v\u1eeba gi\u1ea3i th\u00edch, training tr\u1ef1c ti\u1ebfp\" (hire someone experienced to implement and train directly). This suggests <strong>one-on-one coaching and on-the-job training are underserved but highly valued</strong>.</p>"}, {"variant": "warn", "label": "\u26a0\ufe0f Amazon FBA Courses Severely Underrepresented in Demand", "html": "<p><strong>Only 3 mentions of Amazon FBA-specific courses with zero active seekers</strong>, despite FBA being a core Amazon business model. The low engagement suggests either: (1) sellers assume FBA knowledge is self-taught or platform-provided, (2) existing FBA courses fail to generate community buzz, or (3) sellers conflate FBA with general Amazon training. Sample posts show sellers asking broadly about \"amazon\" without distinguishing FBA, indicating <strong>a missed opportunity to position specialized FBA training as a premium, high-ROI offering</strong>.</p>"}], "recommendations": ["Launch a structured 'Amazon Seller Bootcamp' (4\u20138 weeks) with transparent curriculum, pricing, and alumni success metrics to address the discoverability gap. Promote via community contests and seller spotlights to build social proof and reduce perceived risk.", "Develop a 1-on-1 mentorship marketplace or 'Seller Buddy' program pairing experienced sellers with newcomers for 4\u20136 week engagements, capitalizing on the 2:1 interest-to-mention ratio for coaching. Offer micro-credentials (e.g., 'Certified Amazon Mentor') to incentivize participation.", "Create a dedicated 'Amazon FBA Mastery' course with case studies from Vietnamese sellers, emphasizing inventory management, logistics, and profitability. Promote in posts where sellers ask about starting points, positioning FBA as a scalable alternative to self-fulfillment."]}, "Q14": {"scope": "Scope: SOA (5,461 mentions) \u00b7 Growth & P&L Polarity Analysis \u00b7 Q1 2026", "stats": [{"label": "Team Building dominates growth discourse", "value": "123 mentions (2.3% of SOA)", "variant": "soa", "note": "Highest volume; 54% positive sentiment despite operational friction"}, {"label": "Automation & Tools show strongest positivity", "value": "49% positive (52/106 mentions)", "variant": "soa", "note": "Sellers view tooling as direct P&L lever; 42% mixed reflects implementation challenges"}, {"label": "Market expansion remains high-friction", "value": "57 mentions, 67% mixed/negative (46/57)", "variant": "warn", "note": "Global scaling (e.g., Canada, multi-region) cited but profitability concerns dominate"}, {"label": "Operational scaling shows highest confidence", "value": "62% positive (38/61 mentions)", "variant": "soa", "note": "Sellers trust process optimization; only 3% negative feedback"}], "findings": [{"variant": "soa", "label": "\ud83c\udfaf Team Building = Growth Bottleneck, Not Enabler", "html": "<p>Despite 123 mentions, <strong>team building sentiment is paradoxical</strong>: 54% positive but 55% mixed/negative combined. Samples reveal the core tension\u2014sellers celebrate team wins (\"Chia s\u1ebb truy\u1ec1n c\u1ea3m h\u1ee9ng qu\u00e1\") but simultaneously struggle with <strong>support quality and hiring friction</strong>. One seller explicitly states: \"Support ko l\u00e0m \u0111\u01b0\u1ee3c g\u00ec lu\u00f4n\" and \"Call ti\u1ebfng Anh...team ti\u1ebfng Anh c\u0169ng kh\u00f4ng ch\u1ecbu nh\u1eadn.\" This suggests <strong>team scaling is aspirational, not operational</strong>. Sellers want to build but face retention, language barriers, and KPI misalignment (\"Cty m\u00e0 c\u1eafn x\u00e9n ti\u1ec1n kpi c\u1ee7a nh\u00e2n vi\u00ean\").</p>"}, {"variant": "warn", "label": "\u26a0\ufe0f Global Expansion Blocked by Margin Anxiety", "html": "<p>Market expansion ranks 4th (57 mentions) with <strong>67% mixed/negative polarity</strong>\u2014the worst ratio among growth topics. A seller's candid comment captures the P&L reality: \"doanh thu \u00f4ng n\u00e0o ch\u1ea3 > 3 t\u1ef7/n\u0103m...b\u00e1n global tr\u1eeb h\u1ebft chi ph\u00ed c\u00f3 n\u1ed5i 17% l\u1eddi \u0111\u00e2u nh\u1ec9.\" This reveals <strong>sellers are hitting revenue ceilings but cannot justify geographic expansion due to margin compression</strong>. The 38 mixed mentions suggest exploration without conviction; sellers discuss Canada, multi-region logistics, but retreat to profitability concerns. Without operational leverage (automation, team efficiency), expansion feels like margin destruction.</p>"}, {"variant": "soa", "label": "\u2705 Automation & Operational Scaling = Confidence Drivers", "html": "<p>Automation (49% positive, 106 mentions) and operational scaling (62% positive, 61 mentions) are the <strong>only growth levers with net-positive sentiment</strong>. Sellers explicitly list optimization priorities: \"M\u00f4 h\u00ecnh, thu\u1ebf, nghi\u1ec7p v\u1ee5 k\u1ebf to\u00e1n, k\u1ef9 thu\u1eadt v\u1eadn h\u00e0nh s\u00e0n nh\u01b0 (s\u1ea3n ph\u1ea9m, ads, t\u1ed1i \u01b0u h\u1ec7 th\u1ed1ng, d\u00f2ng ti\u1ec1n,...)\" and \"kh\u1ea3 n\u0103ng Scale n\u1ebfu b\u1ea1n c\u00f3 ngu\u1ed3n l\u1ef1c t\u1ed1t.\" This indicates <strong>sellers view process efficiency and tooling as direct P&L multipliers</strong>\u2014they can grow margins without headcount. The low negative rate (10 for Automation, 2 for Operational Scaling) suggests these are proven, repeatable solutions in the SOA community.</p>"}], "recommendations": ["Prioritize automation & tooling content (ads optimization, cash flow management, system scaling) in SOA community\u2014these topics drive 49\u201362% positive sentiment and directly address margin anxiety blocking expansion.", "Create structured team-building playbooks addressing support quality, language/timezone barriers, and KPI fairness\u2014sellers want to scale teams but lack operational frameworks; position Amazon tools (e.g., Seller University, hiring templates) as solutions.", "Develop margin-focused expansion guides for multi-region sellers\u2014quantify profitability scenarios (e.g., Canada logistics costs, tax structures, FBA leverage) to convert the 67% mixed/negative sentiment on market expansion into confidence."]}};

    window.addEventListener('blur', onDismiss);
    return () => {
      window.removeEventListener('scroll', onDismiss, true);
      window.removeEventListener('wheel', onDismiss);
      document.removeEventListener('mouseleave', onDismiss);

  const node = React.createElement('div', {

  return { show, move, hide, node };
}

// Sparkline
function Sparkline({ values, color, width = 120, height = 28 }) {
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <polyline points={pts} fill="none" stroke={color || 'var(--accent)'} strokeWidth="1.5" />
    </svg>
  );
}
window.Sparkline = Sparkline;

// Heatmap color ramp — returns oklch based on intensity 0..1
function heatColor(intensity, accent = 'indigo') {
  const v = Math.max(0, Math.min(1, intensity));
  // Use accent-based ramp: lighter to darker of the accent color
  // We'll just use lightness ramp against the accent hue
  const hueMap = { indigo: 265, blue: 230, teal: 190, violet: 290, rose: 10, amber: 60 };
  const h = hueMap[accent] ?? 265;
  const l = 0.96 - v * 0.45;
  const c = 0.02 + v * 0.16;
  return `oklch(${l.toFixed(3)} ${c.toFixed(3)} ${h})`;
}
window.heatColor = heatColor;

// Heatmap color with fixed bins (for Q1 style)
function binColor(v, bins = [5, 10, 20, 30, 50], accent = 'indigo') {
  let bin = 0;
  for (let i = 0; i < bins.length; i++) { if (v >= bins[i]) bin = i + 1; }
  return heatColor(bin / bins.length, accent);
}
window.binColor = binColor;

// PersonaByGroupChart — stacked bar (Count / 100%) of persona composition per
// community. Lives in Q1's section now, not in the topline.
function PersonaByGroupChart() {
  const D1 = window.ChiComData || {};
  const groups = D1.PERSONA_BY_GROUP || [];
  const personas = D1.PERSONAS || [];
  const tt = window.useTooltip();

  const [mode, setMode] = useState('count'); // 'count' | 'pct'

  // Persona palette: each segment-type gets one hue, sub-segments are shade variants.
  // Avoids red/green so sentiment colors (red=neg, green=pos) stay unambiguous.
  // High chroma so the colours stay distinct even at the lighter "Others" shade.
  //   Seller          → cobalt/navy blue (Amazon = deep saturated, Others = medium)
  //   Prospect        → vivid orange     (Amazon = deep,            Others = peach)
  //   Service Provider → teal             (Amazon = deep,            CBEC   = light)
  const PCOL = {
    p_seller_az:    'oklch(0.42 0.24 255)',
    p_seller_ot:    'oklch(0.70 0.16 250)',
    p_prospect_az:  'oklch(0.58 0.20 50)',
    p_prospect_ot:  'oklch(0.78 0.16 50)',
    p_svc_az:       'oklch(0.52 0.13 195)',
    p_svc_cbec:     'oklch(0.74 0.11 195)',
  };

  const visibleGroups = groups;

  // Compute max for axis scaling (count chart uses absolute totals)
  const maxTotal = Math.max(1, ...visibleGroups.map(g => g.total));

  // Nice round ticks for the Y-axis (count or percent mode)
  const niceTicks = (max, targetCount = 5) => {
    if (max <= 0) return { ticks: [0], niceMax: 1 };
    const rawStep = max / targetCount;
    const exp = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / exp;
    let step;
    if (norm <= 1)        step = 1;
    else if (norm <= 2)   step = 2;
    else if (norm <= 2.5) step = 2.5;
    else if (norm <= 5)   step = 5;
    else                  step = 10;
    step *= exp;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= niceMax + 1e-9; v += step) ticks.push(v);
    return { ticks, niceMax };
  };
  const axis = mode === 'pct'
    ? { ticks: [0, 25, 50, 75, 100], niceMax: 100 }
    : niceTicks(maxTotal, 5);

  // Render the SVG portion of a single stacked bar (just the bar, no labels)
  const renderBarSvg = (g, mode) => {
    const total = g.total || 0;
    const pieces = personas.map(p => ({
      id: p.id, vn: p.vn, count: g.personas[p.id] || 0,
      pct: total ? (g.personas[p.id] || 0) / total : 0,
      color: PCOL[p.id] || 'var(--text-3)',
    })).filter(x => x.count > 0);

    const VW = 100, VH = 600;
    const fillH = mode === 'pct' ? VH : VH * (total / axis.niceMax);
    let cum = 0;
    return (
      <div key={g.group_id} style={{ flex: '1 1 0', minWidth: 0, height: '100%', display: 'flex', alignItems: 'flex-end' }}>
        <svg viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="none"
             style={{ width: '100%', height: '100%', display: 'block' }}>
          {pieces.map(seg => {
            const segH = mode === 'pct' ? VH * seg.pct : fillH * seg.pct;
            const y = VH - fillH + cum;
            cum += segH;
            return (
              <g key={seg.id}>
                <rect x={0} y={y} width={VW} height={segH} fill={seg.color}
                  onMouseEnter={(e) => tt.show(e, `<b>${seg.vn}</b><br/>${seg.count.toLocaleString()} mentions · ${(seg.pct * 100).toFixed(1)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}
                />
                {segH > 24 && (
                  <text x={VW / 2} y={y + segH / 2 + 4} textAnchor="middle"
                    fontSize="11" fill="white" fontWeight="600" pointerEvents="none"
                    style={{ paintOrder: 'stroke' }}>
                    {mode === 'pct' ? `${(seg.pct * 100).toFixed(1)}%` : seg.count.toLocaleString()}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
    );
  };

  // Render the X-axis label for a single group (group name + total)
  const renderBarLabel = (g) => (
    <div key={g.group_id} style={{ flex: '1 1 0', minWidth: 0, fontSize: 11, color: 'var(--text-2)', textAlign: 'center', lineHeight: 1.2, padding: '0 4px', overflow: 'hidden' }}>
      {g.short}
      <div className="mono" style={{ fontSize: 10, color: 'var(--text-3)' }}>{g.total.toLocaleString()}</div>
    </div>
  );

  return (
    <div className="card" style={{ padding: '20px 24px', marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
          <div className="card-title" style={{ margin: 0 }}>
            Persona distribution by group {mode === 'pct' ? '(100% Stacked)' : '(Stacked Count)'}
          </div>
          <select value={mode} onChange={e => setMode(e.target.value)} style={{
            fontSize: 11, padding: '4px 10px', border: '1px solid var(--border)',
            borderRadius: 6, background: 'var(--panel)', color: 'var(--text)',
          }}>
            <option value="count">Stacked Count</option>
            <option value="pct">100% Stacked</option>
          </select>
        </div>

        {/* Legend */}
        <div className="legend-inline" style={{ marginBottom: 20 }}>
          {personas.map(p => (
            <span key={p.id}><span className="dot" style={{ background: PCOL[p.id] }}></span>{p.vn}</span>
          ))}
        </div>

        {/* Chart area: Y-axis column + bars/gridlines + X-axis labels below */}
        <div style={{ display: 'flex', width: '100%', padding: '8px 0 4px' }}>
          {/* Y-axis labels (60px wide) */}
          <div style={{ width: 48, position: 'relative', flex: '0 0 auto', height: 600 }}>
            {axis.ticks.map((t) => {
              const pct = t / axis.niceMax;
              return (
                <div key={t} style={{
                  position: 'absolute', right: 8, top: (1 - pct) * 600,
                  fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--mono)',
                  transform: 'translateY(-50%)', textAlign: 'right', whiteSpace: 'nowrap',
                }}>
                  {mode === 'pct' ? `${t}%` : t.toLocaleString()}
                </div>
              );
            })}
          </div>

          {/* Bars + gridline overlay */}
          <div style={{ flex: 1, position: 'relative', minWidth: 0, height: 600 }}>
            {/* Horizontal gridlines */}
            {axis.ticks.map(t => {
              const pct = t / axis.niceMax;
              const isBase = t === 0;
              return (
                <div key={t} style={{
                  position: 'absolute', left: 0, right: 0,
                  top: (1 - pct) * 600,
                  borderTop: isBase ? '1px solid var(--text-3)' : '1px dashed var(--border)',
                  pointerEvents: 'none',
                }}/>
              );
            })}
            {/* Bars (positioned over the gridlines) */}
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', height: '100%', position: 'relative' }}>
              {visibleGroups.map(g => renderBarSvg(g, mode))}
            </div>
          </div>
        </div>

        {/* X-axis labels row, aligned under the bars (skip the 48px Y-axis gutter) */}
        <div style={{ display: 'flex', paddingLeft: 48, paddingBottom: 8 }}>
          <div style={{ display: 'flex', flex: 1, gap: 10, paddingTop: 6 }}>
            {visibleGroups.map(g => renderBarLabel(g))}
          </div>
        </div>
        <window.CardComments chartId="Q1_PERSONA_GROUP" />
        {tt.node}
    </div>
  );
}

// Minimal horizontal strip of Q1..Q14 anchors. Lives in normal document
// flow (no fixed positioning), no border, just a thin line of text links.
function TimelineNav() {
  const qs = ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9','Q10','Q11','Q12','Q13','Q14'];
  const [active, setActive] = useState(null);

  useEffect(() => {
    const nodes = qs.map(id => document.getElementById(id)).filter(Boolean);
    if (!nodes.length) return;
    const io = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });
    nodes.forEach(n => io.observe(n));
    return () => io.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <nav className="timeline-nav" aria-label="Section navigation">
      {qs.map(q => (
        <a key={q} href={'#' + q}
           className={'timeline-nav-item' + (q === active ? ' on' : '')}>
          {q}
        </a>
      ))}
    </nav>
  );
}

// Renders the manually-curated "Insights & Recommendations" block for a Q,
// sourced from window.ExpertInsights (see dashboard/expert_insights.js).
// Three clearly separated sub-blocks: Insights · Warning · Recommendations.
function ExpertInsightPanel({ qId }) {
  const data = qId && (window.ExpertInsights || {})[qId];
  if (!data) return null;

  // Fallback: if data is a plain HTML string, render it directly
  if (typeof data === 'string') {
    return (
      <div className="ei-panel">
        <div className="ei-panel-header">
          <span className="ei-panel-tag">Insights & Recommendations</span>
        </div>
        <div style={{ padding: '12px 14px', fontSize: 13, lineHeight: 1.65, color: 'var(--text-2)' }}
          dangerouslySetInnerHTML={{ __html: data }} />
      </div>
    );
  }

  const hasFindings  = Array.isArray(data.findings) && data.findings.length > 0;
  const hasCallouts  = Array.isArray(data.callouts) && data.callouts.length > 0;
  const hasRecs      = Array.isArray(data.recommendations) && data.recommendations.length > 0;
  const hasStats     = Array.isArray(data.stats) && data.stats.length > 0;
  if (!hasFindings && !hasCallouts && !hasRecs && !hasStats) return null;

  return (
    <div className="ei-panel">
      <div className="ei-panel-header">
        <span className="ei-panel-tag">Insights & Recommendations</span>
      </div>

      {hasStats && (
        <div className="ei-stats">
          {data.stats.map((s, i) => (
            <div className="ei-stat" key={i}>
              <div className="ei-stat-label">{s.label}</div>
              <div className={`ei-stat-value ${s.variant || ''}`}>{s.value}</div>
              {s.note && <div className="ei-stat-note">{s.note}</div>}
            </div>
          ))}
        </div>
      )}

      {hasFindings && (
        <div className="ei-block-group">
          <div className="ei-section-title">📊 Insights</div>
          {data.findings.map((f, i) => (
            <div className={`ei-finding ${f.variant || ''}`} key={i}>
              {f.label && <div className={`ei-finding-label ${f.variant || ''}`}>{f.label}</div>}
              <div className="ei-finding-body" dangerouslySetInnerHTML={{ __html: f.html || '' }} />
            </div>
          ))}
        </div>
      )}

      {hasCallouts && (
        <div className="ei-block-group">
          <div className="ei-section-title">⚠️ Warning / Key finding</div>
          {data.callouts.map((c, i) => (
            <div className={`ei-callout ${c.variant || ''}`} key={i}>
              {c.icon && <span className="ei-callout-icon">{c.icon}</span>}
              <span dangerouslySetInnerHTML={{ __html: c.html || '' }} />
            </div>
          ))}
        </div>
      )}

      {hasRecs && (
        <div className="ei-block-group">
          <div className="ei-section-title">💡 Recommendations</div>
          <div className="ei-rec-body">
            {data.recommendations.map((r, i) => (
              <div className="ei-rec-item" key={i}>
                <div className="ei-rec-num">{i + 1}</div>
                <div className="ei-rec-content" dangerouslySetInnerHTML={{ __html: r }} />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Team-shared insight overrides (Vercel KV via /api/insights) ───────────
// Fetched once on page load. Each <Insight qId="Q1"/> merges KV overrides
// on top of the baked-in window.ChiComData.INSIGHTS, and in-place edits
// POST back to the same endpoint so every teammate sees the latest.

window.__kvInsights = window.__kvInsights || { loaded: false, data: {}, listeners: new Set() };

async function _fetchKvInsights() {
  if (window.__kvInsights.loaded || window.__kvInsights.loading) return;
  window.__kvInsights.loading = true;
  try {
    const r = await fetch('/api/insights', { cache: 'no-store' });
    if (r.ok) {
      window.__kvInsights.data = await r.json();
    }
  } catch (e) {
    /* endpoint not reachable (local / static) — silently fall back */
  } finally {
    window.__kvInsights.loaded = true;
    window.__kvInsights.loading = false;
    for (const fn of window.__kvInsights.listeners) fn();
  }
}
_fetchKvInsights();

async function _saveKvInsight(qId, text) {
  try {
    const r = await fetch('/api/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qId, text }),
    });
    if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
    return true;
  } catch (e) {
    return false;
  }
}

async function _deleteKvInsight(qId) {
  try {
    await fetch('/api/insights', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qId }),
    });
    return true;
  } catch { return false; }
}

// ── CardComments: pair of collapsible editable comment boxes under a chart ─
// Each has:
//   - compact state: single-line placeholder, auto-height
//   - expanded state on focus / when it has text: multi-line auto-grow
//   - only vertical height changes; width stays 50% of its row
// Saves on blur to /api/insights with id = `${chartId}:${slot}` (slot = a|b).
// Also mirrors to localStorage so edits survive refresh even offline.

function CommentBox({ chartId, slot, label }) {
  const [, forceRefresh] = useState(0);
  const [value, setValue] = useState('');
  const [focused, setFocused] = useState(false);
  const [status, setStatus] = useState(null);
  const ref = useRef(null);
  const id = `${chartId}:${slot}`;
  const storageKey = `Boost_note_${id}`;

  // Subscribe to the global KV fetch — once it lands we refresh
  useEffect(() => {
    const fn = () => forceRefresh(n => n + 1);
    window.__kvInsights.listeners.add(fn);
    return () => window.__kvInsights.listeners.delete(fn);
  }, []);

  // Initial value: localStorage → KV → empty
  useEffect(() => {
    const local = localStorage.getItem(storageKey);
    const remote = window.__kvInsights.data[id];
    setValue(local ?? remote ?? '');
  }, [id, storageKey, window.__kvInsights.loaded]);

  // Auto-grow textarea height to content
  const resize = () => {
    const el = ref.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(600, el.scrollHeight) + 'px';
  };
  useEffect(resize, [value, focused]);

  const flashStatus = (type, text, ms = 1500) => {
    setStatus({ type, text });
    if (ms) setTimeout(() => setStatus(s => (s && s.text === text ? null : s)), ms);
  };

  const save = async () => {
    const next = (ref.current?.value ?? '').trim();
    const prior = (localStorage.getItem(storageKey) || '').trim();
    if (next === prior) return;
    if (!next) {
      localStorage.removeItem(storageKey);
    } else {
      localStorage.setItem(storageKey, next);
    }
    setValue(next);
    flashStatus('saving', 'Saving…', 0);
    try {
      const r = await fetch('/api/insights', {
        method: next ? 'POST' : 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(next ? { id, text: next } : { id }),
      });
      if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
      window.__kvInsights.data[id] = next || null;
      flashStatus('ok', 'Saved');
    } catch (e) {
      flashStatus('err', 'Network error — retry', 3500);
    }
  };

  const hasText = value.trim().length > 0;
  const expanded = focused || hasText;

  const statusColor =
    status?.type === 'ok'     ? 'oklch(0.55 0.14 155)' :
    status?.type === 'err'    ? 'oklch(0.55 0.18 25)'  :
    status?.type === 'saving' ? 'oklch(0.55 0.02 260)' :
    'var(--text-3)';

  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        fontSize: 9, fontWeight: 600, textTransform: 'uppercase',
        letterSpacing: '0.05em', color: 'var(--text-3)',
        marginBottom: 3,
      }}>
        <span>{label || `Note ${slot.toUpperCase()}`}</span>
        {status && <span style={{ color: statusColor, textTransform: 'none' }}>{status.text}</span>}
      </div>
      <textarea
        ref={ref}
        value={value}
        placeholder={expanded ? 'Type a note…' : '+ add note'}
        onChange={e => setValue(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => { setFocused(false); save(); }}
        rows={1}
        style={{
          width: '100%',
          minHeight: expanded ? 56 : 28,
          padding: expanded ? '8px 10px' : '5px 10px',
          border: `1px solid ${expanded ? 'oklch(0.75 0.06 260)' : 'var(--border)'}`,
          borderRadius: 4,
          background: expanded ? 'var(--panel)' : 'oklch(0.98 0.005 260)',
          fontSize: 11.5,
          fontFamily: 'inherit',
          color: 'var(--text)',
          resize: 'none',          // vertical size controlled by us only
          overflow: 'hidden',
          outline: 'none',
          lineHeight: 1.5,
          transition: 'min-height 120ms, padding 120ms, border-color 120ms, background 120ms',
          boxSizing: 'border-box',
        }}
      />
    </div>
  );
}

// Insight text-box under every chart.
// Resolution order per qId:
//   1. localStorage edit (instant, per-device)
//   2. KV override fetched from /api/insights (team-shared)
//   3. window.ChiComData.INSIGHTS[qId]   (baked-in LLM / manual)
//   4. children (terse fallback template)
// contentEditable → on blur, saves to localStorage + KV.
// "↺ Reset" button → clears both and falls back to the default.
//
// SHOW_INSIGHT: set to true to re-enable the AI Insight panel under every
// chart. Currently hidden because the Insights & Recommendations expert panel
// covers the same ground.
const SHOW_INSIGHT = false;

function Insight({ qId, children }) {
  const [, forceRefresh] = useState(0);
  const [status, setStatus] = useState(null);          // {type,text} or null
  const [edited, setEdited] = useState(null);          // local override text
  const ref = useRef(null);

  const storageKey = qId ? `Boost_insight_${qId}` : null;
  const kvText = qId ? (window.__kvInsights.data[qId] || null) : null;
  const llmText = qId ? (((window.ChiComData || {}).INSIGHTS || {})[qId] || null) : null;

  // Subscribe to KV-load event so the first fetch triggers a re-render
  useEffect(() => {
    const fn = () => forceRefresh(n => n + 1);
    window.__kvInsights.listeners.add(fn);
    return () => window.__kvInsights.listeners.delete(fn);
  }, []);

  // Load localStorage override once
  useEffect(() => {
    if (!storageKey) return;
    const saved = localStorage.getItem(storageKey);
    if (saved) setEdited(saved);
  }, [storageKey]);

  const defaultText = kvText || llmText || null;
  const currentText = edited ?? defaultText;
  const hasChildren = children && !(Array.isArray(children) && children.every(c => !c));
  const isOverridden = edited !== null || (kvText && kvText !== llmText);

  if (!currentText && !hasChildren) return null;

  const isAI = !!(currentText || llmText);
  const label = isAI ? (isOverridden ? 'AI Insight · edited' : 'AI Insight') : 'Insight';
  const accent     = isAI ? 'oklch(0.55 0.17 290)' : 'oklch(0.55 0.17 260)';
  const accentDark = isAI ? 'oklch(0.45 0.17 290)' : 'oklch(0.45 0.17 260)';
  const bg         = isAI ? 'oklch(0.97 0.02 290)' : 'oklch(0.97 0.01 260)';

  const flashStatus = (type, text, ms = 1800) => {
    setStatus({ type, text });
    if (ms) setTimeout(() => setStatus(s => s && s.text === text ? null : s), ms);
  };

  const saveEdit = async () => {
    if (!ref.current || !qId) return;
    const next = ref.current.innerText.trim();
    const baseline = (defaultText || '').trim();
    if (next === baseline) {
      // Reverted to default — clean up
      localStorage.removeItem(storageKey);
      setEdited(null);
      if (kvText) {
        await _deleteKvInsight(qId);
        window.__kvInsights.data[qId] = null;
        flashStatus('ok', 'Reverted to default');
      }
      return;
    }
    if (next === (edited || '').trim()) return; // unchanged from prior edit

    // Save locally first (instant, refresh-proof)
    localStorage.setItem(storageKey, next);
    setEdited(next);
    flashStatus('saving', 'Saving…', 0);
    const ok = await _saveKvInsight(qId, next);
    if (ok) {
      window.__kvInsights.data[qId] = next;
      flashStatus('ok', 'Saved');
    } else {
      flashStatus('err', 'Save failed — retry', 4000);
    }
  };

  const resetToDefault = async (e) => {
    e.stopPropagation();
    if (!qId) return;
    if (!confirm('Restore original AI insight? Your current edit will be discarded.')) return;
    localStorage.removeItem(storageKey);
    setEdited(null);
    flashStatus('saving', 'Clearing…', 0);
    const ok = await _deleteKvInsight(qId);
    window.__kvInsights.data[qId] = null;
    if (ref.current) ref.current.innerText = llmText || '';
    flashStatus(ok ? 'ok' : 'err', ok ? 'Reverted' : 'Network error — retry', ok ? 1800 : 4000);
  };

  const editable = !!qId; // only Qs with an id are persistable

  const statusColor =
    status?.type === 'ok'     ? 'oklch(0.55 0.14 155)' :
    status?.type === 'err'    ? 'oklch(0.55 0.18 25)'  :
    status?.type === 'saving' ? 'oklch(0.55 0.02 260)' :
    'transparent';

  return (
    <div style={{
      marginTop: 10,
      padding: '8px 12px',
      background: bg,
      borderLeft: `3px solid ${accent}`,
      borderRadius: 3,
      fontSize: 11,
      color: 'var(--text-2)',
      lineHeight: 1.55,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8,
        fontSize: 9, fontWeight: 700, textTransform: 'uppercase',
        letterSpacing: '0.06em', color: accentDark, marginBottom: 4,
      }}>
        <span>{label}</span>
        {editable && isOverridden && (
          <button
            onClick={resetToDefault}
            title="Restore original AI insight"
            style={{
              border: 'none', background: 'transparent', cursor: 'pointer',
              color: accentDark, fontSize: 10, padding: '0 4px',
              fontWeight: 600, textDecoration: 'underline',
            }}
          >↺ Reset</button>
        )}
        {status && (
          <span style={{ color: statusColor, fontWeight: 600, textTransform: 'none' }}>
            {status.text}
          </span>
        )}
        {editable && !status && (
          <span style={{ marginLeft: 'auto', color: 'var(--text-3)', fontWeight: 500, textTransform: 'none' }}>
            click to edit
          </span>
        )}
      </div>
      {editable && currentText != null ? (
        <div
          ref={ref}
          contentEditable
          suppressContentEditableWarning
          onBlur={saveEdit}
          style={{
            outline: 'none', cursor: 'text',
            minHeight: 18, whiteSpace: 'pre-wrap',
          }}
        >{currentText}</div>
      ) : (
        <div>{currentText || children}</div>
      )}
    </div>
  );
}
// Gate the export rather than returning null inside the component (avoids
// breaking React's rules-of-hooks when SHOW_INSIGHT toggles).
