// Overview panel — Section 1 content (community + persona breakdown)
function OverviewPanel() {
  const tt = window.useTooltip();
  const ov = (window.ChiComData || {}).OVERVIEW;
  if (!ov) return null;

  // Non-sentiment palette — red and green are reserved for negative/positive
  // sentiment, so they're omitted here. Reuses TOPIC_COLORS where possible.
  const palette = window.TOPIC_COLORS || [
    'oklch(0.62 0.15 260)', 'oklch(0.62 0.15 80)',  'oklch(0.62 0.15 230)',
    'oklch(0.62 0.15 60)',  'oklch(0.62 0.15 320)', 'oklch(0.62 0.15 200)',
    'oklch(0.62 0.15 110)', 'oklch(0.62 0.15 290)', 'oklch(0.62 0.15 350)',
  ];

  const arc = (cx, cy, r, a0, a1) => {
    const large = a1 - a0 > 0.5 ? 1 : 0;
    const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
    const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
    return `M${cx},${cy} L${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} Z`;
  };

  const commTotal = ov.communities.reduce((a, b) => a + b.count, 0) || 1;
  let cAcc = 0;
  const commSeg = ov.communities.map((c, i) => {
    const s = cAcc; cAcc += c.count / commTotal;
    return { ...c, start: s, end: cAcc, color: palette[i % palette.length] };
  });

  // Persona-specific palette — must mirror PersonaByGroupChart's PCOL so
  // a given persona always renders in the same hue across the dashboard.
  // Red and green are reserved for negative / positive sentiment.
  const PERSONA_COLOR = {
    p_seller_az:   'oklch(0.42 0.24 255)',
    p_seller_ot:   'oklch(0.70 0.16 250)',
    p_prospect_az: 'oklch(0.58 0.20 50)',
    p_prospect_ot: 'oklch(0.78 0.16 50)',
    p_svc_az:      'oklch(0.52 0.13 195)',
    p_svc_cbec:    'oklch(0.74 0.11 195)',
  };
  const persTotal = ov.personas.reduce((a, b) => a + b.count, 0) || 1;
  let pAcc = 0;
  const persSeg = ov.personas.map((p) => {
    const s = pAcc; pAcc += p.count / persTotal;
    return { ...p, start: s, end: pAcc, color: PERSONA_COLOR[p.id] || 'oklch(0.55 0.10 290)' };
  });
  const maxComm = Math.max(...ov.communities.map(c => c.count), 1);

  const Narrative = ({ children }) => (
    <div style={{
      padding: '12px 16px',
      background: 'oklch(0.68 0.17 60 / 0.12)',
      borderLeft: '4px solid oklch(0.68 0.17 60)',
      borderRadius: 4,
      fontSize: 13,
      color: 'var(--text)',
      lineHeight: 1.55,
    }}>{children}</div>
  );

  return (
    <div style={{ display: 'grid', gap: 16 }}>
      <Narrative>
        <b>Post-IRR mentions by community:</b>{' '}
        Total mentions across <b>{ov.soaGroupCount} SOA groups</b> hold <b>{ov.soaPct}% SOV</b> trong{' '}
        <b>{ov.monthsCount} months</b>, . Within that, <b>{ov.topCommunity.name}</b> leads with{' '}
        <b>{ov.topCommunity.count.toLocaleString()}</b> mentions (~{ov.topCommunityPct}% SOV).
      </Narrative>

      <div className="grid-2" style={{ gap: 16 }}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Mentions by community</div>
            <span className="card-meta">{commTotal.toLocaleString()} total</span>
          </div>
          <div>
            {ov.communities.map((c, i) => (
              <div key={c.id} className="rowbar" style={{ gridTemplateColumns: '160px 1fr 60px' }}
                onMouseEnter={e => tt.show(e, `<b>${c.name}</b><br/>${c.count.toLocaleString()} mentions · ${c.type}`)}
                onMouseMove={tt.move} onMouseLeave={tt.hide}>
                <div style={{ fontSize: 11, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={c.name}>
                  <span className={`badge ${c.type === 'SOA' ? 'soa' : 'ec'}`} style={{ marginRight: 6 }}>{c.type}</span>
                  {c.short}
                </div>
                <div className="rowbar-track">
                  <div className="rowbar-fill" style={{ width: `${(c.count / maxComm) * 100}%`, background: palette[i % palette.length] }}></div>
                </div>
                <div className="rowbar-value mono">{c.count.toLocaleString()}</div>
              </div>
            ))}
          </div>
        
        <window.CardComments chartId="overview_1" />
      </div>

        <div className="card">
          <div className="card-head">
            <div className="card-title">Community distribution (% SOV)</div>
            <span className="card-meta">SOA {ov.soaPct}% · EC {ov.ecPct}%</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <svg width={200} height={200}>
              {commSeg.map(s => (
                <path key={s.id} d={arc(100, 100, 90, s.start, s.end)} fill={s.color}
                  stroke="var(--panel)" strokeWidth={1}
                  onMouseEnter={e => tt.show(e, `<b>${s.name}</b><br/>${s.count.toLocaleString()} · ${Math.round((s.count / commTotal) * 100)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
              ))}
            </svg>
            <div style={{ flex: 1, fontSize: 11, maxHeight: 200, overflowY: 'auto' }}>
              {commSeg.map(s => (
                <div key={s.id} style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 4 }}>
                  <span style={{ width: 9, height: 9, background: s.color, borderRadius: 2, flexShrink: 0 }}></span>
                  <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={s.name}>{s.short}</span>
                  <span className="mono" style={{ color: 'var(--text-3)' }}>{Math.round((s.count / commTotal) * 100)}%</span>
                </div>
              ))}
            </div>
          </div>
        
        <window.CardComments chartId="overview_2" />
      </div>
      </div>

<script type="text/babel">
/* global React, D, window */
const { useState, useRef } = React;

// ============ Q1 ============
function Q1() {
  const tt = window.useTooltip();
  const q1 = window.D.Q1_MASTER;
  const maxW = Math.max(...q1.map(m => m.weight));
  const soaOrder = window.D.SOA_GROUPS;
  const ecOrder = window.D.EC_GROUPS;
  const subTopics = window.D.Q1_SUBTOPICS || [];
  const maxSubW = subTopics.length ? Math.max(...subTopics.map(s => s.weight)) : 1;

  const TopicBars = () => (
    <div className="card" style={{ minHeight: 440 }}>
      <div className="card-head">
        <div>
          <div className="card-title">Overall topic weights</div>
        </div>
        <span className="card-meta">% mentions · avg across groups</span>
      </div>
      <div>
        {q1.map((m, i) => (
          <div key={m.id} className="rowbar"
            onMouseEnter={e => tt.show(e, `<b>${m.en}</b><br/>${m.vn} · ${m.weight}%`)}
            onMouseMove={tt.move} onMouseLeave={tt.hide}
            style={{ gridTemplateColumns: '280px 1fr 48px' }}>
            <div className="rowbar-label" title={m.vn}>
              <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: m.color, marginRight: 8, verticalAlign: 'middle' }}></span>
              {m.en}
            </div>
            <div className="rowbar-track">
              <div className="rowbar-fill" style={{ width: `${(m.weight / maxW) * 100}%`, background: m.color }}></div>
            </div>
            <div className="rowbar-value">{m.weight}%</div>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid var(--border)', fontSize: 11, color: 'var(--text-3)' }}>
        {window.D.MASTER_TOPICS.length} Master Topics · {(window.D.KPI && window.D.KPI.subTopics) || 0} sub-topics
      </div>
      <window.Insight qId="Q1">
        Leading master topic: <b>{q1[0].en || q1[0].vn}</b> ({q1[0].weight}%).
        Lowest with data: <b>{(() => { const m = [...q1].reverse().find(mt => mt.weight > 0); return m ? (m.en || m.vn) : '—'; })()}</b>.
        Top-bottom gap: {(q1[0].weight - (q1[q1.length - 1].weight || 0)).toFixed(1)} points.
      </window.Insight>
    
        <window.CardComments chartId="Q1_1" />
      </div>
  );

  const HeatGrid = ({ title, groups, accent }) => {
    const bins = [5, 10, 20, 30, 50];
    // Orientation: Master Topics as ROWS (full names, left), groups as COLUMNS (labels rotated at top)
    const cellW = 76;
    const cellH = 40;
    const rowGap = 4;
    const leftPad = 320;    // space for MT full names on the left
    const topPad = 140;     // space for rotated group labels at top
    const mts = window.D.MASTER_TOPICS;
    const svgHeight = topPad + mts.length * (cellH + rowGap) + 20;
    const svgWidth  = leftPad + groups.length * (cellW + 4) + 20;
    const cardMinHeight = svgHeight + 80;
    return (
      <div className="card" style={{ minHeight: cardMinHeight }}>
        <div className="card-head">
          <div>
            <div className="card-title">{title}</div>
          </div>
          <div className="legend legend-bins">
            {['0-5%', '5-10%', '10-20%', '20-30%', '30-50%'].map((label, i) => (
              <span key={label} className="legend">
                <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 5, accent) }}></span>
                {label}
              </span>
            ))}
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <svg width={svgWidth} height={svgHeight} style={{ display: 'block' }}>
            {/* Master Topic full names on the left (one row per MT) */}
            {mts.map((mt, mi) => {
              const y = topPad + mi * (cellH + rowGap) + cellH / 2 + 4;
              const label = mt.en.length > 46 ? mt.en.slice(0, 44) + '…' : mt.en;
              return (
                <text key={mt.id} x={leftPad - 10} y={y}
                  textAnchor="end" className="axis-tick"
                  style={{ fontSize: 11, fill: 'var(--text-2)' }}>
                  <title>{mt.vn}</title>{label}
                </text>
              );
            })}
            {/* Group labels — rotated at the top, one per column */}
            {groups.map((g, gi) => {
              const x = leftPad + gi * (cellW + 4) + cellW / 2;
              const anchorY = topPad - 12;
              return (
                <text key={g.id} x={x} y={anchorY}
                  textAnchor="start" className="axis-tick"
                  style={{ fontSize: 11 }}
                  transform={`rotate(-45 ${x} ${anchorY})`}>
                  <title>{g.name}</title>{g.short}
                </text>
              );
            })}
            {/* Cells: MT × Group */}
            {mts.map((mt, mi) => (
              groups.map((g, gi) => {
                const v = window.D.Q1_WEIGHTS[mt.id][g.id];
                const fill = window.binColor(v, bins, accent);
                const x0 = leftPad + gi * (cellW + 4);
                const y0 = topPad + mi * (cellH + rowGap);
                return (
                  <g key={g.id + mt.id}
                    onMouseEnter={e => tt.show(e, `<b>${g.short}</b><br/>${mt.en}<br/>${v}% mentions`)}
                    onMouseMove={tt.move} onMouseLeave={tt.hide}
                    style={{ cursor: 'pointer' }}>
                    <rect x={x0} y={y0} width={cellW} height={cellH} fill={fill} rx={3} />
                    <text x={x0 + cellW / 2} y={y0 + cellH / 2 + 4}
                      textAnchor="middle" className="axis-tick"
                      pointerEvents="none"
                      style={{ fill: v > 20 ? 'white' : 'var(--text-2)', fontSize: 11, fontWeight: 500 }}>
                      {v}%
                    </text>
                  </g>
                );
              })
            ))}
          </svg>
        </div>
        <div style={{ marginTop: 10, fontSize: 11, color: 'var(--text-3)' }}>
          {mts.length} Master Topics × {groups.length} groups · hover a cell for details
        </div>
        {(() => {
          // Find top (MT, group) cell
          let best = { mt: null, g: null, v: -1 };
          mts.forEach(mt => groups.forEach(g => {
            const v = window.D.Q1_WEIGHTS[mt.id][g.id];
            if (v > best.v) best = { mt, g, v };
          }));
          // Most concentrated group (highest max MT share)
          const grpMax = groups.map(g => ({
            g,
            top: mts.reduce((acc, mt) => {
              const v = window.D.Q1_WEIGHTS[mt.id][g.id];
              return v > acc.v ? { mt, v } : acc;
            }, { mt: null, v: 0 }),
          }));
          return (
            <window.Insight>
              Hottest cell: <b>{best.g.short}</b> allocates <b>{best.v}%</b> to <b>{best.mt.en}</b>.
              {grpMax[0] && <> Most concentrated group: <b>{grpMax.sort((a, b) => b.top.v - a.top.v)[0].g.short}</b> ({grpMax[0].top.v}%).</>}
            </window.Insight>
          );
        })()}
      
        <window.CardComments chartId="Q1_2" />
      </div>
    );
  };

  const SubTopicBars = () => {
    const displayedSubs = subTopics.filter(s => s.display !== false);
    const hiddenCount = subTopics.length - displayedSubs.length;
    const maxSubWDisplay = displayedSubs.length ? Math.max(...displayedSubs.map(s => s.weight)) : 1;

    return (
    <div className="card" style={{ minHeight: 440 }}>
      <div className="card-head">
        <div>
          <div className="card-title">Overall sub-topic weights</div>
        </div>
        <span className="card-meta">{displayedSubs.length} sub-topics{hiddenCount > 0 ? ` (+${hiddenCount} hidden)` : ''} · % of all mentions</span>
      </div>
      <div>
        {displayedSubs.map((s, i) => (
          <div key={s.vn} className="rowbar"
            onMouseEnter={e => tt.show(e, `<b>${s.en || s.vn}</b><br/>${s.vn}<br/>${s.count.toLocaleString()} mentions · ${s.weight}%`)}
            onMouseMove={tt.move} onMouseLeave={tt.hide}
            style={{ gridTemplateColumns: '360px 1fr 48px' }}>
            <div className="rowbar-label" title={s.vn} style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              <span style={{ display: 'inline-block', width: 8, height: 8, borderRadius: 2, background: s.color, marginRight: 8, verticalAlign: 'middle' }}></span>
              {s.en || s.vn}
            </div>
            <div className="rowbar-track">
              <div className="rowbar-fill" style={{ width: `${(s.weight / maxSubWDisplay) * 100}%`, background: s.color }}></div>
            </div>
            <div className="rowbar-value">{s.weight}%</div>
          </div>
        ))}
        {!displayedSubs.length && (
          <div style={{ padding: '24px 8px', fontSize: 12, color: 'var(--text-3)' }}>
            No sub-topic data available (the <code>sub_topic</code> column is empty).
          </div>
        )}
      </div>
      <window.CardComments chartId="Q1_SUB" />
    </div>
    );
  };

  return (
    <>
      <div className="grid-2" style={{ display: 'grid', gap: 16 }}>
        <TopicBars />
        <SubTopicBars />
      </div>
      <div className="grid-12" style={{ marginTop: 16, display: 'grid', gap: 16 }}>
        <div className="col-12">
          <HeatGrid
            title={<>SOA groups — Weight <span className="badge soa">{window.D.SOA_GROUPS.length} groups</span></>}
            groups={window.D.SOA_GROUPS}
            accent="rose"
          />
        </div>
        <div className="col-12">
          <HeatGrid
            title={<>EC groups — Weight <span className="badge ec">{window.D.EC_GROUPS.length} groups</span></>}
            groups={window.D.EC_GROUPS}
            accent="teal"
          />
        </div>
      </div>
      {tt.node}
    </>
  );
}
window.Q1 = Q1;

// ============ Q2 — Persona × Master Topic heatmap ============

// Shared heatmap renderer — takes a matrix + title + accent, renders the
// same structure as the original Q2 chart. Used for both SOA and EC splits
// when available (and as a fallback for the global view otherwise).
function Q2Heatmap({ matrix, title, badge, accent, chartId, tt, personas, mts }) {
  const max = Math.max(1, ...mts.flatMap(mt => personas.map(p => matrix[mt.id][p.id])));
  const cellW = 96, cellH = 42;
  const leftPad = 340;
  const topPad = 120;
  const w = leftPad + personas.length * cellW + 20;
  const h = topPad + mts.length * cellH + 20;
  const bins = ['0–50', '51–150', '151–300', '301–500', '500+'];

  return (
    <div className="card">
      <div className="card-head">
        <div>
          <div className="card-title">{title} {badge}</div>
        </div>
        <div className="legend legend-bins">
          {bins.map((label, i) => (
            <span key={label} className="legend">
              <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 5, accent) }}></span>
              {label}
            </span>
          ))}
        </div>
      </div>
      <div style={{ overflowX: 'auto' }}>
        <svg width={w} height={h} style={{ display: 'block' }}>
          {personas.map((p, pi) => {
            const x = leftPad + pi * cellW + cellW / 2;
            const anchorY = topPad - 14;
            const label = p.vn.length > 22 ? p.vn.slice(0, 21) + '…' : p.vn;
            return (
              <g key={p.id}>
                <text x={x} y={anchorY}
                  textAnchor="start" className="axis-tick"
                  style={{ fontSize: 11 }}
                  transform={`rotate(-45 ${x} ${anchorY})`}>
                  <title>{p.vn}</title>{label}
                </text>
              </g>
            );
          })}
          {mts.map((mt, mi) => (
            <g key={mt.id}>
              <text x={leftPad - 12} y={topPad + mi * cellH + cellH / 2 + 4}
                textAnchor="end" className="axis-tick" style={{ fontSize: 11, fill: 'var(--text-2)' }}>
                {mt.en.length > 48 ? mt.en.slice(0, 46) + '…' : mt.en}
              </text>
              {personas.map((p, pi) => {
                const v = matrix[mt.id][p.id];
                const intensity = Math.pow(v / max, 0.7);
                return (
                  <g key={p.id}>
                    <rect
                      x={leftPad + pi * cellW + 3}
                      y={topPad + mi * cellH + 3}
                      width={cellW - 6} height={cellH - 6}
                      fill={window.heatColor(intensity, accent)}
                      rx={3}
                      onMouseEnter={e => tt.show(e, `<b>${p.vn}</b> × ${mt.en.slice(0, 36)}…<br/>${v} mentions`)}
                      onMouseMove={tt.move} onMouseLeave={tt.hide}
                      style={{ cursor: 'pointer' }}
                    />
                    <text
                      x={leftPad + pi * cellW + cellW / 2}
                      y={topPad + mi * cellH + cellH / 2 + 4}
                      textAnchor="middle"
                      className="mono"
                      style={{ fontSize: 11, fill: intensity > 0.45 ? 'white' : 'var(--text-2)' }}>
                      {v}
                    </text>
                  </g>
                );
              })}
            </g>
          ))}
        </svg>
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q2() {
  const tt = window.useTooltip();
  const personas = window.D.PERSONAS;
  const mts = window.D.MASTER_TOPICS;

  // Prefer split matrices when the build pipeline has emitted them.
  const hasSplit = window.D.Q2_MATRIX_SOA && window.D.Q2_MATRIX_EC;
  const matrixForInsight = window.D.Q2_MATRIX;

  // Insight calc uses the global matrix so numbers align with KPIs.
  let best = { p: null, mt: null, v: -1 };
  mts.forEach(mt => personas.forEach(p => {
    const v = matrixForInsight[mt.id][p.id];
    if (v > best.v) best = { p, mt, v };
  }));
  const personaTotals = personas.map(p => ({
    p,
    total: mts.reduce((s, mt) => s + matrixForInsight[mt.id][p.id], 0),
  }));
  personaTotals.sort((a, b) => b.total - a.total);

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-12">
            <Q2Heatmap
              matrix={window.D.Q2_MATRIX_SOA}
              title="SOA — Master Topics by Persona"
              badge={<span className="badge soa">{window.D.SOA_GROUPS.length} groups</span>}
              accent="rose"
              chartId="Q2_1"
              tt={tt} personas={personas} mts={mts}
            />
          </div>
          <div className="col-12">
            <Q2Heatmap
              matrix={window.D.Q2_MATRIX_EC}
              title="EC — Master Topics by Persona"
              badge={<span className="badge ec">{window.D.EC_GROUPS.length} groups</span>}
              accent="teal"
              chartId="Q2_2"
              tt={tt} personas={personas} mts={mts}
            />
          </div>
        </>
      ) : (
        <div className="col-12">
          <Q2Heatmap
            matrix={window.D.Q2_MATRIX}
            title="Master Topics by Persona"
            badge={null}
            accent="indigo"
            chartId="Q2_1"
            tt={tt} personas={personas} mts={mts}
          />
        </div>
      )}

      <div className="col-12">
        <window.Insight qId="Q2">
          Densest cell: <b>{best.p.vn}</b> × <b>{best.mt.en}</b> with <b>{best.v.toLocaleString()}</b> mentions.
          Highest-total persona: <b>{personaTotals[0].p.vn}</b> ({personaTotals[0].total.toLocaleString()}).
        </window.Insight>
      </div>

      {tt.node}
    </div>
  );
}
window.Q2 = Q2;

</script>
<script type="text/babel">
/* global React, D, window */
const { useState: useStateQ3 } = React;

// ============ Q3 — Seller vs Prospect deep dive ============
function Q3() {
  const tt = window.useTooltip();
  const q3 = [...window.D.Q3_SELLER_PROSPECT].sort((a, b) => Math.max(b.sellerPct, b.prospectPct) - Math.max(a.sellerPct, a.prospectPct));

  const sellerColor = 'oklch(0.50 0.16 245)';
  const prospectColor = 'oklch(0.55 0.17 55)';

  // Sub-topic difference — each bar uses its parent master-topic color
  const subs = [...window.D.Q3_SUBS].sort((a, b) => b.diff - a.diff);
  const absMax = Math.max(...subs.map(s => Math.abs(s.diff))) + 1;
  // Fallback color for any sub-topic missing .color
  const defaultColor = 'oklch(0.62 0.15 260)';

  return (

        <div className="card">

              <div className="card-title">{window.D.MASTER_TOPICS.length} Master Topics — Seller vs Prospect</div>
            </div>
            <div className="legend-inline">
              <span><span className="dot" style={{ background: sellerColor }}></span>Seller</span>
              <span><span className="dot" style={{ background: prospectColor }}></span>Prospect</span>
            </div>
          </div>
          <div>
            {q3.map(r => (
              <div key={r.id} style={{ padding: '6px 0', borderBottom: '1px solid var(--border)' }}>
                <div style={{ fontSize: 12, marginBottom: 4, color: 'var(--text)', display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{r.en}</span>
                  <span className="mono" style={{ fontSize: 11, color: 'var(--text-3)' }}>
                    S {r.sellerPct}% · P {r.prospectPct}%

                </div>
                <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}
                  onMouseEnter={e => tt.show(e, `<b>${r.en}</b><br/>Seller ${r.sellerPct}% · Prospect ${r.prospectPct}%<br/>diff ${r.diff > 0 ? '+' : ''}${r.diff}pp`)}

                  <div style={{ flex: 1, display: 'flex', gap: 2, flexDirection: 'column' }}>
                    <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 2 }}>
                      <div style={{ width: `${(r.sellerPct / max) * 100}%`, height: '100%', background: sellerColor, borderRadius: 2 }}></div>
                    </div>
                    <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 2 }}>
                      <div style={{ width: `${(r.prospectPct / max) * 100}%`, height: '100%', background: prospectColor, borderRadius: 2 }}></div>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {(() => {
            const sellerLead = [...q3].sort((a, b) => b.diff - a.diff)[0];
            const prospectLead = [...q3].sort((a, b) => a.diff - b.diff)[0];
            return (
              <window.Insight qId="Q3">
                Seller dominates: <b>{sellerLead.en}</b> (+{sellerLead.diff}pp) ·
                Prospect dominates: <b>{prospectLead.en}</b> ({prospectLead.diff}pp).
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q3_1" />
      </div>
      </div>

      <div className="col-6">
        <div className="card" style={{ minHeight: 520 }}>
          <div className="card-head">
            <div>
              <div className="card-title">Sub-topic difference</div>
              <div className="card-sub">Bars colored by parent master topic</div>
            </div>
          </div>
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            fontSize: 10, color: 'var(--text-3)', padding: '0 6px 4px',
          }}>
            <span>← Prospect dominates</span>
            <span style={{ color: 'var(--text-2)' }}>{subs.length} sub-topics</span>
            <span>Seller dominates →</span>
          </div>
          <svg width="100%" height={subs.length * 20 + 30} viewBox={`0 0 640 ${subs.length * 20 + 30}`} preserveAspectRatio="none">
            <line x1={320} y1={0} x2={320} y2={subs.length * 20} className="axis-line" />
            {subs.map((s, i) => {
              const y = i * 20;
              const barW = (Math.abs(s.diff) / absMax) * 300;
              const x = s.diff >= 0 ? 320 : 320 - barW;
              return (
                <g key={i}
                  onMouseEnter={e => tt.show(e, `<b>${s.en || s.vn}</b><br/>${s.vn}<br/>Seller ${s.seller}% · Prospect ${s.prospect}%<br/>diff ${s.diff > 0 ? '+' : ''}${s.diff}pp`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}>
                  <text x={315} y={y + 14} textAnchor={s.diff >= 0 ? 'end' : 'start'} className="axis-tick" style={{ fontSize: 10 }}>
                    {(s.en || s.vn).length > 34 ? (s.en || s.vn).slice(0, 32) + '…' : (s.en || s.vn)}
                  </text>
                  <rect x={x} y={y + 5} width={barW} height={12} fill={s.color || defaultColor} rx={2} />
                  <text x={s.diff >= 0 ? x + barW + 4 : x - 4} y={y + 14}
                    textAnchor={s.diff >= 0 ? 'start' : 'end'}
                    className="mono" style={{ fontSize: 10, fill: 'var(--text-3)' }}>
                    {s.diff > 0 ? '+' : ''}{s.diff}
                  </text>
                </g>
              );
            })}
          </svg>
          {(() => {
            const biggestGap = [...subs].sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff))[0];
            return (
              <window.Insight>
                Sub-topic with the largest Seller/Prospect gap: <b>{biggestGap.en || biggestGap.vn}</b> ({biggestGap.diff > 0 ? '+' : ''}{biggestGap.diff}pp).
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q3_2" />
      </div>
      </div>

      {tt.node}
    </div>
  );
}
window.Q3 = Q3;

// ============ Q4 — Trends over time ============
function Q4() {
  const tt = window.useTooltip();
  // Single-month datasets (e.g. April-only build) collapse the monthly view to
  // a single point. Auto-switch to weekly granularity in that case so the
  // chart has something to draw across the time axis.
  const useWeekly = (window.D.MONTHS || []).length < 2;
  const trends = useWeekly ? window.D.Q4_WEEKLY : window.D.Q4_TRENDS;
  const months = useWeekly ? window.D.WEEKS : window.D.MONTHS;
  const granLabel = useWeekly ? 'weekly' : 'monthly';
  const W = 700, H = 280, pad = { t: 20, r: 20, b: 30, l: 40 };
  const maxY = Math.max(...trends.flatMap(t => t.points));
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;

  const linePts = (pts) => pts.map((v, i) => {
    const x = pad.l + (i / Math.max(pts.length - 1, 1)) * plotW;
    const y = pad.t + plotH - (v / maxY) * plotH;
    return [x, y];
  });

  // Stacked percentage area chart
  const stacked = months.map((m, mi) => {
    const total = trends.reduce((a, t) => a + (t.points[mi] || 0), 0) || 1;
    let acc = 0;
    return trends.map(t => {
      const frac = (t.points[mi] || 0) / total;
      const seg = { start: acc, end: acc + frac, id: t.id, color: t.color };
      acc += frac;
      return seg;
    });
  });

  const stackedPath = (tIdx) => {
    const topPts = stacked.map((s, mi) => [pad.l + (mi / Math.max(months.length - 1, 1)) * plotW, pad.t + plotH - s[tIdx].end * plotH]);
    const botPts = stacked.map((s, mi) => [pad.l + (mi / Math.max(months.length - 1, 1)) * plotW, pad.t + plotH - s[tIdx].start * plotH]).reverse();
    return [...topPts, ...botPts].map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ') + ' Z';
  };

  // weekly with events
  const weekly = window.D.Q4_WEEKLY;
  const weeks = window.D.Q4_EVENTS;
  const WW = 820, WH = 320, wpad = { t: 64, r: 240, b: 32, l: 44 };
  const maxWY = Math.max(...weekly.flatMap(t => t.points));
  const wPlotW = WW - wpad.l - wpad.r, wPlotH = WH - wpad.t - wpad.b;
  const weekRangeLabel = (window.D.WEEKS && window.D.WEEKS.length)
    ? `${window.D.WEEKS[0]} — ${window.D.WEEKS[window.D.WEEKS.length - 1]} · weekly`
    : 'weekly';

  return (
    <div className="grid-12">
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Master Topics — absolute counts</div>
            </div>
            <span className="card-meta">{granLabel}</span>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <g key={i}>
                <line x1={pad.l} y1={pad.t + plotH * f} x2={W - pad.r} y2={pad.t + plotH * f} className="grid-line" />
                <text x={pad.l - 6} y={pad.t + plotH * f + 3} textAnchor="end" className="axis-tick">
                  {Math.round(maxY * (1 - f))}
                </text>
              </g>
            ))}
            {months.map((m, i) => (
              <text key={m} x={pad.l + (i / Math.max(months.length - 1, 1)) * plotW} y={H - 10} textAnchor="middle" className="axis-tick">{m}</text>
            ))}
            {trends.map((t, ti) => {
              const pts = linePts(t.points);
              const d = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');
              return (
                <g key={t.id}>
                  <path d={d} fill="none" stroke={t.color} strokeWidth={1.5} />
                  {pts.map(([x, y], pi) => (
                    <circle key={pi} cx={x} cy={y} r={2.5} fill={t.color}
                      onMouseEnter={e => tt.show(e, `<b>${t.en.slice(0, 40)}…</b><br/>${months[pi]} · ${t.points[pi]}`)}
                      onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
                  ))}
                </g>
              );
            })}
          </svg>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 4, fontSize: 10, marginTop: 8 }}>
            {trends.map((t, i) => (
              <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text-2)' }}>
                <span style={{ width: 10, height: 10, background: t.color, borderRadius: 2, flexShrink: 0 }}></span>
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>MT{i + 1} · {t.en.slice(0, 24)}…</span>
              </div>
            ))}
          </div>
        
        <window.CardComments chartId="Q4_1" />
      </div>
      </div>

      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Master Topics — % distribution</div>
            </div>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
            {trends.map((t, ti) => (
              <path key={t.id} d={stackedPath(ti)} fill={t.color} opacity={0.85}
                onMouseEnter={e => tt.show(e, `<b>${t.en.slice(0, 40)}…</b>`)}
                onMouseMove={tt.move} onMouseLeave={tt.hide} />
            ))}
            {months.map((m, i) => (
              <text key={m} x={pad.l + (i / Math.max(months.length - 1, 1)) * plotW} y={H - 10} textAnchor="middle" className="axis-tick">{m}</text>
            ))}
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <text key={i} x={pad.l - 6} y={pad.t + plotH * f + 3} textAnchor="end" className="axis-tick">
                {Math.round((1 - f) * 100)}%
              </text>
            ))}
          </svg>
        
        <window.CardComments chartId="Q4_2" />
      </div>
      </div>

      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Weekly topic trends</div>
            </div>
            <span className="card-meta">{weekRangeLabel}</span>
          </div>
          <svg width="100%" viewBox={`0 0 ${WW} ${WH}`} style={{ display: 'block' }}>
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <line key={i} x1={wpad.l} y1={wpad.t + wPlotH * f} x2={WW - wpad.r} y2={wpad.t + wPlotH * f} className="grid-line" />
            ))}
            {weeks.map((ev, i) => {
              const x = wpad.l + (ev.week / (window.D.WEEKS.length - 1)) * wPlotW;
              // 3-row stagger so adjacent spike labels don't collide
              const yOffset = [-46, -30, -14][i % 3];
              return (
                <g key={i}>
                  <line x1={x} y1={wpad.t} x2={x} y2={wpad.t + wPlotH} stroke="var(--neg)" strokeDasharray="3 3" strokeWidth={1} opacity={0.6} />
                  <line x1={x} y1={wpad.t + yOffset + 2} x2={x} y2={wpad.t} stroke="var(--neg)" strokeWidth={1} opacity={0.35} />
                  <text x={x} y={wpad.t + yOffset} textAnchor="middle" className="axis-tick" style={{ fill: 'var(--neg)', fontSize: 10 }}>{ev.label}</text>
                </g>
              );
            })}
            {weekly.map(t => {
              const pts = t.points.map((v, i) => {
                const x = wpad.l + (i / (t.points.length - 1)) * wPlotW;
                const y = wpad.t + wPlotH - (v / maxWY) * wPlotH;
                return [x, y];
              });
              const d = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');
              return (
                <g key={t.id}>
                  <path d={d} fill="none" stroke={t.color} strokeWidth={2} />
                  {pts.map(([x, y], pi) => (
                    <circle key={pi} cx={x} cy={y} r={2.5} fill={t.color} />
                  ))}
                </g>
              );
            })}
            {window.D.WEEKS.map((w, i) => i % 2 === 0 && (
              <text key={w} x={wpad.l + (i / (window.D.WEEKS.length - 1)) * wPlotW} y={WH - 10} textAnchor="middle" className="axis-tick">{w}</text>
            ))}
            {weekly.map((t, i) => {
              const label = t.en.length > 24 ? t.en.slice(0, 22) + '…' : t.en;
              return (
                <g key={t.id + 'leg'}>
                  <rect x={WW - wpad.r + 10} y={wpad.t + i * 22} width={10} height={10} fill={t.color} rx={2} />
                  <text x={WW - wpad.r + 26} y={wpad.t + i * 22 + 9} className="axis-tick" style={{ fontSize: 10 }}>
                    <title>{t.en || t.vn}</title>{label}
                  </text>
                </g>
              );
            })}
          </svg>
          {(() => {
            const spikeCount = (window.D.Q4_EVENTS || []).length;
            // For multi-week single-month builds, find the topic with the
            // largest peak across the weeks of the month and report it.
            const peakOf = (t) => Math.max(...t.points);
            const topTrend = [...(window.D.Q4_WEEKLY || [])].sort((a, b) => peakOf(b) - peakOf(a))[0];
            const peakIdx = topTrend ? topTrend.points.indexOf(peakOf(topTrend)) : -1;
            const peakWk = peakIdx >= 0 ? (window.D.WEEKS || [])[peakIdx] : '';
            const peakVal = peakIdx >= 0 ? topTrend.points[peakIdx] : 0;
            const first = topTrend?.points[0] || 0;
            const last  = topTrend ? topTrend.points[topTrend.points.length - 1] : 0;
            const delta = first > 0 ? Math.round((last / first - 1) * 100) : 0;
            return (
              <window.Insight qId="Q4">
                {spikeCount > 0 && <>Detected <b>{spikeCount}</b> weeks with volume exceeding 1.5× avg. </>}
                {topTrend && (
                  useWeekly
                    ? <>Top topic this April: <b>{topTrend.en}</b> — peaked at <b>{peakVal.toLocaleString()}</b> mentions in week of <b>{peakWk}</b>, closing at {last.toLocaleString()} ({delta >= 0 ? '+' : ''}{delta}% vs first week).</>
                    : <>Leading topic last month: <b>{topTrend.en}</b> ({last.toLocaleString()} mentions, {delta >= 0 ? '+' : ''}{delta}% vs first month).</>
                )}
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q4_3" />
      </div>
      </div>

      {tt.node}
    </div>
  );
}
window.Q4 = Q4;

</script>
<script type="text/babel">
/* global React, D, window */

// ============ Shared helpers ============

// SVG donut-arc path — used by the Q6 peak-hour breakdown.
function _arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx  = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy  = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex  = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey  = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

// ============ Q5 — Negative by day-of-week ============

// Single weekday bar chart — used for SOA, EC, or global view.
function DayBar({ daily, title, badge, chartId, tt }) {
  const maxDay = Math.max(1, ...daily.map(d => d.count));
  const topDay = [...daily].sort((a, b) => b.count - a.count)[0] || { day: '—', en: '—', count: 0 };
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
        <span className="card-meta mono">Q5</span>
      </div>
      <svg width="100%" viewBox="0 0 320 220">
        {daily.map((d, i) => {
          const x = 32 + i * 38;
          const barH = (d.count / maxDay) * 160;
          return (
            <g key={d.day}
              onMouseEnter={e => tt.show(e, `<b>${d.day}</b> (${d.en})<br/>${d.count} negative mentions`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }}>
              <rect x={x} y={180 - barH} width={28} height={barH} fill="var(--neg)" rx={2} opacity={0.85} />
              <text x={x + 14} y={195} textAnchor="middle" className="axis-tick">{d.day}</text>
              <text x={x + 14} y={180 - barH - 4} textAnchor="middle" className="mono" style={{ fontSize: 10, fill: 'var(--text-2)' }}>{d.count}</text>
            </g>
          );
        })}
        <line x1={20} y1={180} x2={300} y2={180} className="axis-line" />
      </svg>
      <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4 }}>
        Peak: <b style={{ color: 'var(--text)' }}>{topDay.day} / {topDay.en}</b> ({topDay.count.toLocaleString()})
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

// Single top-neg-topics row-bar list.
function TopNegTopics({ items, title, badge, chartId, tt }) {
  const maxTop = Math.max(1, ...items.map(t => t.count));
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
      </div>
      <div>
        {items.map(t => (
          <div key={t.vn} className="rowbar" style={{ gridTemplateColumns: '1fr 60px' }}
            onMouseEnter={e => tt.show(e, `<b>${t.en || t.vn}</b><br/>${t.vn}<br/>${t.count} negative mentions`)}
            onMouseMove={tt.move} onMouseLeave={tt.hide}>
            <div>
              <div style={{ fontSize: 11, marginBottom: 4, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.en || t.vn}</div>
              <div className="rowbar-track">
                <div className="rowbar-fill" style={{ width: `${(t.count / maxTop) * 100}%`, background: 'var(--neg)' }}></div>
              </div>
            </div>
            <div className="rowbar-value">{t.count}</div>
          </div>
        ))}
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q5() {
  const tt = window.useTooltip();
  const hasSplit = window.D.Q5_BY_DAY_SOA && window.D.Q5_BY_DAY_EC && window.D.Q5_TOP_NEG_SOA && window.D.Q5_TOP_NEG_EC;

  const daily  = window.D.Q5_BY_DAY;
  const topDay = [...daily].sort((a, b) => b.count - a.count)[0] || { day: '—', count: 0 };
  const topNeg = window.D.Q5_TOP_NEG[0] || { vn: '—', count: 0 };

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-6">
            <DayBar daily={window.D.Q5_BY_DAY_SOA} title="Day of week" badge={soaBadge} chartId="Q5_1" tt={tt} />
          </div>
          <div className="col-6">
            <DayBar daily={window.D.Q5_BY_DAY_EC} title="Day of week" badge={ecBadge} chartId="Q5_3" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG_SOA} title="Top negative topics" badge={soaBadge} chartId="Q5_2" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG_EC} title="Top negative topics" badge={ecBadge} chartId="Q5_4" tt={tt} />
          </div>
        </>
      ) : (
        <>
          <div className="col-6">
            <DayBar daily={daily} title="Distribution by day of week" chartId="Q5_1" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG} title="Top 6 negative topics" chartId="Q5_2" tt={tt} />
          </div>
        </>
      )}

      <div style={{ marginTop: 12, gridColumn: '1 / -1' }}>
        <window.Insight qId="Q5">
          Peak day: <b>{topDay.day}</b> ({topDay.count.toLocaleString()} negative mentions) ·
          Top negative topic: <b>{topNeg.en || topNeg.vn}</b> ({topNeg.count.toLocaleString()}).
        </window.Insight>
      </div>

      {tt.node}
    </div>
  );
}
window.Q5 = Q5;


// ============ Q6 — Negative by hour-of-day ============

// Single hour-line chart — used for SOA, EC, or global view. Peak-window
// band comes from the global `peakWindow` (shared band across all segments).
function HourLine({ hourly, title, badge, chartId, peakWindow, tt }) {
  const maxHour = Math.max(1, ...hourly.map(d => d.count));
  const pw = peakWindow;
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
        <span className="card-meta mono">Q6</span>
      </div>
      <svg width="100%" viewBox="0 0 680 220">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={30} y1={30 + 150 * f} x2={660} y2={30 + 150 * f} className="grid-line" />
        ))}
        <path
          d={hourly.map((d, i) => {
            const x = 30 + (i / 23) * 630;
            const y = 180 - (d.count / maxHour) * 150;
            return `${i === 0 ? 'M' : 'L'}${x},${y}`;
          }).join(' ')}
          fill="none" stroke="var(--neg)" strokeWidth={1.8}
        />
        <path
          d={
            hourly.map((d, i) => {
              const x = 30 + (i / 23) * 630;
              const y = 180 - (d.count / maxHour) * 150;
              return `${i === 0 ? 'M' : 'L'}${x},${y}`;
            }).join(' ') + ` L${30 + 630},180 L30,180 Z`
          }
          fill="var(--neg)" opacity={0.1}
        />
        {hourly.map((d, i) => {
          const x = 30 + (i / 23) * 630;
          const y = 180 - (d.count / maxHour) * 150;
          return (
            <circle key={i} cx={x} cy={y} r={3} fill="var(--neg)"
              onMouseEnter={e => tt.show(e, `<b>${d.hour}h</b><br/>${d.count} posts`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
          );
        })}
        {[0, 4, 8, 12, 16, 20, 23].map(h => (
          <text key={h} x={30 + (h / 23) * 630} y={200} textAnchor="middle" className="axis-tick">{h}h</text>
        ))}
        {pw && pw.windowSize > 0 && (() => {
          const bands = [];
          if (pw.startHour + pw.windowSize <= 24) {
            bands.push([pw.startHour, pw.windowSize]);
          } else {
            bands.push([pw.startHour, 24 - pw.startHour]);
            bands.push([0, pw.windowSize - (24 - pw.startHour)]);
          }
          return (
            <>
              {bands.map(([s, w], i) => (
                <rect key={i} x={30 + (s / 23) * 630} y={30} width={(w / 23) * 630} height={150} fill="var(--neg)" opacity={0.06} />
              ))}
              <text x={30 + ((pw.startHour + pw.windowSize / 2) / 23) * 630} y={26} textAnchor="middle" className="axis-tick" style={{ fill: 'var(--neg)', fontSize: 10 }}>
                {pw.startHour}h–{pw.endHour}h peak
              </text>
            </>
          );
        })()}
      </svg>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q6() {
  const tt = window.useTooltip();
  const heatmap = window.D.Q56_HEATMAP;
  const maxHeat = Math.max(1, ...heatmap.flat());
  const hourly  = window.D.Q6_BY_HOUR;
  const topHour = [...hourly].sort((a, b) => b.count - a.count)[0] || { hour: 0, count: 0 };
  const pw      = window.D.Q5_PEAK_WINDOW;

  const hasSplit = window.D.Q6_BY_HOUR_SOA && window.D.Q6_BY_HOUR_EC;

  // Donut for peak-window distribution (stays cross-cutting / combined)
  const earlyTotal = window.D.Q5_EARLY_DIST.reduce((a, b) => a + b.slot, 0);
  let donutAcc = 0;
  const donutSeg = window.D.Q5_EARLY_DIST.map((t, i) => {
    const frac = t.slot / earlyTotal;
    const start = donutAcc;
    donutAcc += frac;
    return { ...t, start, end: donutAcc, color: `oklch(0.${65 - i * 5} 0.14 ${25 + i * 8})` };
  });

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-6">
            <HourLine hourly={window.D.Q6_BY_HOUR_SOA} title="Hour of day" badge={soaBadge} chartId="Q6_1" peakWindow={pw} tt={tt} />
          </div>
          <div className="col-6">
            <HourLine hourly={window.D.Q6_BY_HOUR_EC}  title="Hour of day" badge={ecBadge}  chartId="Q6_4" peakWindow={pw} tt={tt} />
          </div>
        </>
      ) : (
        <div className="col-12">
          <HourLine hourly={hourly} title="Distribution by hour (VN time)" chartId="Q6_1" peakWindow={pw} tt={tt} />
        </div>
      )}

      {/* Heatmap day × hour */}
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Heatmap — day × hour</div>
            </div>
            <div className="legend legend-bins">
              {['Low', 'Medium', 'High'].map((l, i) => (
                <span key={l} className="legend">
                  <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 3, 'rose') }}></span>
                  {l}
                </span>
              ))}
            </div>
          </div>
          <svg width="100%" viewBox="0 0 680 230">
            {window.D.DAYS_VN.map((d, di) => (
              <text key={d} x={24} y={38 + di * 26} textAnchor="end" className="axis-tick">{d}</text>
            ))}
            {window.D.DAYS_VN.map((d, di) => (
              Array.from({ length: 24 }, (_, h) => {
                const v = heatmap[di][h];
                const intensity = Math.pow(v / maxHeat, 0.6);
                return (
                  <rect key={`${d}-${h}`}
                    x={34 + h * 26} y={28 + di * 26}
                    width={24} height={22}
                    fill={window.heatColor(intensity, 'rose')}
                    rx={2}
                    onMouseEnter={e => tt.show(e, `<b>${d} · ${h}h</b><br/>${v} posts`)}
                    onMouseMove={tt.move} onMouseLeave={tt.hide}
                    style={{ cursor: 'pointer' }}
                  />
                );
              })
            ))}
            {[0, 4, 8, 12, 16, 20, 23].map(h => (
              <text key={h} x={34 + h * 26 + 12} y={220} textAnchor="middle" className="axis-tick">{h}</text>
            ))}
          </svg>
          <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4 }}>
            {pw && pw.windowSize > 0
              ? <>Peak window: <b style={{ color: 'var(--text)' }}>Mon–Sun, {pw.startHour}h–{pw.endHour}h</b> — {pw.totalMentions.toLocaleString()} negative mentions over {pw.windowSize} hours.</>
              : <>Insufficient data to detect a peak window.</>}
          </div>
        
        <window.CardComments chartId="Q6_2" />
      </div>
      </div>

      {/* Donut — peak window distribution */}
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">
                Negative peak hour window (Mon–Sun, {pw ? `${pw.startHour}h–${pw.endHour}h` : '—'}) — topic distribution
              </div>
            </div>
            <span className="card-meta mono">
              {(pw && pw.totalMentions) || earlyTotal} mentions trong peak window
            </span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 48 }}>
            <svg width={220} height={220}>
              {donutSeg.map((s) => (
                <path key={s.vn}
                  d={_arc(110, 110, 90, 60, s.start, s.end)}
                  fill={s.color}
                  onMouseEnter={e => tt.show(e, `<b>${s.en || s.vn}</b><br/>${s.slot} mentions · ${Math.round((s.slot / earlyTotal) * 100)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}
                  style={{ cursor: 'pointer' }}
                />
              ))}
              <text x={110} y={106} textAnchor="middle" className="mono" style={{ fontSize: 22, fontWeight: 600, fill: 'var(--text)' }}>{earlyTotal}</text>
              <text x={110} y={124} textAnchor="middle" className="axis-tick" style={{ fontSize: 10 }}>peak window</text>
            </svg>
            <div style={{ flex: 1 }}>
              {donutSeg.map(s => (
                <div key={s.vn} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6, fontSize: 12 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: s.color, flexShrink: 0 }}></span>
                  <span style={{ flex: 1 }}>{s.en || s.vn}</span>
                  <span className="mono" style={{ color: 'var(--text-3)' }}>{s.slot}</span>
                  <span className="mono" style={{ width: 42, textAlign: 'right', color: 'var(--text-2)' }}>{Math.round((s.slot / earlyTotal) * 100)}%</span>
                </div>
              ))}
            </div>
          </div>
        
        <window.CardComments chartId="Q6_3" />
      </div>
      </div>

      <div style={{ marginTop: 12, gridColumn: '1 / -1' }}>
        <window.Insight qId="Q6">
          Peak hour: <b>{topHour.hour}h</b> ({topHour.count.toLocaleString()} negative mentions).
          {pw && pw.windowSize > 0 && <> Auto-detected peak window: <b>{pw.startHour}h–{pw.endHour}h</b> ({pw.totalMentions.toLocaleString()} mentions).</>}
        </window.Insight>
      </div>

      {tt.node}
    </div>
  );
}
window.Q6 = Q6;

</script>
<script type="text/babel">
/* global React, window */
const D2 = window.ChiComData2;

// Horizontal bar list
function HBars({ items, colorKey = 'color', labelKey = 'name', valueKey = 'count', defaultColor = 'var(--accent)', height = 260, tooltip }) {
  const tt = tooltip;
  const max = Math.max(...items.map(i => i[valueKey]));
  return (
    <div>
      {items.map((it, i) => (
        <div key={i} className="rowbar" style={{ gridTemplateColumns: '1fr 52px' }}
          onMouseEnter={e => tt && tt.show(e, `<b>${it[labelKey]}</b><br/>${it[valueKey]}`)}
          onMouseMove={tt && tt.move} onMouseLeave={tt && tt.hide}>
          <div>
            <div style={{ fontSize: 11, marginBottom: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{it[labelKey]}</div>
            <div className="rowbar-track">
              <div className="rowbar-fill" style={{ width: `${(it[valueKey] / max) * 100}%`, background: it[colorKey] || defaultColor }}></div>
            </div>
          </div>
          <div className="rowbar-value">{it[valueKey]}</div>
        </div>
      ))}
    </div>
  );
}
window.HBars = HBars;

// ============ Q7 ============

const Q7_GREEN = 'oklch(0.62 0.15 155)';
const Q7_RED   = 'oklch(0.60 0.20 25)';
const Q7_GRAY  = 'oklch(0.70 0.02 260)';

function _donutArc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function Q7BarCard({ items, title, badge, chartId, tt }) {
  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">{title} {badge}</div>
      </div>
      <HBars items={items.map(t => ({ ...t, color: Q7_GREEN }))} labelKey="en" valueKey="count" tooltip={tt} />
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q7SentimentCard({ sentiment, title, badge, chartId, tt }) {
  const total = Math.max(1, sentiment.positive + sentiment.neutral + sentiment.negative);
  let acc = 0;
  const segs = [
    { label: 'Positive', v: sentiment.positive, color: Q7_GREEN },
    { label: 'Neutral',  v: sentiment.neutral,  color: Q7_GRAY },
    { label: 'Negative', v: sentiment.negative, color: Q7_RED },
  ].map(s => {
    const start = acc; acc += s.v / total;
    return { ...s, start, end: acc };
  });
  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">{title} {badge}</div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '10px 0' }}>
        <svg width={200} height={200}>
          {segs.map(s => (
            <path key={s.label} d={_donutArc(100, 100, 85, 55, s.start, s.end)} fill={s.color}
              onMouseEnter={e => tt.show(e, `<b>${s.label}</b> · ${s.v}%`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide}
              style={{ cursor: 'pointer' }} />
          ))}
          <text x={100} y={96} textAnchor="middle" className="mono" style={{ fontSize: 22, fontWeight: 600, fill: 'var(--text)' }}>{sentiment.positive}%</text>
          <text x={100} y={114} textAnchor="middle" className="axis-tick">positive</text>
        </svg>
      </div>
      <div className="legend-inline" style={{ justifyContent: 'center' }}>
        {segs.map(s => <span key={s.label}><span className="dot" style={{ background: s.color }}></span>{s.label} {s.v}%</span>)}
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q7() {
  const tt = window.useTooltip();
  const { Q7_TOPICS, Q7_BENEFITS, Q7_SENTIMENT } = D2;
  // Primary view: sub-topic breakdown of positive-sentiment posts per
  // segment (matches the remixed analyst report). Falls back to the
  // keyword-matched Q7_TOPICS charts if the pipeline hasn't been rebuilt
  // with the new Q7_POS_SUBS_* fields yet.
  const hasSubSplit = window.D2.Q7_POS_SUBS_SOA && window.D2.Q7_POS_SUBS_EC;

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  const soaTop = (window.D2.Q7_POS_SUBS_SOA || [])[0] || { en: '—', vn: '—', count: 0 };
  const ecTop  = (window.D2.Q7_POS_SUBS_EC  || [])[0] || { en: '—', vn: '—', count: 0 };

  return (
    <div className="grid-12">
      {hasSubSplit ? (
        <>
          <div className="col-6"><Q7BarCard items={window.D2.Q7_POS_SUBS_SOA} title="Top positive sub-topics" badge={soaBadge} chartId="Q7_1" tt={tt} /></div>
          <div className="col-6"><Q7BarCard items={window.D2.Q7_POS_SUBS_EC}  title="Top positive sub-topics" badge={ecBadge}  chartId="Q7_2" tt={tt} /></div>
        </>
      ) : (
        <>
          <div className="col-4"><Q7BarCard items={Q7_TOPICS}   title="Top join triggers"    chartId="Q7_1" tt={tt} /></div>
          <div className="col-4"><Q7BarCard items={Q7_BENEFITS} title="Top benefits mentioned" chartId="Q7_2" tt={tt} /></div>
          <div className="col-4"><Q7SentimentCard sentiment={Q7_SENTIMENT} title="Sentiment distribution" chartId="Q7_3" tt={tt} /></div>
        </>
      )}

      <div style={{ gridColumn: '1 / -1' }}>
        <window.Insight qId="Q7">
          {hasSubSplit ? (
            <>
              SOA top positive sub-topic: <b>{soaTop.en || soaTop.vn}</b> ({soaTop.count.toLocaleString()} mentions) ·
              EC top positive sub-topic: <b>{ecTop.en || ecTop.vn}</b> ({ecTop.count.toLocaleString()}).
            </>
          ) : (
            <>
              Top join reason: <b>{Q7_TOPICS[0]?.en || Q7_TOPICS[0]?.vn || '—'}</b> ({Q7_TOPICS[0]?.count.toLocaleString() || 0} mentions) ·
              Top benefit: <b>{Q7_BENEFITS[0]?.en || Q7_BENEFITS[0]?.vn || '—'}</b> ({Q7_BENEFITS[0]?.count.toLocaleString() || 0}).
            </>
          )}
        </window.Insight>
      </div>
      {tt.node}
    </div>
  );
}
window.Q7 = Q7;

// ============ Q8 ============
function Q8() {
  const tt = window.useTooltip();
  const { Q8_TRIGGERS, Q8_PERSONA, Q8_TREND } = D2;
  const total = Q8_PERSONA.reduce((a, b) => a + b.count, 0);
  let acc = 0;
  const pieSegs = Q8_PERSONA.map(p => {
    const start = acc; acc += p.count / total;
    return { ...p, start, end: acc };
  });
  const arc = (cx, cy, r, a0, a1) => {
    const large = a1 - a0 > 0.5 ? 1 : 0;
    const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
    const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
    return `M${cx},${cy} L${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} Z`;
  };

  const maxTrend = Math.max(...Q8_TREND);
  const months = window.ChiComData.MONTHS.concat(['2026-05', '2026-06', '2026-07', '2026-08']).slice(0, Q8_TREND.length);

  return (
    <div className="grid-12">
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div className="card-title">Top reasons to leave Amazon</div>
          </div>
          <HBars items={Q8_TRIGGERS} labelKey="en" valueKey="count" tooltip={tt} />
        
        <window.CardComments chartId="Q8_1" />
      </div>
      </div>
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div className="card-title">Persona distribution</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
            <svg width={220} height={220}>
              {pieSegs.map(p => (
                <path key={p.label} d={arc(110, 110, 100, p.start, p.end)} fill={p.color}
                  stroke="var(--panel)" strokeWidth={1}
                  onMouseEnter={e => tt.show(e, `<b>${p.label}</b><br/>${p.count} · ${Math.round((p.count / total) * 100)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
              ))}
            </svg>
            <div style={{ flex: 1, fontSize: 12 }}>
              {Q8_PERSONA.map(p => (
                <div key={p.label} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                  <span style={{ width: 10, height: 10, background: p.color, borderRadius: 2 }}></span>
                  <span style={{ flex: 1 }}>{p.label}</span>
                  <span className="mono" style={{ color: 'var(--text-3)' }}>{p.count}</span>
                </div>
              ))}
            </div>
          </div>
        
        <window.CardComments chartId="Q8_2" />
      </div>
      </div>
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Negative abandonment discussions — by month</div>
            </div>
            <span className="card-meta">mentions · max {maxTrend}</span>
          </div>
          {Q8_TREND.length < 2 ? (
            // Single-month data — the line chart would divide by zero. Render
            // a single big-number tile instead so the panel still says something.
            <div style={{ padding: '32px 16px', textAlign: 'center' }}>
              <div className="mono" style={{ fontSize: 36, fontWeight: 700, color: 'var(--neg)', lineHeight: 1 }}>
                {Q8_TREND[0].toLocaleString()}
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-3)', marginTop: 6 }}>
                negative abandonment mentions in {months[0] || 'this month'}
              </div>
              <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4, fontStyle: 'italic' }}>
                Trend chart needs ≥ 2 months of data — single-month dataset shows the volume number only.
              </div>
            </div>
          ) : (
            <svg width="100%" viewBox="0 0 720 180">
              {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
                <g key={i}>
                  <line x1={40} y1={20 + 130 * f} x2={700} y2={20 + 130 * f} className="grid-line" />
                  <text x={34} y={20 + 130 * f + 3} textAnchor="end" className="axis-tick">
                    {Math.round(maxTrend * (1 - f))}
                  </text>
                </g>
              ))}
              <path d={Q8_TREND.map((v, i) => {
                const x = 40 + (i / (Q8_TREND.length - 1)) * 660;
                const y = 150 - (v / maxTrend) * 130;
                return `${i === 0 ? 'M' : 'L'}${x},${y}`;
              }).join(' ')} fill="none" stroke="oklch(0.60 0.20 25)" strokeWidth={2} />
              <path d={
                Q8_TREND.map((v, i) => {
                  const x = 40 + (i / (Q8_TREND.length - 1)) * 660;
                  const y = 150 - (v / maxTrend) * 130;
                  return `${i === 0 ? 'M' : 'L'}${x},${y}`;
                }).join(' ') + ' L700,150 L40,150 Z'
              } fill="oklch(0.60 0.20 25)" opacity={0.1} />
              {Q8_TREND.map((v, i) => {
                const x = 40 + (i / (Q8_TREND.length - 1)) * 660;
                const y = 150 - (v / maxTrend) * 130;
                return <circle key={i} cx={x} cy={y} r={3} fill="oklch(0.60 0.20 25)"
                  onMouseEnter={e => tt.show(e, `<b>${months[i] || `M${i}`}</b><br/>${v} abandonment mentions`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />;
              })}
              {months.map((m, i) => i % 2 === 0 && (
                <text key={m} x={40 + (i / (Q8_TREND.length - 1)) * 660} y={170} textAnchor="middle" className="axis-tick">{m}</text>
              ))}
            </svg>
          )}

        <window.CardComments chartId="Q8_3" />
      </div>
      </div>
      <div style={{ gridColumn: '1 / -1' }}>
        <window.Insight qId="Q8">
          Top reason to leave: <b>{Q8_TRIGGERS[0]?.en || Q8_TRIGGERS[0]?.vn || '—'}</b> ({Q8_TRIGGERS[0]?.count.toLocaleString() || 0} mentions) ·
          Most-leaving persona: <b>{Q8_PERSONA[0]?.label || '—'}</b> ({Q8_PERSONA[0]?.count.toLocaleString() || 0}) ·
          Peak month: <b>{months[Q8_TREND.indexOf(Math.max(...Q8_TREND))] || '—'}</b> ({Math.max(...Q8_TREND).toLocaleString()} mentions).
        </window.Insight>
      </div>
      {tt.node}
    </div>
  );
}
window.Q8 = Q8;

// ============ Q9 — active participants by persona ============
function _q9Arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function Q9Donut({ title, badge, items, chartId, tt }) {
  const total = items.reduce((a, b) => a + b.count, 0) || 1;
  let acc = 0;
  const seg = items.map(it => {
    const start = acc; acc += it.count / total;
    return { ...it, start, end: acc };
  });
  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">{title} {badge}</div>
        <span className="card-meta">{total.toLocaleString()} posts</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20, padding: '8px 0' }}>
        <svg width={200} height={200}>
          {seg.map(s => (
            <path key={s.name} d={_q9Arc(100, 100, 85, 50, s.start, s.end)} fill={s.color}
              onMouseEnter={e => tt.show(e, `<b>${s.name}</b> · ${s.count.toLocaleString()} (${Math.round((s.count / total) * 100)}%)`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
          ))}
          <text x={100} y={96} textAnchor="middle" style={{ fontSize: 22, fontWeight: 600, fill: 'var(--text)' }}>{total.toLocaleString()}</text>
          <text x={100} y={114} textAnchor="middle" style={{ fontSize: 10, fill: 'var(--text-3)' }}>posts</text>
        </svg>
        <div style={{ flex: 1, fontSize: 11 }}>
          {seg.map(s => (
            <div key={s.name} style={{ display: 'flex', gap: 8, marginBottom: 6, alignItems: 'center' }}>
              <span style={{ width: 10, height: 10, background: s.color, borderRadius: 2, flexShrink: 0 }}></span>
              <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.name}</span>
              <span className="mono" style={{ color: 'var(--text-3)' }}>{Math.round((s.count / total) * 100)}%</span>
            </div>
          ))}
        </div>
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q9ThreadList({ title, badge, items, chartId }) {
  const sentimentDot = (s) => {
    const color = s === 'positive' ? 'oklch(0.62 0.15 155)'
                : s === 'negative' ? 'oklch(0.60 0.20 25)'
                : 'oklch(0.70 0.02 260)';
    return (
      <span style={{
        display: 'inline-block', width: 8, height: 8, borderRadius: '50%',
        background: color, flexShrink: 0,
      }} title={s || 'unknown'}></span>
    );
  };

  return (
    <div className="card">
      <div className="card-head">
        <div className="card-title">{title} {badge}</div>
        <span className="card-meta">top {items.length} threads</span>
      </div>
      <div>
        {items.length === 0 && (
          <div style={{ padding: '24px 8px', fontSize: 12, color: 'var(--text-3)' }}>
            No threads available.
          </div>
        )}
        {items.map((t, i) => (

<script type="text/babel">
/* global React, window */
const D2b = window.ChiComData2;

// ── Q10 — Top Product Categories (SOA / EC / Total) ─────────────────────────
// Data is keyword-matched from post content (backend/keywords.py:Q10_CATEGORY_KW)
// and shipped via D2b.Q10_TOP / Q10_TOP_SOA / Q10_TOP_EC. No hardcoded
// narrative — counts and %s reflect actual extraction.

// Helper: convert keyword-match rows into the shape the table/donut expects.
// Input rows: { name, vn, en, count, color }.
// Output rows: { cat, n, pct, color }.
function _q10Shape(rows, denom) {
  const safeDenom = Math.max(1, denom || 0);
  return (rows || []).map(r => ({
    cat:   r.en || r.name || r.vn,
    n:     r.count || 0,
    pct:   ((r.count || 0) / safeDenom * 100).toFixed(1),
    color: r.color || 'var(--accent)',
  }));
}

function Q10RankTable({ data, headerLabel }) {
  const top = data[0]?.n || 1;
  return (
    <div className="card" style={{ padding: 0 }}>
      <div className="card-head" style={{ padding: '14px 18px' }}>
        <div className="card-title">{headerLabel}</div>
      </div>
      <div style={{
        display: 'grid',
        gridTemplateColumns: '28px 1.4fr 1fr 64px 78px',
        gap: 12, padding: '8px 18px',
        background: 'var(--panel-2)',
        borderBottom: '1px solid var(--border)',
        fontSize: 10, fontWeight: 600, letterSpacing: 0.5,
        color: 'var(--text-3)', textTransform: 'uppercase',
      }}>
        <span>#</span>
        <span>Category</span>
        <span>Bar</span>
        <span style={{ textAlign: 'right' }}>%</span>
        <span style={{ textAlign: 'right' }}>Mentions</span>
      </div>
      <div>
        {data.map((d, i) => (
          <div key={d.cat} style={{
            display: 'grid',
            gridTemplateColumns: '28px 1.4fr 1fr 64px 78px',
            gap: 12, alignItems: 'center',
            padding: '11px 18px',
            borderBottom: i < data.length - 1 ? '1px solid var(--border)' : 'none',
          }}>
            <span className="mono" style={{ fontSize: 11, fontWeight: 700, color: i < 3 ? 'var(--text)' : 'var(--text-3)' }}>
              {String(i + 1).padStart(2, '0')}
            </span>
            <div style={{ minWidth: 0, fontSize: 13, fontWeight: 600, color: 'var(--text)', display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 8, height: 8, borderRadius: 2, background: d.color, flexShrink: 0 }}></span>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{d.cat}</span>
            </div>
            <div className="rowbar-track" style={{ height: 6 }}>
              <div className="rowbar-fill" style={{ width: `${Math.max(2, Math.round(d.n / top * 100))}%`, background: d.color, height: '100%' }}></div>
            </div>

            <span className="mono" style={{ textAlign: 'right', fontSize: 11, color: 'var(--text-2)' }}>{d.n.toLocaleString()}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function _q10Arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function Q10DonutCard({ data, total, headerLabel, tt }) {
  // Drop "Other / Undisclosed" from donut so categories of interest get the full ring
  const slice = data.filter(d => !d.cat.toLowerCase().startsWith('other'));
  const sum = slice.reduce((a, b) => a + b.n, 0) || 1;
  let acc = 0;
  const seg = slice.map(d => {
    const start = acc; acc += d.n / sum;
    return { ...d, start, end: acc };
  });
  return (
    <div className="card" style={{ padding: 0 }}>
      <div className="card-head" style={{ padding: '14px 18px' }}>
        <div className="card-title">{headerLabel}</div>
      </div>
      <div style={{ padding: 18, display: 'flex', justifyContent: 'center' }}>
        <svg width={220} height={220}>
          {seg.map(s => (
            <path key={s.cat} d={_q10Arc(110, 110, 95, 60, s.start, s.end)} fill={s.color}
              onMouseEnter={e => tt.show(e, `<b>${s.cat}</b><br/>${s.n.toLocaleString()} mentions · ${s.pct}%`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
          ))}
          <text x={110} y={106} textAnchor="middle" className="mono" style={{ fontSize: 18, fontWeight: 700, fill: 'var(--text)' }}>
            {total.toLocaleString()}
          </text>
          <text x={110} y={124} textAnchor="middle" className="axis-tick" style={{ fontSize: 10 }}>mentions</text>
        </svg>
      </div>
      <div style={{ padding: '0 18px 18px', display: 'flex', flexDirection: 'column', gap: 5 }}>
        {seg.map(s => (
          <div key={s.cat} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, fontSize: 11 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, color: 'var(--text-2)', minWidth: 0 }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: s.color, flexShrink: 0 }}></span>
              <span style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.cat}</span>
            </div>
            <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>
              <span className="mono" style={{ fontWeight: 700, color: 'var(--text)' }}>{s.pct}%</span>
              <span className="mono" style={{ color: 'var(--text-3)' }}>~{s.n.toLocaleString()}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Q10MiniRows({ data }) {
  const top = data[0]?.n || 1;
  return (
    <div>
      {data.slice(0, 5).map((d, i) => (
        <div key={d.cat} style={{
          display: 'grid', gridTemplateColumns: '24px 1fr 60px 60px',
          gap: 8, alignItems: 'center', padding: '8px 14px',
          borderBottom: i < 4 ? '1px solid var(--border)' : 'none',
        }}>
          <span className="mono" style={{ fontSize: 10, fontWeight: 700, color: 'var(--text-3)' }}>#{i + 1}</span>
          <span style={{ fontSize: 12, color: 'var(--text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }} title={d.cat}>{d.cat}</span>
          <div className="rowbar-track" style={{ height: 4 }}>
            <div className="rowbar-fill" style={{ width: `${Math.max(4, Math.round(d.n / top * 100))}%`, background: d.color, height: '100%' }}></div>
          </div>
          <span className="mono" style={{ fontSize: 11, fontWeight: 700, color: 'var(--text)', textAlign: 'right' }}>{d.pct}%</span>
        </div>

    </div>

}

function Q10TabNav({ tab, setTab, totals }) {
  const tabs = [
    { id: 'soa', label: 'SOA Groups', sub: (totals.soa || 0).toLocaleString(), accent: 'oklch(0.55 0.17 290)' },
    { id: 'ec',  label: 'EC Groups',  sub: (totals.ec  || 0).toLocaleString(), accent: 'oklch(0.55 0.17 340)' },
    { id: 'all', label: 'Total',      sub: (totals.all || 0).toLocaleString(), accent: 'var(--accent)' },

  return (

      {tabs.map(t => {

        return (
          <button key={t.id} onClick={() => setTab(t.id)} style={{

            background: 'transparent',

// Q11 — Tool usage
function Q11() {
  const tt = window.useTooltip();
  const { Q11_TOOLS, Q11_ISSUES, Q11_SATISFACTION } = D2b;
  const maxUse = Math.max(...Q11_TOOLS.map(t => t.use));
  const maxSI = Math.max(...Q11_TOOLS.flatMap(t => [t.satisfied, t.issues]));
  const green = 'oklch(0.62 0.15 155)', red = 'oklch(0.60 0.20 25)';
  const W = 640, H = 260, pad = { t: 30, r: 20, b: 50, l: 30 };
  const cellW = (W - pad.l - pad.r) / Q11_TOOLS.length;

  return (
    <div className="grid-12">
      <div className="col-6">
        <div className="card">
          <div className="card-head"><div className="card-title">Tool usage</div></div>
          <HBars items={Q11_TOOLS.map(t => ({ ...t, color: 'var(--accent)' }))} labelKey="en" valueKey="use" tooltip={tt} />
        
        <window.CardComments chartId="Q11_1" />
      </div>
      </div>
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div className="card-title">Satisfied vs Issues (per tool)</div>
            <div className="legend-inline">
              <span><span className="dot" style={{ background: green }}></span>Satisfied</span>
              <span><span className="dot" style={{ background: red }}></span>Issues</span>
            </div>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
            {[0, 0.5, 1].map((f, i) => (
              <line key={i} x1={pad.l} y1={pad.t + (H - pad.t - pad.b) * f} x2={W - pad.r} y2={pad.t + (H - pad.t - pad.b) * f} className="grid-line" />
            ))}
            {Q11_TOOLS.map((t, i) => {
              const x0 = pad.l + i * cellW + 4;
              const bw = (cellW - 10) / 2;
              const plotH = H - pad.t - pad.b;

              const iH = (t.issues / maxSI) * plotH;
              return (
                <g key={t.name}>

                    onMouseEnter={e => tt.show(e, `<b>${t.en || t.name}</b> · Issues ${t.issues}`)}
                    onMouseMove={tt.move} onMouseLeave={tt.hide} />
                  <text x={x0 + bw} y={pad.t + plotH + 10}
                    transform={`rotate(-35 ${x0 + bw} ${pad.t + plotH + 10})`}
                    textAnchor="end" className="axis-tick" style={{ fontSize: 9 }}>{t.en || t.name}</text>
                </g>

        <div className="seg">
          <button className={theme === 'light' ? 'on' : ''} onClick={() => setTheme('light')} style={{ padding: '3px 8px', fontSize: 11 }}>Light</button>
          <button className={theme === 'dark' ? 'on' : ''} onClick={() => setTheme('dark')} style={{ padding: '3px 8px', fontSize: 11 }}>Dark</button>
        </div>
      </div>
      <div className="tweak-row" style={{ alignItems: 'flex-start', flexDirection: 'column', gap: 6 }}>
        <label>Accent</label>
        <div className="swatch-row">
          {swatches.map(s => (
            <button key={s.name} className={accent === s.name ? 'on' : ''}
              onClick={() => setAccent(s.name)}
              style={{ background: s.color }}
              title={s.name}
            />
          ))}
        </div>
      </div>
    </div>
  );
}
