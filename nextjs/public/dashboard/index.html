<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Boost · Community Insights Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/dashboard/styles.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  const JSX_FILES = [
    '/dashboard/shell.jsx',
    '/dashboard/q1_q2.jsx',
    '/dashboard/q3_q4.jsx',
    '/dashboard/q5_q6.jsx',
    '/dashboard/q7_q9.jsx',
    '/dashboard/q10_q14.jsx',
    '/dashboard/upload_panel.jsx',
    '/dashboard/app.jsx',
  ];

  function loadBabelScripts() {
    JSX_FILES.forEach(src => {
      const s = document.createElement('script');
      s.type = 'text/babel';
      s.src = src;
      document.body.appendChild(s);
    });
    Babel.transformScriptTags();
  }

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug') || window.__REPORT_SLUG__;
  const dataFile = slug ? `/dashboard/pages/${slug}.js` : '/dashboard/data_computed.js';

  const dataScript = document.createElement('script');
  dataScript.src = dataFile;
  dataScript.onload = loadBabelScripts;
  dataScript.onerror = () => {
    console.warn(`Data file not found: ${dataFile}`);
    window.ChiComData = {};
    window.ChiComData2 = {};
    window.INSIGHTS = {};
    loadBabelScripts();
  };
  document.head.appendChild(dataScript);
</script>
</body>
</html>
