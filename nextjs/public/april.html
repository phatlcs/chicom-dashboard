<script type="text/babel">
﻿/* global React */
const { useState, useEffect, useRef, useMemo } = React;
const D_ = window.ChiComData;

// ----- shared helpers -----
const clsx = (...xs) => xs.filter(Boolean).join(' ');

function useTooltip() {
  const [tt, setTt] = useState({ x: 0, y: 0, html: '', show: false });
  const show = (e, html) => setTt({ x: e.clientX, y: e.clientY, html, show: true });
  const move = (e) => setTt(t => ({ ...t, x: e.clientX, y: e.clientY }));
  const hide = () => setTt(t => (t.show ? { ...t, show: false } : t));

  // Auto-hide on scroll / mouse leaving the document (stops stuck tooltips)
  useEffect(() => {
    const onDismiss = () => setTt(t => (t.show ? { ...t, show: false } : t));
    window.addEventListener('scroll', onDismiss, true);
    window.addEventListener('wheel', onDismiss, { passive: true });
    document.addEventListener('mouseleave', onDismiss);
    window.addEventListener('blur', onDismiss);
    return () => {
      window.removeEventListener('scroll', onDismiss, true);
      window.removeEventListener('wheel', onDismiss);
      document.removeEventListener('mouseleave', onDismiss);
      window.removeEventListener('blur', onDismiss);
    };
  }, []);

  const node = React.createElement('div', {
    className: clsx('tt', tt.show && 'show'),
    style: { left: tt.x + 12, top: tt.y + 12 },
    dangerouslySetInnerHTML: { __html: tt.html }
  });
  return { show, move, hide, node };
}
window.useTooltip = useTooltip;

// Sparkline
function Sparkline({ values, color, width = 120, height = 28 }) {
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <polyline points={pts} fill="none" stroke={color || 'var(--accent)'} strokeWidth="1.5" />
    </svg>
  );
}
window.Sparkline = Sparkline;

// Heatmap color ramp — returns oklch based on intensity 0..1
function heatColor(intensity, accent = 'indigo') {
  const v = Math.max(0, Math.min(1, intensity));
  // Use accent-based ramp: lighter to darker of the accent color
  // We'll just use lightness ramp against the accent hue
  const hueMap = { indigo: 265, blue: 230, teal: 190, violet: 290, rose: 10, amber: 60 };
  const h = hueMap[accent] ?? 265;
  const l = 0.96 - v * 0.45;
  const c = 0.02 + v * 0.16;
  return `oklch(${l.toFixed(3)} ${c.toFixed(3)} ${h})`;
}
window.heatColor = heatColor;

// Heatmap color with fixed bins (for Q1 style)
function binColor(v, bins = [5, 10, 20, 30, 50], accent = 'indigo') {
  let bin = 0;
  for (let i = 0; i < bins.length; i++) { if (v >= bins[i]) bin = i + 1; }
  return heatColor(bin / bins.length, accent);
}
window.binColor = binColor;

      </div>

}

function KpiStrip() {
  const kpi = (window.ChiComData || {}).KPI || {};
  const fmt = n => n ? n.toLocaleString() : '—';
  const rel = kpi.relevantPosts || 0;
  const posPct = rel ? (kpi.positiveMentions / rel) * 100 : 0;
  const negPct = rel ? (kpi.negativeMentions / rel) * 100 : 0;
  const netPct = posPct - negPct;
  const soaPos = kpi.soaPositivePct ?? 0;
  const soaNeg = kpi.soaNegativePct ?? 0;
  const soaNet = soaPos - soaNeg;
  const sign = v => v >= 0 ? '+' : '';
  const POS = 'oklch(0.55 0.16 155)';
  const NEG = 'oklch(0.58 0.18 25)';
  return (
    <div className="kpi-strip">
      <div className="kpi">
        <div className="kpi-label">Total Mentions</div>
        <div className="kpi-value mono">{fmt(kpi.totalPosts)}</div>
        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>{fmt(kpi.relevantPosts)} relevant</div>
      </div>
      <div className="kpi">
        <div className="kpi-label">Analyzed Mentions</div>
        <div className="kpi-value mono">{fmt(kpi.relevantPosts)}</div>
        <div className="kpi-delta up mono">spam filtered out</div>
      </div>
      <div className="kpi">
        <div className="kpi-label">Net Sentiment (Total)</div>
        <div className="kpi-value mono" style={{ color: netPct >= 0 ? POS : NEG }}>
          {sign(netPct)}{netPct.toFixed(1)}%
        </div>
        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>
          +{posPct.toFixed(1)}% pos · −{negPct.toFixed(1)}% neg
        </div>
      </div>
      <div className="kpi">
        <div className="kpi-label">Net Sentiment (SOA)</div>
        <div className="kpi-value mono" style={{ color: soaNet >= 0 ? POS : NEG }}>
          {sign(soaNet)}{soaNet.toFixed(1)}%
        </div>
        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>
          +{soaPos.toFixed(1)}% pos · −{soaNeg.toFixed(1)}% neg
        </div>
      </div>
      <div className="kpi">
        <div className="kpi-label">Master Topics</div>
        <div className="kpi-value mono">{kpi.masterTopics ?? '—'}</div>
        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>{kpi.subTopics ?? 0} sub-topics</div>
      </div>
      <div className="kpi">
        <div className="kpi-label">Active Groups</div>
        <div className="kpi-value mono">{kpi.activeGroups ?? '—'}</div>
        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>
          {kpi.analysedGroups ?? 0} analyzed · {kpi.soaGroups ?? 0} SOA + {kpi.ecGroups ?? 0} EC
        </div>
      </div>
    </div>
  );
}

// PersonaByGroupChart — stacked bar (Count / 100%) of persona composition per
// community. Lives in Q1's section now, not in the topline.
function PersonaByGroupChart() {
  const D1 = window.ChiComData || {};
  const groups = D1.PERSONA_BY_GROUP || [];
  const personas = D1.PERSONAS || [];
  const tt = window.useTooltip();

  const [mode, setMode] = useState('count'); // 'count' | 'pct'

  // Persona palette: each segment-type gets one hue, sub-segments are shade variants.
  // Avoids red/green so sentiment colors (red=neg, green=pos) stay unambiguous.
  // High chroma so the colours stay distinct even at the lighter "Others" shade.
  //   Seller          → cobalt/navy blue (Amazon = deep saturated, Others = medium)
  //   Prospect        → vivid orange     (Amazon = deep,            Others = peach)
  //   Service Provider → teal             (Amazon = deep,            CBEC   = light)
  const PCOL = {
    p_seller_az:    'oklch(0.42 0.24 255)',
    p_seller_ot:    'oklch(0.70 0.16 250)',
    p_prospect_az:  'oklch(0.58 0.20 50)',
    p_prospect_ot:  'oklch(0.78 0.16 50)',
    p_svc_az:       'oklch(0.52 0.13 195)',
    p_svc_cbec:     'oklch(0.74 0.11 195)',
  };

  const visibleGroups = groups;

  // Compute max for axis scaling (count chart uses absolute totals)
  const maxTotal = Math.max(1, ...visibleGroups.map(g => g.total));

  // Nice round ticks for the Y-axis (count or percent mode)
  const niceTicks = (max, targetCount = 5) => {
    if (max <= 0) return { ticks: [0], niceMax: 1 };
    const rawStep = max / targetCount;
    const exp = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / exp;
    let step;
    if (norm <= 1)        step = 1;
    else if (norm <= 2)   step = 2;
    else if (norm <= 2.5) step = 2.5;
    else if (norm <= 5)   step = 5;
    else                  step = 10;
    step *= exp;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= niceMax + 1e-9; v += step) ticks.push(v);
    return { ticks, niceMax };
  };
  const axis = mode === 'pct'
    ? { ticks: [0, 25, 50, 75, 100], niceMax: 100 }
    : niceTicks(maxTotal, 5);

  // Render the SVG portion of a single stacked bar (just the bar, no labels)
  const renderBarSvg = (g, mode) => {
    const total = g.total || 0;
    const pieces = personas.map(p => ({
      id: p.id, vn: p.vn, count: g.personas[p.id] || 0,
      pct: total ? (g.personas[p.id] || 0) / total : 0,
      color: PCOL[p.id] || 'var(--text-3)',
    })).filter(x => x.count > 0);

    const VW = 100, VH = 600;
    const fillH = mode === 'pct' ? VH : VH * (total / axis.niceMax);
    let cum = 0;
    return (
      <div key={g.group_id} style={{ flex: '1 1 0', minWidth: 0, height: '100%', display: 'flex', alignItems: 'flex-end' }}>
        <svg viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="none"
             style={{ width: '100%', height: '100%', display: 'block' }}>
          {pieces.map(seg => {
            const segH = mode === 'pct' ? VH * seg.pct : fillH * seg.pct;
            const y = VH - fillH + cum;
            cum += segH;
            return (
              <g key={seg.id}>
                <rect x={0} y={y} width={VW} height={segH} fill={seg.color}
                  onMouseEnter={(e) => tt.show(e, `<b>${seg.vn}</b><br/>${seg.count.toLocaleString()} mentions · ${(seg.pct * 100).toFixed(1)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}
                />
                {segH > 24 && (
                  <text x={VW / 2} y={y + segH / 2 + 4} textAnchor="middle"
                    fontSize="11" fill="white" fontWeight="600" pointerEvents="none"
                    style={{ paintOrder: 'stroke' }}>
                    {mode === 'pct' ? `${(seg.pct * 100).toFixed(1)}%` : seg.count.toLocaleString()}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
    );
  };

  // Render the X-axis label for a single group (group name + total)
  const renderBarLabel = (g) => (
    <div key={g.group_id} style={{ flex: '1 1 0', minWidth: 0, fontSize: 11, color: 'var(--text-2)', textAlign: 'center', lineHeight: 1.2, padding: '0 4px', overflow: 'hidden' }}>
      {g.short}
      <div className="mono" style={{ fontSize: 10, color: 'var(--text-3)' }}>{g.total.toLocaleString()}</div>
    </div>
  );

  return (
    <div className="card" style={{ padding: '20px 24px', marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
          <div className="card-title" style={{ margin: 0 }}>
            Persona distribution by group {mode === 'pct' ? '(100% Stacked)' : '(Stacked Count)'}
          </div>
          <select value={mode} onChange={e => setMode(e.target.value)} style={{
            fontSize: 11, padding: '4px 10px', border: '1px solid var(--border)',
            borderRadius: 6, background: 'var(--panel)', color: 'var(--text)',
          }}>
            <option value="count">Stacked Count</option>
            <option value="pct">100% Stacked</option>
          </select>
        </div>

        {/* Legend */}
        <div className="legend-inline" style={{ marginBottom: 20 }}>
          {personas.map(p => (
            <span key={p.id}><span className="dot" style={{ background: PCOL[p.id] }}></span>{p.vn}</span>
          ))}
        </div>

        {/* Chart area: Y-axis column + bars/gridlines + X-axis labels below */}
        <div style={{ display: 'flex', width: '100%', padding: '8px 0 4px' }}>
          {/* Y-axis labels (60px wide) */}
          <div style={{ width: 48, position: 'relative', flex: '0 0 auto', height: 600 }}>
            {axis.ticks.map((t) => {
              const pct = t / axis.niceMax;
              return (
                <div key={t} style={{
                  position: 'absolute', right: 8, top: (1 - pct) * 600,
                  fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--mono)',
                  transform: 'translateY(-50%)', textAlign: 'right', whiteSpace: 'nowrap',
                }}>
                  {mode === 'pct' ? `${t}%` : t.toLocaleString()}
                </div>
              );
            })}
          </div>

          {/* Bars + gridline overlay */}
          <div style={{ flex: 1, position: 'relative', minWidth: 0, height: 600 }}>
            {/* Horizontal gridlines */}
            {axis.ticks.map(t => {
              const pct = t / axis.niceMax;
              const isBase = t === 0;
              return (
                <div key={t} style={{
                  position: 'absolute', left: 0, right: 0,
                  top: (1 - pct) * 600,
                  borderTop: isBase ? '1px solid var(--text-3)' : '1px dashed var(--border)',
                  pointerEvents: 'none',
                }}/>
              );
            })}
            {/* Bars (positioned over the gridlines) */}
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', height: '100%', position: 'relative' }}>
              {visibleGroups.map(g => renderBarSvg(g, mode))}
            </div>
          </div>
        </div>

        {/* X-axis labels row, aligned under the bars (skip the 48px Y-axis gutter) */}
        <div style={{ display: 'flex', paddingLeft: 48, paddingBottom: 8 }}>
          <div style={{ display: 'flex', flex: 1, gap: 10, paddingTop: 6 }}>
            {visibleGroups.map(g => renderBarLabel(g))}
          </div>
        </div>
        <window.CardComments chartId="Q1_PERSONA_GROUP" />
        {tt.node}
    </div>
  );
}
window.PersonaByGroupChart = PersonaByGroupChart;

// HighlightsBar — topline highlight cards: hot topics, product category (Q10),
// Amazon product/program (Q11).
function HighlightsBar() {
  const D1 = window.ChiComData || {};
  const D2 = window.ChiComData2 || {};
  const q10 = window.D2.Q10_TOP   || [];
  const q11 = window.D2.Q11_TOOLS || [];

  const totalRel = (D1.KPI && D1.KPI.relevantPosts) || 1;
  // Use the sum of matched mentions as the denominator so the topline %
  // matches the Q10/Q11 section panels.
  const sumOf = rows => rows.reduce((acc, r) => acc + ((r.use ?? r.count) || 0), 0);
  const q10Sum = Math.max(1, sumOf(q10));
  const q11Sum = Math.max(1, sumOf(q11));
  const top3Cat = (q10 || []).slice(0, 3).map(p => ({
    name: p.en || p.name || p.vn,
    count: p.count || 0,
    pct: ((p.count || 0) / q10Sum * 100).toFixed(1),

  const top3Prog = (q11 || []).slice(0, 3).map(p => ({
    name: p.en || p.name || p.vn,
    count: p.use ?? p.count ?? 0,
    pct: (((p.use ?? p.count ?? 0) / q11Sum) * 100).toFixed(1),
  }));

  const masterTopics = D1.MASTER_TOPICS || [];
  const topicCounts  = D1.MASTER_TOPIC_COUNTS || {};
  const TC = window.TOPIC_COLORS || [];
  const hotTopics = masterTopics
    .map((mt, i) => ({

      name: mt.en || mt.id,
      vn:   mt.vn || '',

      pct: (((topicCounts[mt.id] || 0) / totalRel) * 100).toFixed(1),
      color: TC[i] || 'var(--accent)',

    .slice(0, 3);

  return (
    <div className="highlights-bar" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12, marginBottom: 24 }}>

            <div key={t.id} style={{ marginBottom: i === hotTopics.length - 1 ? 0 : 10 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 3 }}>
                <span style={{ color: 'var(--text-2)' }} title={t.vn}>{i + 1}. {t.name}</span>
                <span className="mono" style={{ color: 'var(--text-2)' }}>{t.pct}%</span>
              </div>
              <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{
                  width: `${Math.min(100, t.pct * 2)}%`, height: '100%',
                  background: t.color, borderRadius: 3,
                }}></div>
              </div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--text-3)', marginTop: 2 }}>{t.count.toLocaleString()} mentions</div>
            </div>
          ))}
        </div>

        {/* Top mentioned Product category — keyword-matched categories from Q10 */}
        <div className="card">
          <div className="card-title">Top Mentioned Selection</div>
          <div className="card-sub" style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 8 }}>
            Top 3 keyword-matched categories · from Q10
          </div>
          {top3Cat.map((p, i) => (
            <div key={p.name} style={{ marginBottom: i === top3Cat.length - 1 ? 0 : 10 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 3 }}>
                <span style={{ color: 'var(--text-2)' }}>{i + 1}. {p.name}</span>
                <span className="mono" style={{ color: 'var(--text-2)' }}>{p.pct}%</span>
              </div>
              <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 3, overflow: 'hidden' }}>

              </div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--text-3)', marginTop: 2 }}>{p.count.toLocaleString()} mentions</div>
            </div>
          ))}
        </div>

        {/* Top mentioned Amazon Product / Program — keyword-matched programs from Q11 (SOA-only) */}
        <div className="card">
          <div className="card-title">Top mentioned Amazon Product / Program</div>
          <div className="card-sub" style={{ fontSize: 11, color: 'var(--text-3)', marginBottom: 8 }}>
            Top 3 keyword-matched programs · from Q11 · % of SOA mentions
          </div>
          {top3Prog.map((p, i) => (

              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 3 }}>

// Minimal horizontal strip of Q1..Q14 anchors. Lives in normal document
// flow (no fixed positioning), no border, just a thin line of text links.
function TimelineNav() {
  const qs = ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9','Q10','Q11','Q12','Q13','Q14'];
  const [active, setActive] = useState(null);

  useEffect(() => {
    const nodes = qs.map(id => document.getElementById(id)).filter(Boolean);
    if (!nodes.length) return;
    const io = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });
    nodes.forEach(n => io.observe(n));
    return () => io.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <nav className="timeline-nav" aria-label="Section navigation">
      {qs.map(q => (
        <a key={q} href={'#' + q}
           className={'timeline-nav-item' + (q === active ? ' on' : '')}>
          {q}
        </a>
      ))}
    </nav>
  );
}

// ── Team-shared insight overrides (Vercel KV via /api/insights) ───────────
// Fetched once on page load. Each <Insight qId="Q1"/> merges KV overrides
// on top of the baked-in window.ChiComData.INSIGHTS, and in-place edits
// POST back to the same endpoint so every teammate sees the latest.

window.__kvInsights = window.__kvInsights || { loaded: false, data: {}, listeners: new Set() };

async function _fetchKvInsights() {
  if (window.__kvInsights.loaded || window.__kvInsights.loading) return;
  window.__kvInsights.loading = true;
  try {
    const r = await fetch('/api/insights', { cache: 'no-store' });
    if (r.ok) {
      window.__kvInsights.data = await r.json();
    }
  } catch (e) {
    /* endpoint not reachable (local / static) — silently fall back */
  } finally {
    window.__kvInsights.loaded = true;
    window.__kvInsights.loading = false;
    for (const fn of window.__kvInsights.listeners) fn();
  }
}
_fetchKvInsights();

async function _saveKvInsight(qId, text) {
  try {
    const r = await fetch('/api/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qId, text }),
    });
    if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
    return true;
  } catch (e) {
    return false;
  }
}

async function _deleteKvInsight(qId) {
  try {
    await fetch('/api/insights', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qId }),
    });
    return true;
  } catch { return false; }
}

// ── CardComments: pair of collapsible editable comment boxes under a chart ─
// Each has:
//   - compact state: single-line placeholder, auto-height
//   - expanded state on focus / when it has text: multi-line auto-grow
//   - only vertical height changes; width stays 50% of its row
// Saves on blur to /api/insights with id = `${chartId}:${slot}` (slot = a|b).
// Also mirrors to localStorage so edits survive refresh even offline.

function CommentBox({ chartId, slot, label }) {
  const [, forceRefresh] = useState(0);
  const [value, setValue] = useState('');
  const [focused, setFocused] = useState(false);
  const [status, setStatus] = useState(null);
  const ref = useRef(null);
  const id = `${chartId}:${slot}`;
  const storageKey = `Boost_note_${id}`;

  // Subscribe to the global KV fetch — once it lands we refresh
  useEffect(() => {
    const fn = () => forceRefresh(n => n + 1);
    window.__kvInsights.listeners.add(fn);
    return () => window.__kvInsights.listeners.delete(fn);
  }, []);

  // Initial value: localStorage → KV → empty
  useEffect(() => {
    const local = localStorage.getItem(storageKey);
    const remote = window.__kvInsights.data[id];
    setValue(local ?? remote ?? '');
  }, [id, storageKey, window.__kvInsights.loaded]);

  // Auto-grow textarea height to content
  const resize = () => {
    const el = ref.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(600, el.scrollHeight) + 'px';
  };
  useEffect(resize, [value, focused]);

  const flashStatus = (type, text, ms = 1500) => {
    setStatus({ type, text });
    if (ms) setTimeout(() => setStatus(s => (s && s.text === text ? null : s)), ms);
  };

  const save = async () => {
    const next = (ref.current?.value ?? '').trim();
    const prior = (localStorage.getItem(storageKey) || '').trim();
    if (next === prior) return;
    if (!next) {
      localStorage.removeItem(storageKey);
    } else {
      localStorage.setItem(storageKey, next);
    }
    setValue(next);
    flashStatus('saving', 'Saving…', 0);
    try {
      const r = await fetch('/api/insights', {
        method: next ? 'POST' : 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(next ? { id, text: next } : { id }),
      });
      if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
      window.__kvInsights.data[id] = next || null;
      flashStatus('ok', 'Saved');
    } catch (e) {
      flashStatus('err', 'Network error — retry', 3500);
    }
  };

  const hasText = value.trim().length > 0;
  const expanded = focused || hasText;

  const statusColor =
    status?.type === 'ok'     ? 'oklch(0.55 0.14 155)' :
    status?.type === 'err'    ? 'oklch(0.55 0.18 25)'  :
    status?.type === 'saving' ? 'oklch(0.55 0.02 260)' :
    'var(--text-3)';

  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        fontSize: 9, fontWeight: 600, textTransform: 'uppercase',
        letterSpacing: '0.05em', color: 'var(--text-3)',
        marginBottom: 3,
      }}>
        <span>{label || `Note ${slot.toUpperCase()}`}</span>
        {status && <span style={{ color: statusColor, textTransform: 'none' }}>{status.text}</span>}
      </div>
      <textarea
        ref={ref}
        value={value}
        placeholder={expanded ? 'Type a note…' : '+ add note'}
        onChange={e => setValue(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => { setFocused(false); save(); }}
        rows={1}
        style={{
          width: '100%',
          minHeight: expanded ? 56 : 28,
          padding: expanded ? '8px 10px' : '5px 10px',
          border: `1px solid ${expanded ? 'oklch(0.75 0.06 260)' : 'var(--border)'}`,
          borderRadius: 4,
          background: expanded ? 'var(--panel)' : 'oklch(0.98 0.005 260)',
          fontSize: 11.5,
          fontFamily: 'inherit',
          color: 'var(--text)',
          resize: 'none',          // vertical size controlled by us only
          overflow: 'hidden',
          outline: 'none',
          lineHeight: 1.5,
          transition: 'min-height 120ms, padding 120ms, border-color 120ms, background 120ms',
          boxSizing: 'border-box',
        }}
      />
    </div>
  );
}

// Insight text-box under every chart.
// Resolution order per qId:
//   1. localStorage edit (instant, per-device)
//   2. KV override fetched from /api/insights (team-shared)
//   3. window.ChiComData.INSIGHTS[qId]   (baked-in LLM / manual)
//   4. children (terse fallback template)
// contentEditable → on blur, saves to localStorage + KV.
// "↺ Reset" button → clears both and falls back to the default.
//
// SHOW_INSIGHT: set to true to re-enable the AI Insight panel under every
// chart. Currently hidden because the Insights & Recommendations expert panel
// covers the same ground.
const SHOW_INSIGHT = false;

function Insight({ qId, children }) {
  const [, forceRefresh] = useState(0);
  const [status, setStatus] = useState(null);          // {type,text} or null
  const [edited, setEdited] = useState(null);          // local override text
  const ref = useRef(null);

  const storageKey = qId ? `Boost_insight_${qId}` : null;
  const kvText = qId ? (window.__kvInsights.data[qId] || null) : null;
  const llmText = qId ? (((window.ChiComData || {}).INSIGHTS || {})[qId] || null) : null;

  // Subscribe to KV-load event so the first fetch triggers a re-render
  useEffect(() => {
    const fn = () => forceRefresh(n => n + 1);
    window.__kvInsights.listeners.add(fn);
    return () => window.__kvInsights.listeners.delete(fn);
  }, []);

  // Load localStorage override once
  useEffect(() => {
    if (!storageKey) return;
    const saved = localStorage.getItem(storageKey);
    if (saved) setEdited(saved);
  }, [storageKey]);

  const defaultText = kvText || llmText || null;
  const currentText = edited ?? defaultText;
  const hasChildren = children && !(Array.isArray(children) && children.every(c => !c));
  const isOverridden = edited !== null || (kvText && kvText !== llmText);

  if (!currentText && !hasChildren) return null;

  const isAI = !!(currentText || llmText);
  const label = isAI ? (isOverridden ? 'AI Insight · edited' : 'AI Insight') : 'Insight';
  const accent     = isAI ? 'oklch(0.55 0.17 290)' : 'oklch(0.55 0.17 260)';
  const accentDark = isAI ? 'oklch(0.45 0.17 290)' : 'oklch(0.45 0.17 260)';
  const bg         = isAI ? 'oklch(0.97 0.02 290)' : 'oklch(0.97 0.01 260)';

  const flashStatus = (type, text, ms = 1800) => {
    setStatus({ type, text });
    if (ms) setTimeout(() => setStatus(s => s && s.text === text ? null : s), ms);
  };

  const saveEdit = async () => {
    if (!ref.current || !qId) return;
    const next = ref.current.innerText.trim();
    const baseline = (defaultText || '').trim();
    if (next === baseline) {
      // Reverted to default — clean up
      localStorage.removeItem(storageKey);
      setEdited(null);
      if (kvText) {
        await _deleteKvInsight(qId);
        window.__kvInsights.data[qId] = null;
        flashStatus('ok', 'Reverted to default');
      }
      return;
    }
    if (next === (edited || '').trim()) return; // unchanged from prior edit

    // Save locally first (instant, refresh-proof)
    localStorage.setItem(storageKey, next);
    setEdited(next);
    flashStatus('saving', 'Saving…', 0);
    const ok = await _saveKvInsight(qId, next);
    if (ok) {
      window.__kvInsights.data[qId] = next;
      flashStatus('ok', 'Saved');
    } else {
      flashStatus('err', 'Save failed — retry', 4000);
    }
  };

  const resetToDefault = async (e) => {
    e.stopPropagation();
    if (!qId) return;
    if (!confirm('Restore original AI insight? Your current edit will be discarded.')) return;
    localStorage.removeItem(storageKey);
    setEdited(null);
    flashStatus('saving', 'Clearing…', 0);
    const ok = await _deleteKvInsight(qId);
    window.__kvInsights.data[qId] = null;
    if (ref.current) ref.current.innerText = llmText || '';
    flashStatus(ok ? 'ok' : 'err', ok ? 'Reverted' : 'Network error — retry', ok ? 1800 : 4000);
  };

  const editable = !!qId; // only Qs with an id are persistable

  const statusColor =
    status?.type === 'ok'     ? 'oklch(0.55 0.14 155)' :
    status?.type === 'err'    ? 'oklch(0.55 0.18 25)'  :
    status?.type === 'saving' ? 'oklch(0.55 0.02 260)' :
    'transparent';

  return (
    <div style={{
      marginTop: 10,
      padding: '8px 12px',
      background: bg,
      borderLeft: `3px solid ${accent}`,
      borderRadius: 3,
      fontSize: 11,
      color: 'var(--text-2)',
      lineHeight: 1.55,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8,
        fontSize: 9, fontWeight: 700, textTransform: 'uppercase',
        letterSpacing: '0.06em', color: accentDark, marginBottom: 4,
      }}>
        <span>{label}</span>
        {editable && isOverridden && (
          <button
            onClick={resetToDefault}
            title="Restore original AI insight"
            style={{
              border: 'none', background: 'transparent', cursor: 'pointer',
              color: accentDark, fontSize: 10, padding: '0 4px',
              fontWeight: 600, textDecoration: 'underline',
            }}
          >↺ Reset</button>
        )}
        {status && (
          <span style={{ color: statusColor, fontWeight: 600, textTransform: 'none' }}>
            {status.text}
          </span>
        )}
        {editable && !status && (
          <span style={{ marginLeft: 'auto', color: 'var(--text-3)', fontWeight: 500, textTransform: 'none' }}>
            click to edit
          </span>
        )}
      </div>
      {editable && currentText != null ? (
        <div
          ref={ref}
          contentEditable
          suppressContentEditableWarning
          onBlur={saveEdit}
          style={{
            outline: 'none', cursor: 'text',
            minHeight: 18, whiteSpace: 'pre-wrap',
          }}
        >{currentText}</div>
      ) : (
        <div>{currentText || children}</div>
      )}
    </div>
  );
}

  if (!ov) return null;

  // Non-sentiment palette — red and green are reserved for negative/positive
  // sentiment, so they're omitted here. Reuses TOPIC_COLORS where possible.
  const palette = window.TOPIC_COLORS || [
    'oklch(0.62 0.15 260)', 'oklch(0.62 0.15 80)',  'oklch(0.62 0.15 230)',
    'oklch(0.62 0.15 60)',  'oklch(0.62 0.15 320)', 'oklch(0.62 0.15 200)',
    'oklch(0.62 0.15 110)', 'oklch(0.62 0.15 290)', 'oklch(0.62 0.15 350)',
  ];

  const arc = (cx, cy, r, a0, a1) => {
    const large = a1 - a0 > 0.5 ? 1 : 0;
    const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
    const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
    return `M${cx},${cy} L${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} Z`;

  const commTotal = ov.communities.reduce((a, b) => a + b.count, 0) || 1;

<script type="text/babel">

// Shared heatmap renderer — takes a matrix + title + accent, renders the
// same structure as the original Q2 chart. Used for both SOA and EC splits
// when available (and as a fallback for the global view otherwise).
function Q2Heatmap({ matrix, title, badge, accent, chartId, tt, personas, mts }) {
  const max = Math.max(1, ...mts.flatMap(mt => personas.map(p => matrix[mt.id][p.id])));
  const cellW = 96, cellH = 42;
  const leftPad = 340;
  const topPad = 120;
  const w = leftPad + personas.length * cellW + 20;
  const h = topPad + mts.length * cellH + 20;
  const bins = ['0–50', '51–150', '151–300', '301–500', '500+'];

  return (
    <div className="card">
      <div className="card-head">
        <div>
          <div className="card-title">{title} {badge}</div>
        </div>
        <div className="legend legend-bins">
          {bins.map((label, i) => (
            <span key={label} className="legend">
              <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 5, accent) }}></span>
              {label}
            </span>
          ))}
        </div>
      </div>
      <div style={{ overflowX: 'auto' }}>
        <svg width={w} height={h} style={{ display: 'block' }}>
          {personas.map((p, pi) => {
            const x = leftPad + pi * cellW + cellW / 2;
            const anchorY = topPad - 14;
            const label = p.vn.length > 22 ? p.vn.slice(0, 21) + '…' : p.vn;
            return (
              <g key={p.id}>
                <text x={x} y={anchorY}
                  textAnchor="start" className="axis-tick"
                  style={{ fontSize: 11 }}
                  transform={`rotate(-45 ${x} ${anchorY})`}>
                  <title>{p.vn}</title>{label}
                </text>
              </g>
            );
          })}
          {mts.map((mt, mi) => (
            <g key={mt.id}>
              <text x={leftPad - 12} y={topPad + mi * cellH + cellH / 2 + 4}
                textAnchor="end" className="axis-tick" style={{ fontSize: 11, fill: 'var(--text-2)' }}>
                {mt.en.length > 48 ? mt.en.slice(0, 46) + '…' : mt.en}
              </text>
              {personas.map((p, pi) => {
                const v = matrix[mt.id][p.id];
                const intensity = Math.pow(v / max, 0.7);
                return (
                  <g key={p.id}>
                    <rect
                      x={leftPad + pi * cellW + 3}
                      y={topPad + mi * cellH + 3}
                      width={cellW - 6} height={cellH - 6}
                      fill={window.heatColor(intensity, accent)}
                      rx={3}
                      onMouseEnter={e => tt.show(e, `<b>${p.vn}</b> × ${mt.en.slice(0, 36)}…<br/>${v} mentions`)}
                      onMouseMove={tt.move} onMouseLeave={tt.hide}
                      style={{ cursor: 'pointer' }}
                    />
                    <text
                      x={leftPad + pi * cellW + cellW / 2}
                      y={topPad + mi * cellH + cellH / 2 + 4}
                      textAnchor="middle"
                      className="mono"
                      style={{ fontSize: 11, fill: intensity > 0.45 ? 'white' : 'var(--text-2)' }}>
                      {v}
                    </text>
                  </g>
                );
              })}
            </g>
          ))}
        </svg>
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q2() {
  const tt = window.useTooltip();
  const personas = window.D.PERSONAS;
  const mts = window.D.MASTER_TOPICS;

  // Prefer split matrices when the build pipeline has emitted them.

  // Insight calc uses the global matrix so numbers align with KPIs.

  mts.forEach(mt => personas.forEach(p => {

    if (v > best.v) best = { p, mt, v };
  }));
  const personaTotals = personas.map(p => ({
    p,
    total: mts.reduce((s, mt) => s + matrixForInsight[mt.id][p.id], 0),
  }));
  personaTotals.sort((a, b) => b.total - a.total);

  return (
    <div className="grid-12">

        <>
          <div className="col-12">

            title="Master Topics by Persona"
            badge={null}
            accent="indigo"
            chartId="Q2_1"
            tt={tt} personas={personas} mts={mts}

      <div className="col-12">
        <window.Insight qId="Q2">

<script type="text/babel">
/* global React, D, window */

window.Q3 = Q3;

// ============ Q4 — Trends over time ============
function Q4() {
  const tt = window.useTooltip();
  // Single-month datasets (e.g. April-only build) collapse the monthly view to
  // a single point. Auto-switch to weekly granularity in that case so the
  // chart has something to draw across the time axis.
  const useWeekly = (window.D.MONTHS || []).length < 2;
  const trends = useWeekly ? window.D.Q4_WEEKLY : window.D.Q4_TRENDS;
  const months = useWeekly ? window.D.WEEKS : window.D.MONTHS;
  const granLabel = useWeekly ? 'weekly' : 'monthly';
  const W = 700, H = 280, pad = { t: 20, r: 20, b: 30, l: 40 };
  const maxY = Math.max(...trends.flatMap(t => t.points));
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;

  const linePts = (pts) => pts.map((v, i) => {
    const x = pad.l + (i / Math.max(pts.length - 1, 1)) * plotW;
    const y = pad.t + plotH - (v / maxY) * plotH;
    return [x, y];
  });

  // Stacked percentage area chart
  const stacked = months.map((m, mi) => {
    const total = trends.reduce((a, t) => a + (t.points[mi] || 0), 0) || 1;
    let acc = 0;
    return trends.map(t => {
      const frac = (t.points[mi] || 0) / total;
      const seg = { start: acc, end: acc + frac, id: t.id, color: t.color };
      acc += frac;
      return seg;
    });
  });

  const stackedPath = (tIdx) => {
    const topPts = stacked.map((s, mi) => [pad.l + (mi / Math.max(months.length - 1, 1)) * plotW, pad.t + plotH - s[tIdx].end * plotH]);
    const botPts = stacked.map((s, mi) => [pad.l + (mi / Math.max(months.length - 1, 1)) * plotW, pad.t + plotH - s[tIdx].start * plotH]).reverse();
    return [...topPts, ...botPts].map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ') + ' Z';
  };

  // weekly with events
  const weekly = window.D.Q4_WEEKLY;
  const weeks = window.D.Q4_EVENTS;
  const WW = 820, WH = 320, wpad = { t: 64, r: 240, b: 32, l: 44 };
  const maxWY = Math.max(...weekly.flatMap(t => t.points));
  const wPlotW = WW - wpad.l - wpad.r, wPlotH = WH - wpad.t - wpad.b;
  const weekRangeLabel = (window.D.WEEKS && window.D.WEEKS.length)
    ? `${window.D.WEEKS[0]} — ${window.D.WEEKS[window.D.WEEKS.length - 1]} · weekly`
    : 'weekly';

  return (
    <div className="grid-12">
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Master Topics — absolute counts</div>
            </div>
            <span className="card-meta">{granLabel}</span>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <g key={i}>
                <line x1={pad.l} y1={pad.t + plotH * f} x2={W - pad.r} y2={pad.t + plotH * f} className="grid-line" />
                <text x={pad.l - 6} y={pad.t + plotH * f + 3} textAnchor="end" className="axis-tick">
                  {Math.round(maxY * (1 - f))}
                </text>
              </g>
            ))}
            {months.map((m, i) => (
              <text key={m} x={pad.l + (i / Math.max(months.length - 1, 1)) * plotW} y={H - 10} textAnchor="middle" className="axis-tick">{m}</text>
            ))}
            {trends.map((t, ti) => {
              const pts = linePts(t.points);
              const d = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');
              return (
                <g key={t.id}>
                  <path d={d} fill="none" stroke={t.color} strokeWidth={1.5} />
                  {pts.map(([x, y], pi) => (
                    <circle key={pi} cx={x} cy={y} r={2.5} fill={t.color}
                      onMouseEnter={e => tt.show(e, `<b>${t.en.slice(0, 40)}…</b><br/>${months[pi]} · ${t.points[pi]}`)}
                      onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
                  ))}
                </g>
              );
            })}
          </svg>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 4, fontSize: 10, marginTop: 8 }}>
            {trends.map((t, i) => (
              <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--text-2)' }}>
                <span style={{ width: 10, height: 10, background: t.color, borderRadius: 2, flexShrink: 0 }}></span>
                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>MT{i + 1} · {t.en.slice(0, 24)}…</span>
              </div>
            ))}
          </div>
        
        <window.CardComments chartId="Q4_1" />
      </div>
      </div>

      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Master Topics — % distribution</div>
            </div>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
            {trends.map((t, ti) => (
              <path key={t.id} d={stackedPath(ti)} fill={t.color} opacity={0.85}
                onMouseEnter={e => tt.show(e, `<b>${t.en.slice(0, 40)}…</b>`)}
                onMouseMove={tt.move} onMouseLeave={tt.hide} />
            ))}
            {months.map((m, i) => (
              <text key={m} x={pad.l + (i / Math.max(months.length - 1, 1)) * plotW} y={H - 10} textAnchor="middle" className="axis-tick">{m}</text>
            ))}
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <text key={i} x={pad.l - 6} y={pad.t + plotH * f + 3} textAnchor="end" className="axis-tick">
                {Math.round((1 - f) * 100)}%
              </text>
            ))}
          </svg>
        
        <window.CardComments chartId="Q4_2" />
      </div>
      </div>

      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Weekly topic trends</div>
            </div>
            <span className="card-meta">{weekRangeLabel}</span>
          </div>
          <svg width="100%" viewBox={`0 0 ${WW} ${WH}`} style={{ display: 'block' }}>
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <line key={i} x1={wpad.l} y1={wpad.t + wPlotH * f} x2={WW - wpad.r} y2={wpad.t + wPlotH * f} className="grid-line" />
            ))}
            {weeks.map((ev, i) => {
              const x = wpad.l + (ev.week / (window.D.WEEKS.length - 1)) * wPlotW;
              // 3-row stagger so adjacent spike labels don't collide
              const yOffset = [-46, -30, -14][i % 3];
              return (
                <g key={i}>
                  <line x1={x} y1={wpad.t} x2={x} y2={wpad.t + wPlotH} stroke="var(--neg)" strokeDasharray="3 3" strokeWidth={1} opacity={0.6} />
                  <line x1={x} y1={wpad.t + yOffset + 2} x2={x} y2={wpad.t} stroke="var(--neg)" strokeWidth={1} opacity={0.35} />
                  <text x={x} y={wpad.t + yOffset} textAnchor="middle" className="axis-tick" style={{ fill: 'var(--neg)', fontSize: 10 }}>{ev.label}</text>
                </g>
              );
            })}
            {weekly.map(t => {
              const pts = t.points.map((v, i) => {
                const x = wpad.l + (i / (t.points.length - 1)) * wPlotW;
                const y = wpad.t + wPlotH - (v / maxWY) * wPlotH;
                return [x, y];
              });
              const d = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');
              return (
                <g key={t.id}>
                  <path d={d} fill="none" stroke={t.color} strokeWidth={2} />
                  {pts.map(([x, y], pi) => (
                    <circle key={pi} cx={x} cy={y} r={2.5} fill={t.color} />
                  ))}
                </g>
              );
            })}
            {window.D.WEEKS.map((w, i) => i % 2 === 0 && (
              <text key={w} x={wpad.l + (i / (window.D.WEEKS.length - 1)) * wPlotW} y={WH - 10} textAnchor="middle" className="axis-tick">{w}</text>
            ))}
            {weekly.map((t, i) => {
              const label = t.en.length > 24 ? t.en.slice(0, 22) + '…' : t.en;
              return (
                <g key={t.id + 'leg'}>
                  <rect x={WW - wpad.r + 10} y={wpad.t + i * 22} width={10} height={10} fill={t.color} rx={2} />
                  <text x={WW - wpad.r + 26} y={wpad.t + i * 22 + 9} className="axis-tick" style={{ fontSize: 10 }}>
                    <title>{t.en || t.vn}</title>{label}
                  </text>
                </g>
              );
            })}
          </svg>
          {(() => {
            const spikeCount = (window.D.Q4_EVENTS || []).length;
            // For multi-week single-month builds, find the topic with the
            // largest peak across the weeks of the month and report it.
            const peakOf = (t) => Math.max(...t.points);
            const topTrend = [...(window.D.Q4_WEEKLY || [])].sort((a, b) => peakOf(b) - peakOf(a))[0];
            const peakIdx = topTrend ? topTrend.points.indexOf(peakOf(topTrend)) : -1;
            const peakWk = peakIdx >= 0 ? (window.D.WEEKS || [])[peakIdx] : '';
            const peakVal = peakIdx >= 0 ? topTrend.points[peakIdx] : 0;
            const first = topTrend?.points[0] || 0;
            const last  = topTrend ? topTrend.points[topTrend.points.length - 1] : 0;
            const delta = first > 0 ? Math.round((last / first - 1) * 100) : 0;
            return (
              <window.Insight qId="Q4">
                {spikeCount > 0 && <>Detected <b>{spikeCount}</b> weeks with volume exceeding 1.5× avg. </>}
                {topTrend && (
                  useWeekly
                    ? <>Top topic this April: <b>{topTrend.en}</b> — peaked at <b>{peakVal.toLocaleString()}</b> mentions in week of <b>{peakWk}</b>, closing at {last.toLocaleString()} ({delta >= 0 ? '+' : ''}{delta}% vs first week).</>
                    : <>Leading topic last month: <b>{topTrend.en}</b> ({last.toLocaleString()} mentions, {delta >= 0 ? '+' : ''}{delta}% vs first month).</>
                )}
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q4_3" />
      </div>
      </div>

      {tt.node}
    </div>
  );
}
window.Q4 = Q4;

</script>
<script type="text/babel">
/* global React, D, window */

// ============ Shared helpers ============

// SVG donut-arc path — used by the Q6 peak-hour breakdown.
function _arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx  = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy  = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex  = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey  = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

// ============ Q5 — Negative by day-of-week ============

// Single weekday bar chart — used for SOA, EC, or global view.
function DayBar({ daily, title, badge, chartId, tt }) {
  const maxDay = Math.max(1, ...daily.map(d => d.count));
  const topDay = [...daily].sort((a, b) => b.count - a.count)[0] || { day: '—', en: '—', count: 0 };
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
        <span className="card-meta mono">Q5</span>
      </div>
      <svg width="100%" viewBox="0 0 320 220">
        {daily.map((d, i) => {
          const x = 32 + i * 38;
          const barH = (d.count / maxDay) * 160;
          return (
            <g key={d.day}
              onMouseEnter={e => tt.show(e, `<b>${d.day}</b> (${d.en})<br/>${d.count} negative mentions`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }}>
              <rect x={x} y={180 - barH} width={28} height={barH} fill="var(--neg)" rx={2} opacity={0.85} />
              <text x={x + 14} y={195} textAnchor="middle" className="axis-tick">{d.day}</text>
              <text x={x + 14} y={180 - barH - 4} textAnchor="middle" className="mono" style={{ fontSize: 10, fill: 'var(--text-2)' }}>{d.count}</text>
            </g>
          );
        })}
        <line x1={20} y1={180} x2={300} y2={180} className="axis-line" />
      </svg>
      <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4 }}>
        Peak: <b style={{ color: 'var(--text)' }}>{topDay.day} / {topDay.en}</b> ({topDay.count.toLocaleString()})
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

// Single top-neg-topics row-bar list.
function TopNegTopics({ items, title, badge, chartId, tt }) {
  const maxTop = Math.max(1, ...items.map(t => t.count));
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
      </div>
      <div>
        {items.map(t => (
          <div key={t.vn} className="rowbar" style={{ gridTemplateColumns: '1fr 60px' }}
            onMouseEnter={e => tt.show(e, `<b>${t.en || t.vn}</b><br/>${t.vn}<br/>${t.count} negative mentions`)}
            onMouseMove={tt.move} onMouseLeave={tt.hide}>
            <div>
              <div style={{ fontSize: 11, marginBottom: 4, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.en || t.vn}</div>
              <div className="rowbar-track">
                <div className="rowbar-fill" style={{ width: `${(t.count / maxTop) * 100}%`, background: 'var(--neg)' }}></div>
              </div>
            </div>
            <div className="rowbar-value">{t.count}</div>
          </div>
        ))}
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q5() {
  const tt = window.useTooltip();
  const hasSplit = window.D.Q5_BY_DAY_SOA && window.D.Q5_BY_DAY_EC && window.D.Q5_TOP_NEG_SOA && window.D.Q5_TOP_NEG_EC;

  const daily  = window.D.Q5_BY_DAY;
  const topDay = [...daily].sort((a, b) => b.count - a.count)[0] || { day: '—', count: 0 };
  const topNeg = window.D.Q5_TOP_NEG[0] || { vn: '—', count: 0 };

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-6">
            <DayBar daily={window.D.Q5_BY_DAY_SOA} title="Day of week" badge={soaBadge} chartId="Q5_1" tt={tt} />
          </div>
          <div className="col-6">
            <DayBar daily={window.D.Q5_BY_DAY_EC} title="Day of week" badge={ecBadge} chartId="Q5_3" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG_SOA} title="Top negative topics" badge={soaBadge} chartId="Q5_2" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG_EC} title="Top negative topics" badge={ecBadge} chartId="Q5_4" tt={tt} />
          </div>
        </>
      ) : (
        <>
          <div className="col-6">
            <DayBar daily={daily} title="Distribution by day of week" chartId="Q5_1" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG} title="Top 6 negative topics" chartId="Q5_2" tt={tt} />
          </div>
        </>
      )}

      <div style={{ marginTop: 12, gridColumn: '1 / -1' }}>
        <window.Insight qId="Q5">
          Peak day: <b>{topDay.day}</b> ({topDay.count.toLocaleString()} negative mentions) ·
          Top negative topic: <b>{topNeg.en || topNeg.vn}</b> ({topNeg.count.toLocaleString()}).
        </window.Insight>
      </div>

      {tt.node}
    </div>
  );
}
window.Q5 = Q5;


// ============ Q6 — Negative by hour-of-day ============

// Single hour-line chart — used for SOA, EC, or global view. Peak-window
// band comes from the global `peakWindow` (shared band across all segments).
function HourLine({ hourly, title, badge, chartId, peakWindow, tt }) {
  const maxHour = Math.max(1, ...hourly.map(d => d.count));
  const pw = peakWindow;
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
        <span className="card-meta mono">Q6</span>
      </div>
      <svg width="100%" viewBox="0 0 680 220">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={30} y1={30 + 150 * f} x2={660} y2={30 + 150 * f} className="grid-line" />
        ))}
        <path
          d={hourly.map((d, i) => {
            const x = 30 + (i / 23) * 630;
            const y = 180 - (d.count / maxHour) * 150;
            return `${i === 0 ? 'M' : 'L'}${x},${y}`;
          }).join(' ')}
          fill="none" stroke="var(--neg)" strokeWidth={1.8}
        />
        <path
          d={
            hourly.map((d, i) => {
              const x = 30 + (i / 23) * 630;
              const y = 180 - (d.count / maxHour) * 150;
              return `${i === 0 ? 'M' : 'L'}${x},${y}`;
            }).join(' ') + ` L${30 + 630},180 L30,180 Z`
          }
          fill="var(--neg)" opacity={0.1}
        />
        {hourly.map((d, i) => {
          const x = 30 + (i / 23) * 630;
          const y = 180 - (d.count / maxHour) * 150;
          return (
            <circle key={i} cx={x} cy={y} r={3} fill="var(--neg)"
              onMouseEnter={e => tt.show(e, `<b>${d.hour}h</b><br/>${d.count} posts`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
          );
        })}
        {[0, 4, 8, 12, 16, 20, 23].map(h => (
          <text key={h} x={30 + (h / 23) * 630} y={200} textAnchor="middle" className="axis-tick">{h}h</text>
        ))}
        {pw && pw.windowSize > 0 && (() => {
          const bands = [];
          if (pw.startHour + pw.windowSize <= 24) {
            bands.push([pw.startHour, pw.windowSize]);
          } else {
            bands.push([pw.startHour, 24 - pw.startHour]);
            bands.push([0, pw.windowSize - (24 - pw.startHour)]);
          }
          return (
            <>
              {bands.map(([s, w], i) => (
                <rect key={i} x={30 + (s / 23) * 630} y={30} width={(w / 23) * 630} height={150} fill="var(--neg)" opacity={0.06} />
              ))}
              <text x={30 + ((pw.startHour + pw.windowSize / 2) / 23) * 630} y={26} textAnchor="middle" className="axis-tick" style={{ fill: 'var(--neg)', fontSize: 10 }}>
                {pw.startHour}h–{pw.endHour}h peak
              </text>
            </>
          );
        })()}
      </svg>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q6() {
  const tt = window.useTooltip();
  const heatmap = window.D.Q56_HEATMAP;
  const maxHeat = Math.max(1, ...heatmap.flat());
  const hourly  = window.D.Q6_BY_HOUR;
  const topHour = [...hourly].sort((a, b) => b.count - a.count)[0] || { hour: 0, count: 0 };
  const pw      = window.D.Q5_PEAK_WINDOW;

  const hasSplit = window.D.Q6_BY_HOUR_SOA && window.D.Q6_BY_HOUR_EC;

  // Donut for peak-window distribution (stays cross-cutting / combined)
  const earlyTotal = window.D.Q5_EARLY_DIST.reduce((a, b) => a + b.slot, 0);
  let donutAcc = 0;
  const donutSeg = window.D.Q5_EARLY_DIST.map((t, i) => {
    const frac = t.slot / earlyTotal;
    const start = donutAcc;
    donutAcc += frac;
    return { ...t, start, end: donutAcc, color: `oklch(0.${65 - i * 5} 0.14 ${25 + i * 8})` };
  });

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-6">
            <HourLine hourly={window.D.Q6_BY_HOUR_SOA} title="Hour of day" badge={soaBadge} chartId="Q6_1" peakWindow={pw} tt={tt} />
          </div>
          <div className="col-6">
            <HourLine hourly={window.D.Q6_BY_HOUR_EC}  title="Hour of day" badge={ecBadge}  chartId="Q6_4" peakWindow={pw} tt={tt} />
          </div>
        </>
      ) : (
        <div className="col-12">
          <HourLine hourly={hourly} title="Distribution by hour (VN time)" chartId="Q6_1" peakWindow={pw} tt={tt} />
        </div>
      )}

      {/* Heatmap day × hour */}
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Heatmap — day × hour</div>
            </div>
            <div className="legend legend-bins">
              {['Low', 'Medium', 'High'].map((l, i) => (
                <span key={l} className="legend">
                  <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 3, 'rose') }}></span>
                  {l}
                </span>
              ))}
            </div>
          </div>
          <svg width="100%" viewBox="0 0 680 230">
            {window.D.DAYS_VN.map((d, di) => (
              <text key={d} x={24} y={38 + di * 26} textAnchor="end" className="axis-tick">{d}</text>
            ))}
            {window.D.DAYS_VN.map((d, di) => (
              Array.from({ length: 24 }, (_, h) => {
                const v = heatmap[di][h];
                const intensity = Math.pow(v / maxHeat, 0.6);
                return (
                  <rect key={`${d}-${h}`}
                    x={34 + h * 26} y={28 + di * 26}
                    width={24} height={22}
                    fill={window.heatColor(intensity, 'rose')}
                    rx={2}
                    onMouseEnter={e => tt.show(e, `<b>${d} · ${h}h</b><br/>${v} posts`)}
                    onMouseMove={tt.move} onMouseLeave={tt.hide}
                    style={{ cursor: 'pointer' }}
                  />
                );
              })
            ))}
            {[0, 4, 8, 12, 16, 20, 23].map(h => (
              <text key={h} x={34 + h * 26 + 12} y={220} textAnchor="middle" className="axis-tick">{h}</text>
            ))}
          </svg>
          <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4 }}>
            {pw && pw.windowSize > 0
              ? <>Peak window: <b style={{ color: 'var(--text)' }}>Mon–Sun, {pw.startHour}h–{pw.endHour}h</b> — {pw.totalMentions.toLocaleString()} negative mentions over {pw.windowSize} hours.</>
              : <>Insufficient data to detect a peak window.</>}
          </div>
        
        <window.CardComments chartId="Q6_2" />
      </div>
      </div>

      {/* Donut — peak window distribution */}
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">

<script type="text/babel">

function _donutArc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function _q9Arc(cx, cy, r, r2, a0, a1) {

}

function Q9Donut({ title, badge, items, chartId, tt }) {
  const total = items.reduce((a, b) => a + b.count, 0) || 1;

<script type="text/babel">
/* global React, window */
const D2b = window.ChiComData2;

// ── Q10 — Top Product Categories (SOA / EC / Total) ─────────────────────────
// Data is keyword-matched from post content (backend/keywords.py:Q10_CATEGORY_KW)
// and shipped via D2b.Q10_TOP / Q10_TOP_SOA / Q10_TOP_EC. No hardcoded
// narrative — counts and %s reflect actual extraction.

// Helper: convert keyword-match rows into the shape the table/donut expects.
// Input rows: { name, vn, en, count, color }.
// Output rows: { cat, n, pct, color }.
function _q10Shape(rows, denom) {
  const safeDenom = Math.max(1, denom || 0);
  return (rows || []).map(r => ({

function _q10Arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function Q10DonutCard({ data, total, headerLabel, tt }) {
  // Drop "Other / Undisclosed" from donut so categories of interest get the full ring
  const slice = data.filter(d => !d.cat.toLowerCase().startsWith('other'));
  const sum = slice.reduce((a, b) => a + b.n, 0) || 1;
  let acc = 0;
  const seg = slice.map(d => {
    const start = acc; acc += d.n / sum;
    return { ...d, start, end: acc };
  });
  return (
    <div className="card" style={{ padding: 0 }}>
      <div className="card-head" style={{ padding: '14px 18px' }}>
        <div className="card-title">{headerLabel}</div>
      </div>

        </svg>
      </div>
