  "Q1": "<p>At <strong>24.3% of all posts (5,012 mentions)</strong>, Selling on Amazon (SOA) is the second-largest topic cluster, indicating that seller education, strategy, and operational guidance are core community needs. This concentration reflects a mature seller base actively seeking peer advice on product sourcing, pricing strategies, and competitive positioning. The samples reveal pragmatic discussions about trend-chasing ('many trend products go up and down like crazy') and niche discovery, suggesting sellers are moving beyond basic setup toward optimization.</p>",

  "Q6": "<p>Platform fee increases are triggering a <strong>negative feedback loop</strong>: sellers raise prices to offset costs, customers perceive poor value and abandon purchases, platform revenue drops, prompting further fee hikes. One user explicitly noted: <em>'Đây là hậu quả tăng phí sàn kéo theo NBH tăng giá, nên kh họ nhìn giá đã ngán ngẫm chẳng muốn mua'</em> (This is the consequence of platform fee increases leading to seller price hikes, so customers see high prices and lose interest in buying). This vicious cycle is eroding trust and driving traffic to offline and competing channels.</p>",
  "Q7": "<p>With <strong>591 mentions (88.6%) focused on 'Success & Income,'</strong> Vietnamese sellers view Amazon primarily as a revenue channel, not a community or lifestyle. Passive income (91 mentions) and ease of entry (80 mentions) are distant secondary motivators. The samples reveal sellers are hyper-focused on tactical wins: product selection for Father's Day, pricing strategies, ad optimization, and margin-friendly upsells (jewelry storage boxes). This suggests <strong>Amazon's value proposition must emphasize concrete earning potential and quick wins</strong> rather than long-term brand building or community belonging.</p>",
  "Q8": "<p>Scam concerns (9 mentions) and account deactivations (8 mentions) represent <strong>17 of 37 documented churn triggers</strong>—nearly half of all abandonment drivers. Sample posts reveal sellers caught in verification loops (\"tài khoản Amazon US bị khóa\") and fraud paranoia (\"Bạn bị lừa rồi. Amazon ko hoạt động như thế\"). These are not soft friction points; they are <strong>account-level crises</strong> that force sellers offline. The lack of clear remediation pathways compounds the damage.</p>",

/catalog topics (2.2%). Sample posts reveal acute anxiety about account suspension ('Account info b\u1ecb sus m\u1edf LLC us t\u1ea1o acc m\u1edbi b\u1eb1ng info c\u0169 c\u00f3 \u0111\u01b0\u1ee3c kh\u00f4ng') and compliance worries. This suggests sellers perceive Amazon's enforcement mechanisms as a primary business risk, potentially deterring investment in growth channels like advertising.</p>"}, {"variant": "both", "label": "\ud83d\udce6 Logistics complexity drives 11.5% of community conversations", "html": "<p>Logistics & fulfillment (11.5%, 2,368 posts) is the third-largest topic, reflecting operational friction in Vietnam's e-commerce ecosystem. Sellers are actively comparing fulfillment costs and methods\u2014samples show price-sensitivity ('Lazada ph\u00ed ngang ng\u1eeda th\u1eb1ng cam ch\u1ee9 r\u1ebb h\u01a1n \u0111\u00e2u?')\u2014indicating that shipping economics directly impact seller profitability and platform choice. This gap suggests Amazon's fulfillment value proposition may not be clearly differentiated in Vietnamese seller conversations.</p>"}], "recommendations": ["Launch targeted SOA education campaigns (webinars, guides) focused on niche discovery and trend-resistant product selection, directly addressing the optimization mindset evident in community samples.", "Develop compliance and account health resources (checklists, policy explainers, appeal templates) to reduce suspension anxiety and build seller confidence\u2014this is a trust barrier limiting growth.", "Create logistics cost-comparison tools and FBA ROI calculators to help sellers quantify fulfillment value vs. competitors, addressing the price-sensitivity signals in community discussions."]}, "Q2": {"scope": "Scope: Persona \u00d7 Master Topics Matrix \u00b7 Q2 2026 \u00b7 13,247 total mentions across 6 personas and 9 topics", "stats": [{"label": "Seller OT dominates conversation", "value": "13,366 mentions (51%)", "variant": "both", "note": "Other-platform sellers (p_seller_ot) drive majority of engagement across all topics"}, {"label": "MT1 & MT2 are core discussion zones", "value": "9,124 mentions (35%)", "variant": "both", "note": "MT1 (4,728) and MT2 (5,012) account for over one-third of all persona-topic interactions"}, {"label": "CBEC service providers cluster in MT3 & MT5", "value": "2,552 mentions (10%)", "variant": "ec", "note": "p_svc_cbec shows strong concentration: MT3 (1,113) + MT5 (1,439) = 64% of their total activity"}, {"label": "Amazon sellers underrepresented in niche topics", "value": "1,316 mentions (5%)", "variant": "soa", "note": "p_seller_az absent from MT9 (17 mentions); weak in MT5 (35) and MT8 (52)"}], "findings": [{"variant": "both", "label": "\ud83c\udfaf Seller OT & Prospect OT form the backbone\u2014but Amazon sellers lag in engagement", "html": "<p>Other-platform sellers (p_seller_ot) contribute <strong>13,366 mentions</strong> across all topics, with MT1 and MT2 as their primary discussion hubs (4,228 + 4,066). Prospects from other platforms (p_prospect_ot) add another 2,083 mentions. In contrast, <strong>Amazon sellers (p_seller_az) contribute only 1,314 mentions</strong>\u2014a 10\u00d7 gap. Sample posts reveal sellers discussing pricing, account management, and trend-spotting in casual, peer-to-peer language ('xem gi\u00e1 sp \u0111i b', 'Account info c\u00e1 nh\u00e2n t\u1eebng b\u1ecb sus'). Amazon sellers are largely absent from this organic conversation, suggesting weak community integration or lower platform adoption in this Vietnamese cohort.</p>"}, {"variant": "ec", "label": "\ud83d\udce6 CBEC service providers own specialized topics (MT3, MT5)\u2014clear vertical segmentation", "html": "<p>CBEC service providers (p_svc_cbec) show extreme topic concentration: <strong>MT3 (1,113 mentions) and MT5 (1,439 mentions)</strong> account for 64% of their 3,071 total mentions. This indicates these topics are likely logistics, fulfillment, or cross-border compliance\u2014domains where CBEC expertise is essential. By contrast, they are nearly invisible in MT1 (85), MT2 (85), and MT7 (16). This vertical segmentation is healthy but also reveals an opportunity: CBEC providers are not participating in broader seller conversations about product sourcing, pricing, or market trends, limiting their ability to offer end-to-end solutions.</p>"}, {"variant": "soa", "label": "\u26a0\ufe0f Amazon sellers concentrated in MT1 & MT2; weak presence in niche & specialized topics", "html": "<p><strong>Amazon sellers (p_seller_az) concentrate in MT1 (366) and MT2 (274)</strong>, accounting for 49% of their 1,314 total mentions. They are nearly absent from MT9 (17), MT5 (35), and MT8 (52). Sample posts ('Dropfreedomspeed \u0110\u00fang r\u1ed3i, nhi\u1ec1u s\u1ea3n ph\u1ea9m trend th\u01b0\u1eddng l\u00ean voi xu\u1ed1ng ch\u00f3') suggest sellers are discussing product trends and niche sourcing, yet Amazon sellers do not appear to be leading these conversations. This gap suggests either: (1) Amazon sellers lack awareness of specialized topics, (2) they are not finding value in those discussions, or (3) they are siloed in Amazon-specific channels rather than the broader community.</p>"}], "recommendations": ["Launch targeted engagement campaigns for Amazon sellers in MT3, MT5, and MT8 (logistics, compliance, niche sourcing). Use CBEC service providers as co-educators to bridge the knowledge gap and position Amazon as a full-stack solution.", "Create cross-persona content hubs that connect Seller OT insights (MT1, MT2 trends) with Amazon seller best practices. Repurpose top OT seller discussions into Amazon-specific playbooks to drive adoption and community participation.", "Establish a dedicated CBEC + Amazon seller working group to co-develop solutions for cross-border fulfillment and compliance. This addresses the current vertical silos and positions Amazon as a strategic partner for CBEC operations."]}, "Q3": {"scope": "Scope: Seller vs Prospect comparison \u00b7 Q3 2026 \u00b7 Master Topics + Sub-topics analysis \u00b7 14,653 seller mentions vs 2,315 prospect mentions", "stats": [{"label": "Account Creation dominates prospect interest", "value": "27.0% (prospects) vs 4.8% (sellers)", "variant": "warn", "note": "625 prospect posts vs 701 seller posts; largest gap at -22.2 percentage points"}, {"label": "Account Health is seller-centric concern", "value": "13.9% (sellers) vs 5.0% (prospects)", "variant": "soa", "note": "2,031 seller posts vs 116 prospect posts; 8.9 percentage point gap driven by suspensions & account issues"}, {"label": "SOA (Selling on Amazon) remains core for both", "value": "29.6% (sellers) vs 24.1% (prospects)", "variant": "both", "note": "4,340 seller posts vs 558 prospect posts; Cost & Fees sub-topic shows 6.2 point seller advantage"}, {"label": "Third-party services attract prospects 2x more", "value": "7.9% (prospects) vs 3.8% (sellers)", "variant": "warn", "note": "182 prospect posts vs 558 seller posts; prospects seek service recommendations; sellers focus on supplier sourcing"}], "findings": [{"variant": "warn", "label": "\ud83d\udeaa Account Creation is the Prospect Gateway\u2014but onboarding friction is real", "html": "<p>Prospects dedicate <strong>27% of discussions to account creation</strong> (625 posts), compared to just 4.8% for sellers. Sub-topics reveal the pain: <strong>Account Verification (10.58% of prospect posts)</strong>, <strong>Identity Verification/SIV (6.83%)</strong>, and <strong>Account Types (4.23%)</strong> dominate. Sample posts show confusion around account setup and verification requirements. This signals that <strong>onboarding clarity and documentation support are critical blockers</strong> preventing prospects from converting to active sellers. The 22.2 percentage point gap indicates prospects are stuck in pre-launch mode.</p>"}, {"variant": "soa", "label": "\u26a0\ufe0f Account Health Crisis: Sellers fear suspension more than prospects understand it", "html": "<p><strong>Account Health represents 13.9% of seller discussions</strong> (2,031 posts) versus only 5.0% for prospects (116 posts)\u2014an 8.9 percentage point gap. Sellers are deeply concerned with <strong>Account Suspension (6.09%)</strong> and <strong>Account Issues/Errors (6.18%)</strong>, while prospects barely engage with these topics. Sample posts reveal sellers discussing account reinstatement strategies and policy violations. This gap suggests <strong>sellers face real operational risk that prospects don't yet appreciate</strong>. Proactive education on compliance, policy adherence, and account monitoring should be prioritized before sellers face suspension.</p>"}, {"variant": "both", "label": "\ud83d\udcb0 Cost anxiety spans both groups, but sellers focus on operational efficiency", "html": "<p><strong>Cost & Fees</strong> is the highest sub-topic under SOA for sellers (11.95% of seller posts), with a 6.2 percentage point advantage over prospects (5.75%). Sellers discuss <strong>Advertising Costs (2.26% seller vs 0.04% prospect)</strong>, <strong>Logistics Costs (5.13% vs 2.59%)</strong>, and <strong>Pricing/Cost (1.49% vs 0.43%)</strong>. Prospects show more interest in <strong>Incentives & Training (4.02%)</strong> and <strong>Product Selection (3.15%)</strong>\u2014suggesting they're still in exploration mode. Sample posts reveal sellers debating fee structures and cost optimization. <strong>Sellers need transparent cost calculators and ROI tools; prospects need educational content on the true cost of selling before launch.</strong></p>"}], "recommendations": ["Create a dedicated onboarding hub for prospects covering Account Verification, SIV, Account Types, and Legal Entity Setup\u2014these four sub-topics account for 19.08% of prospect posts and represent the primary conversion barrier.", "Develop proactive Account Health monitoring and compliance education for sellers to reduce suspension risk; include clear policy guides, violation prevention checklists, and appeal templates to address the 8.9 percentage point gap in seller concern.", "Build interactive cost calculators and ROI simulators that break down Advertising Costs, Logistics Costs, and Seller Fees for both segments\u2014sellers need optimization tools, prospects need realistic expectations before committing to the platform."]}, "Q4": {"scope": "Scope: Master Topics Trend Analysis \u00b7 Weekly Detection (Apr 27 - May 25, 2026) \u00b7 40,000+ Community Posts", "stats": [{"label": "Peak Activity Week", "value": "May 18\u201325, 2026", "variant": "both", "note": "Highest engagement window detected across 5-week period"}, {"label": "Dominant Topic Cluster", "value": "Product Authenticity & Pricing", "variant": "warn", "note": "Counterfeit goods, platform fee comparisons, and seller verification dominate discourse"}, {"label": "Secondary Concern", "value": "Account Management & Compliance", "variant": "danger", "note": "Account suspension recovery, LLC registration, and multi-account strategies"}, {"label": "Emerging Micro-Trend", "value": "Niche Product Strategy", "variant": "ec", "note": "Shift from trend-chasing to stable-demand product discovery"}], "findings": [{"variant": "warn", "label": "\ud83d\udea8 Counterfeit & Price Transparency Crisis Dominates May Peak", "html": "<p>The week of May 18\u201325 shows a sharp spike in community concern around <strong>product authenticity and platform pricing fairness</strong>. A high-profile counterfeit sneaker bust (1,400+ fake Nike/Adidas units seized, ~3.4B VND) catalyzed widespread distrust. Posts like \"xem gi\u00e1 sp \u0111i b\" (check product prices) and Lazada fee complaints (\"ph\u00ed ngang ng\u1eeda th\u1eb1ng cam\") reveal sellers and buyers questioning whether platforms adequately police counterfeits and maintain competitive pricing. This is not isolated griping\u2014it reflects systemic anxiety about marketplace integrity during peak shopping season.</p>"}, {"variant": "danger", "label": "\u26a0\ufe0f Account Suspension & Multi-Account Workarounds Accelerate", "html": "<p>A critical secondary trend emerges: <strong>account recovery and multi-account creation strategies</strong> spike in mid-May. Posts asking \"Account info c\u00e1 nh\u00e2n t\u1eebng b\u1ecb sus m\u1edf LLC us t\u1ea1o acc m\u1edbi b\u1eb1ng info c\u0169 c\u00f3 \u0111\u01b0\u1ee3c kh\u00f4ng\" (Can I create a new account with old info after suspension?) indicate sellers are actively circumventing platform enforcement. This suggests either aggressive platform crackdowns or seller desperation to maintain operations\u2014likely both. The prevalence of LLC and cross-border account tactics signals organized evasion, not casual rule-breaking.</p>"}, {"variant": "ec", "label": "\ud83d\udca1 Strategic Pivot: Trend-Chasing Fatigue Drives Niche-Product Demand", "html": "<p>By late May, a qualitative shift emerges in seller mindset. Comments like \"nhi\u1ec1u s\u1ea3n ph\u1ea9m trend th\u01b0\u1eddng l\u00ean voi xu\u1ed1ng ch\u00f3. Quan tr\u1ecdng l\u00e0 t\u00ecm \u0111\u01b0\u1ee3c ng\u00e1ch c\u00f3 nhu c\u1ea7u \u1ed5n \u0111\u1ecbnh h\u01a1n\" (Trend products spike then crash; finding stable-demand niches matters more) reveal <strong>growing sophistication in product selection</strong>. Sellers are moving away from viral-chasing toward sustainable, low-volatility categories. This is a healthy maturation signal but also indicates margin pressure\u2014sellers can no longer rely on trend arbitrage and must build deeper category expertise.</p>"}], "recommendations": ["Launch a 'Seller Trust & Authenticity' initiative by late May: Implement visible verification badges for sellers with clean compliance records, and create a public counterfeit-report dashboard to rebuild confidence in platform integrity during peak season.", "Tighten account suspension enforcement and multi-account detection: Deploy cross-border LLC and payment-method correlation analysis to identify organized evasion networks; communicate enforcement actions transparently to deter circumvention.", "Develop a 'Stable Niche Categories' discovery tool: Help sellers identify low-volatility, high-demand product clusters (e.g., seasonal essentials, consumables) to reduce trend-chasing behavior and stabilize seller margins\u2014this reduces desperation-driven rule violations."]}, "Q5": {"scope": "Scope: Negative sentiment sub-topics \u00d7 day of week \u00b7 4,152 total mentions \u00b7 Q1 2026", "stats": [{"label": "Cost & Fees dominates negative discourse", "value": "978 mentions (23.5%)", "variant": "danger", "note": "Nearly 2\u00d7 the second-ranked topic (Selling Best Practices: 524)"}, {"label": "Friday\u2013Thursday peak window", "value": "1,612 mentions (38.8%)", "variant": "warn", "note": "Thu (788) + Fri (824) drive late-week frustration surge"}, {"label": "Morning business hours (8\u201312) concentration", "value": "1,137 mentions (27.4%)", "variant": "both", "note": "Peak at 9\u201310 AM (295 + 294); sellers vent during work startup"}, {"label": "Account issues & suspensions", "value": "851 mentions (20.5%)", "variant": "soa", "note": "Account errors (430) + suspensions (421) = critical trust concern"}], "findings": [{"variant": "danger", "label": "\ud83d\udcb0 Fee increases create a vicious cycle of seller despair", "html": "<p><strong>Cost & Fees (978 mentions)</strong> is the dominant negative topic, reflecting deep frustration with platform economics. Samples reveal a cascading problem: sellers cite fee hikes forcing price increases, which then deters customers (\"\u0110\u00e2y l\u00e0 h\u1eadu qu\u1ea3 t\u0103ng ph\u00ed s\u00e0n k\u00e9o theo NBH t\u0103ng gi\u00e1, n\u00ean kh h\u1ecd nh\u00ecn gi\u00e1 \u0111\u00e3 ng\u00e1n ng\u1eabm ch\u1eb3ng mu\u1ed1n mua\"). This erodes order volume, pushing sellers into debt spirals (\"M\u00ecnh ko ph\u1ea3i g\u1ed3ng m\u00e0 l\u00e0 \u00e2m th\u00eam \u00e2m\"). The platform's fee structure is perceived as unsustainable and driving sellers away.</p>"}, {"variant": "soa", "label": "\ud83d\udea8 Account suspensions & errors undermine seller confidence", "html": "<p><strong>Account issues (430) and suspensions (421)</strong> together represent 20.5% of negative mentions, signaling a critical trust crisis. Samples show arbitrary enforcement: sellers report sudden account bans for perceived policy violations (\"L\u1edb ng\u1edb b\u1ea5m thanh to\u00e1n xong l\u00e0 bay lu\u00f4n acc. Vi ph\u1ea1m l\u1ea1m d\u1ee5ng mgg\") and confusing refund mechanics (\"t\u1ec9 l\u1ec7 ho\u00e0n \u00edt nh\u01b0ng khi shop k \u0111k th\u00ec t\u1ef1 d\u01b0ng v\u1eeba hu\u1ef7 l\u00e0 \u0111\u01a1n ho\u00e0n kh\u00f4ng lu\u00f4n\"). These account-level failures erode platform legitimacy and seller retention.</p>"}, {"variant": "both", "label": "\ud83d\udcc5 Friday\u2013Thursday surge + morning peak = predictable complaint windows", "html": "<p>Negative sentiment spikes on <strong>Thursday (788) and Friday (824)</strong>, peaking during <strong>8\u201312 AM business hours (1,137 mentions)</strong>. This pattern suggests sellers check their dashboards at work start, discover overnight order drops or fee notifications, and immediately seek community support. The late-week concentration indicates cumulative frustration from the week's operational challenges. Targeting support communications and policy announcements outside these windows could reduce reactive venting and improve message receptivity.</p>"}], "recommendations": ["Launch a transparent fee-structure review and communicate a clear roadmap for cost stabilization. Address the perception that fees are arbitrary and unsustainable by publishing tiered fee schedules and seller profitability benchmarks.", "Implement a seller account health dashboard with real-time policy compliance alerts and a human review process for suspension decisions. Reduce account terminations perceived as arbitrary by providing 48-hour appeal windows and detailed violation explanations.", "Shift high-impact announcements (policy changes, fee updates) to Tuesday\u2013Wednesday mornings to avoid the Friday\u2013Thursday complaint surge. Pair announcements with seller success stories and cost-mitigation tools to reframe the narrative."]}, "Q7": {"scope": "Scope: Amazon seller motivations & benefits (667 mentions) \u00b7 Q1 2026 \u00b7 Vietnamese e-commerce community", "stats": [{"label": "Success & income dominates seller motivation", "value": "591 mentions (88.6%)", "variant": "soa", "note": "Far outweighs passive income (91) and ease of entry (80)"}, {"label": "Knowledge-sharing is the primary engagement driver", "value": "222 mentions (33.3%)", "variant": "both", "note": "Sellers seek learning & help more than operational support (134)"}, {"label": "Sentiment skews neutral despite opportunity focus", "value": "69 neutral vs. 31 positive/negative combined", "variant": "warn", "note": "Indicates pragmatic, transactional mindset rather than enthusiasm"}, {"label": "Operational & strategic content gaps", "value": "211 mentions (31.6%)", "variant": "ec", "note": "Collaboration (134) + Experience (107) suggest sellers lack confidence in execution"}], "findings": [{"variant": "soa", "label": "\ud83d\udcb0 Revenue is the only real hook\u2014sellers join for profit, not passion", "html": "<p>With <strong>591 mentions (88.6%) focused on 'Success & Income,'</strong> Vietnamese sellers view Amazon primarily as a revenue channel, not a community or lifestyle. Passive income (91 mentions) and ease of entry (80 mentions) are distant secondary motivators. The samples reveal sellers are hyper-focused on tactical wins: product selection for Father's Day, pricing strategies, ad optimization, and margin-friendly upsells (jewelry storage boxes). This suggests <strong>Amazon's value proposition must emphasize concrete earning potential and quick wins</strong> rather than long-term brand building or community belonging.</p>"}, {"variant": "both", "label": "\ud83c\udf93 Sellers crave structured knowledge but struggle with execution", "html": "<p><strong>'Sharing, learning & help' (222 mentions) dominates topic discussions,</strong> yet operational challenges remain unresolved. Samples show sellers requesting PnL templates, asking for Father's Day product strategies, and seeking fulfillment partnerships\u2014indicating they know *what* to do but lack *how* to do it efficiently. The gap between 'Experience & strategy' (107 mentions) and 'Collaboration, support & operations' (134 mentions) reveals sellers are hungry for peer wisdom and operational frameworks. <strong>Amazon should position itself as the knowledge hub</strong> that bridges this gap with curated training, case studies, and peer-to-peer mentorship programs.</p>"}, {"variant": "warn", "label": "\u26a0\ufe0f Neutral sentiment masks underlying anxiety about market entry", "html": "<p>The <strong>69 neutral responses (compared to only 8 positive)</strong> suggest sellers approach Amazon with cautious pragmatism rather than excitement. Samples reveal common pain points: pricing complexity ('fix b\u1eb1ng c\u00e1ch l\u00e0m tr\u00f2n gi\u00e1'), algorithm concerns ('phanh x\u00edch Ads'), and fulfillment logistics ('h\u1ee3p t\u00e1c l\u00e2u d\u00e0i'). While 'Easy to start' scores 80 mentions, the neutral sentiment indicates sellers perceive hidden complexity beneath the surface. <strong>This signals a trust gap:</strong> sellers believe Amazon *could* work but are uncertain about their ability to succeed, making them vulnerable to competitor platforms or local alternatives that promise simpler onboarding.</p>"}], "recommendations": ["Launch a 'Quick Wins' program featuring seasonal product guides (e.g., Father's Day, holiday campaigns) with pre-built PnL templates and pricing strategies. Sellers explicitly request these resources; packaging them as Amazon-curated content positions the platform as a profit accelerator, not just a marketplace.", "Build a structured 'Seller Bootcamp' combining live events, recorded case studies, and peer mentorship matching. The 222 mentions of 'learning & help' and 96 mentions of 'events, training & networking' show sellers will engage with educational content\u2014use this to convert neutral sentiment into active advocacy.", "Create a fulfillment & logistics marketplace within Amazon's seller dashboard, highlighting cost savings (5-20% cheaper than alternatives per samples) and 24/7 support. Operational friction is a key barrier; reducing it directly addresses the 134+107 mentions of collaboration and strategy gaps, turning logistics anxiety into a competitive advantage."]}, "Q8": {"scope": "Scope: SOA (245 mentions of churn triggers) \u00b7 Total SOA community (2,060 posts) \u00b7 Seller churn analysis", "stats": [{"label": "Amazon Sellers expressing churn intent", "value": "211", "variant": "soa", "note": "86% of churn-related personas are active Amazon sellers"}, {"label": "Top churn trigger: Scam/Fraud concerns", "value": "9 mentions", "variant": "danger", "note": "Highest single driver of seller abandonment"}, {"label": "Account lockout incidents", "value": "8 mentions", "variant": "danger", "note": "Second-largest friction point; often unresolved"}, {"label": "Combined policy & competition friction", "value": "10 mentions", "variant": "warn", "note": "Complex policies (5) + fierce competition (5) = structural barriers"}], "findings": [{"variant": "danger", "label": "\ud83d\udea8 Scam & Account Lockout Crisis Driving Seller Exit", "html": "<p>Scam concerns (9 mentions) and account deactivations (8 mentions) represent <strong>17 of 37 documented churn triggers</strong>\u2014nearly half of all abandonment drivers. Sample posts reveal sellers caught in verification loops (\"t\u00e0i kho\u1ea3n Amazon US b\u1ecb kh\u00f3a\") and fraud paranoia (\"B\u1ea1n b\u1ecb l\u1eeba r\u1ed3i. Amazon ko ho\u1ea1t \u0111\u1ed9ng nh\u01b0 th\u1ebf\"). These are not soft friction points; they are <strong>account-level crises</strong> that force sellers offline. The lack of clear remediation pathways compounds the damage.</p>"}, {"variant": "soa", "label": "\ud83d\udcca Amazon Sellers Dominate Churn Narrative (86% of cohort)", "html": "<p><strong>211 of 245 churn mentions come from active Amazon sellers</strong>, with only 24 from prospects and 10 from sellers on competing platforms. This indicates churn is not a prospect-acquisition problem\u2014it is a <strong>retention crisis among existing sellers</strong>. The samples show experienced operators (\"team \u0111ang g\u1eb7p m\u1ed9t ca kh\u00f3\") struggling with compliance and verification, suggesting the issue affects mid-tier sellers, not just beginners.</p>"}, {"variant": "warn", "label": "\ud83d\udcb0 Profitability & Burnout: The Silent Killer", "html": "<p>While scam/lockout grab attention, <strong>losses/high costs (4 mentions) and burnout/lost motivation (3 mentions)</strong> reveal a deeper economic problem. Posts like \"T\u00fam l\u1ea1i l\u00e0 tr\u01b0\u1edbc sau v\u1eabn l\u1ed7\" and \"c\u1ea1nh tranh kh\u00f3 r\u1ed3i, ae newbie ch\u1eafc kh\u00f3c th\u00e9t\" show sellers bleeding margin and morale. Combined with complex policies (5) and fierce competition (5), the platform is becoming <strong>economically unviable for marginal sellers</strong>, driving quiet exits before account crises even occur.</p>"}], "recommendations": ["Establish a dedicated seller recovery task force for account lockouts: Create a fast-track verification process with 48-hour SLA for deactivation appeals, including clear documentation checklists and direct support escalation. Current samples show sellers stuck in limbo; transparency and speed will prevent exits.", "Launch a fraud-prevention transparency campaign: Publish monthly scam alerts, seller verification best practices, and case studies of resolved fraud cases. Sellers are losing trust due to perceived scams and unclear account health signals\u2014proactive communication will rebuild confidence.", "Introduce a profitability diagnostic tool for sellers: Offer free margin analysis, competitive pricing benchmarks, and cost-optimization recommendations within Seller Central. Target the 4 sellers citing losses and 3 citing burnout by making the business case for staying visible and actionable."]}, "Q9": {"scope": "Scope: Join vs. Leave Discussion Personas \u00b7 1,318 mentions (Q9\u2192Q7) \u00b7 511 mentions (Q9\u2192Q8) \u00b7 Vietnamese E-commerce Community", "stats": [{"label": "Sellers (Others) dominate both discussions", "value": "794 (60%) join | 451 (88%) leave", "variant": "warn", "note": "Non-Amazon sellers are the primary voice in retention/churn narratives"}, {"label": "Amazon seller engagement gap", "value": "84 join (6%) vs 34 leave (7%)", "variant": "soa", "note": "Amazon sellers underrepresented in both flows; 60% lower join participation"}, {"label": "Service providers nearly absent from exit", "value": "214 join (16%) \u2192 4 leave (<1%)", "variant": "both", "note": "CBEC service providers discuss entry but rarely discuss leaving"}, {"label": "Prospects minimal in both flows", "value": "31 join (2%) | 2 leave (<1%)", "variant": "warn", "note": "Prospective sellers show very low engagement in join/leave discussions"}], "findings": [{"variant": "warn", "label": "\ud83d\udeaa Non-Amazon sellers drive the narrative on both entry and exit", "html": "<p>Sellers from other platforms (Lazada, Shopee, etc.) account for <strong>60% of join discussions and 88% of leave discussions</strong>. This indicates that the Vietnamese e-commerce community is primarily composed of multi-platform operators evaluating alternatives. Posts like \"<em>Lazada ph\u00ed ngang ng\u1eeda th\u1eb1ng cam ch\u1ee9 r\u1ebb h\u01a1n \u0111\u00e2u?</em>\" (Lazada fees are the same as Amazon, not cheaper) reveal sellers actively comparing platform economics. Amazon sellers represent only 6% of join and 7% of leave conversations, suggesting either lower community participation or lower churn intent among Amazon- entiate Amazon's value proposition from Lazada/Shopee on fees, support, and product categories.", "Develop a structured exit interview program targeting the 34 Amazon sellers in leave discussions; conduct qualitative research to understand specific friction points (account suspensions, fee structures, policy enforcement) and address them proactively before sellers disengage.", "Engage CBEC service providers in retention and support activities by creating a feedback loop from leave discussions back to service provider teams; establish a monitoring system for common pain points (account security, fee transparency, counterfeit product handling) and empower service providers to respond publicly in the community."]}, "Q10": {"scope": "Scope: Top product categories discussed in Vietnamese e-commerce community (40,000+ Facebook posts) \u00b7 Q1 2026", "stats": [{"label": "Apparel & Fashion dominance", "value": "220 mentions", "variant": "ec", "note": "Largest category by 90% margin over Home & Garden (116)"}, {"label": "Home & Garden + Jewelry & Accessories", "value": "231 combined mentions", "variant": "ec", "note": "Second-tier categories with sustained interest"}, {"label": "Electronics (China-sourced)", "value": "89 mentions", "variant": "warn", "note": "Significant discussion around sourcing transparency"}, {"label": "Niche categories (Toys, Health & Beauty)", "value": "46 combined mentions", "variant": "both", "note": "Lower volume but emerging interest areas"}], "findings": [{"variant": "ec", "label": "\ud83d\udc55 Apparel & Fashion overwhelmingly dominates seller conversations", "html": "<p><strong>Apparel & Fashion leads with 220 mentions</strong>, representing nearly 50% more discussion than the next category. This reflects the category's accessibility for new sellers, high consumer demand in Vietnam, and lower barriers to entry. However, samples reveal critical pain points: counterfeit enforcement (K.W Sneaker case with 1,400+ fake Nike/Adidas units seized), pri n Amazon Marketing Cloud, ACOS optimization, and scaling strategies\u2014rather than introductory material. The gap between demand (13 mentions) and positive sentiment (2 positive vs. 1 negative) suggests <strong>existing courses miss the mark on depth and practical application</strong>.</p>"}, {"variant": "soa", "label": "\ud83e\udd1d Mentor/Coaching Shows Highest Engagement Despite Low Volume", "html": "<p>Mentor/Coaching has only <strong>4 mentions but 25% interest rate</strong>\u2014the highest conversion indicator in the dataset. Sellers actively seek <strong>1-on-1 guidance and personalized coaching</strong>, with posts like 'A cho e ch\u1ed7 c\u1ee5 th\u1ec3 coach DN \u0111c ko a' (asking for specific coaching contacts) and 'M\u00ecnh ngh\u0129 t\u1edbi giai \u0111o\u1ea1n n\u00e0y ch\u1eafc ph\u1ea3i h\u1ecdc b\u00e0i b\u1ea3n' (need structured learning at advanced stage). This signals <strong>strong unmet demand for premium, personalized training</strong> over scalable courses.</p>"}, {"variant": "soa", "label": "\u26a0\ufe0f Amazon FBA Courses Invisible in Community Conversation", "html": "<p><strong>Amazon FBA courses receive only 3 mentions with zero sentiment signals</strong>, indicating either low awareness or low perceived relevance. Sellers discussing advanced tactics (AMC, ACOS, scaling) do not reference FBA-specific training, suggesting <strong>existing FBA courses may be outdated, too basic, or poorly marketed</strong> to the Vietnamese seller community. The absence of seeking or interest metrics indicates these courses are not top-of-mind for growth-focused sellers.</p>"}], "recommendations": ["Develop advanced, role-specific training modules (e.g., 'Amazon Marketing Cloud Mastery,' 'ACOS Optimization for Scale') rather than generic general training; validate content with sellers currently struggling with tactical execution.", "Launch a structured mentor/coaching program with clear pricing and outcomes; leverage the 25% interest rate in Mentor/Coaching by offering tiered 1-on-1 sessions and group coaching cohorts to capture high-intent sellers.", "Audit and reposition Amazon FBA course offerings with case studies, ROI metrics, and testimonials from Vietnamese sellers; promote through targeted posts addressing specific pain points (e.g., inventory management, fulfillment strategy) to increase visibility and relevance."]}, "Q14": {"scope": "Scope: SOA (2,060 mentions) \u00b7 Growth & P&L Polarity Analysis \u00b7 Q1 2026", "stats": [{"label": "Team Building dominates growth discourse", "value": "33 mentions (24% of growth topics)", "variant": "soa", "note": "Highest volume; 67% mixed sentiment (8 positive, 22 mixed, 3 negative)"}, {"label": "Operational scaling follows closely", "value": "28 mentions (20% of growth topics)", "variant": "soa", "note": "61% mixed sentiment; sellers struggle with cost optimization vs. scale"}, {"label": "Market expansion & automation compete", "value": "24 + 21 mentions (32% combined)", "variant": "soa", "note": "Both show 38% positive/seeking; automation tools lag in adoption clarity"}, {"label": "Marketing & revenue growth underrepresented", "value": "5 + 1 mentions (4% of growth topics)", "variant": "warn", "note": "Suggests sellers view growth as operational/team challenge, not marketing-led"}], "findings": [{"variant": "soa", "label": "\ud83c\udfd7\ufe0f Team Building is the #1 growth lever, but sentiment is cautiously mixed", "html": "<p>With <strong>33 mentions and 67% mixed sentiment</strong>, sellers recognize team expansion as critical to scaling but express uncertainty about execution. Samples reveal two distinct patterns: (1) <strong>Fulfillment service providers actively recruiting</strong> (\"Team \u0111\u00f4ng ng\u01b0\u1eddi \u0111\u01a1n nh\u1ecf l\u1ebb c\u0169ng nh\u1eadn\"), and (2) <strong>Sellers seeking operational guidance</strong> on how to structure teams efficiently. The high mixed-sentiment ratio (22 of 33) indicates sellers are experimenting with team models\u2014from in-house hiring to outsourced fulfillment partnerships\u2014without clear best practices. This is a <strong>critical Amazon SOA opportunity</strong>: sellers need frameworks for team scaling that balance cost and quality.</p>"}, {"variant": "soa", "label": "\u2699\ufe0f Operational scaling and cost optimization are inseparable pain points", "html": "<p><strong>28 mentions of operational scaling</strong> with <strong>61% mixed sentiment</strong> reveal a core tension: sellers want to grow volume but fear margin erosion. One sample explicitly states: \"C\u00e1i b\u1ea1n c\u1ea7n l\u00e0m l\u00e0 t\u1ed1i \u01b0u chi ph\u00ed song parallel v\u1edbi scale m\u00f4 h\u00ecnh\" (optimize costs in parallel with scaling). Another seller transitioning from Etsy ($40\u2013100K/month) to Amazon notes that <strong>Amazon's lower product prices and complex ad systems</strong> make scaling harder. This suggests sellers lack confidence in Amazon's profitability model at scale\u2014a critical perception gap for SOA positioning.</p>"}, {"variant": "warn", "label": "\ud83d\udcca Marketing & revenue growth are conspicuously absent from growth conversations", "html": "<p>Only <strong>5 mentions of marketing/advertising and 1 mention of revenue growth</strong> (6 combined, <1% of growth topics) indicates sellers view growth as an <strong>operational and supply-chain problem, not a demand-generation problem</strong>. Samples show sellers discussing ads tactically (\"dayparting optimization\") rather than strategically, and one seller explicitly notes that <strong>account compliance issues block ad scaling</strong> (\"acc c\u00f2n ko m\u1edf \u0111\u01b0\u1ee3c th\u00ec n\u00f3i g\u00ec \u0111\u1ebfn ads\"). This reveals a <strong>foundational blocker</strong>: sellers cannot focus on marketing growth until operational and compliance infrastructure is solid. Amazon SOA must address this sequencing gap.</p>"}], "recommendations": ["Develop and promote a \"Team Scaling Playbook\" for SOA sellers that covers hiring models (in-house vs. outsourced fulfillment), cost benchmarks, and KPIs\u2014addressing the 67% mixed sentiment in team-building discussions.", "Create a \"Cost-to-Scale Calculator\" tool that helps sellers model profitability scenarios as they grow volume on Amazon, directly addressing the operational scaling tension between growth and margin preservation.", "Establish a compliance-first onboarding pathway that resolves account restrictions (recalls, suspended billing, etc.) before sellers invest in marketing\u2014removing the foundational blocker preventing demand-generation focus."]}};

﻿/* global React */

// ----- shared helpers -----
const clsx = (...xs) => xs.filter(Boolean).join(' ');

function useTooltip() {
  const [tt, setTt] = useState({ x: 0, y: 0, html: '', show: false });
  const show = (e, html) => setTt({ x: e.clientX, y: e.clientY, html, show: true });
  const move = (e) => setTt(t => ({ ...t, x: e.clientX, y: e.clientY }));
  const hide = () => setTt(t => (t.show ? { ...t, show: false } : t));

  // Auto-hide on scroll / mouse leaving the document (stops stuck tooltips)
  useEffect(() => {
    const onDismiss = () => setTt(t => (t.show ? { ...t, show: false } : t));
    window.addEventListener('scroll', onDismiss, true);
    window.addEventListener('wheel', onDismiss, { passive: true });
    document.addEventListener('mouseleave', onDismiss);
    window.addEventListener('blur', onDismiss);
    return () => {
      window.removeEventListener('scroll', onDismiss, true);
      window.removeEventListener('wheel', onDismiss);
      document.removeEventListener('mouseleave', onDismiss);
      window.removeEventListener('blur', onDismiss);
    };
  }, []);

  const node = React.createElement('div', {
    className: clsx('tt', tt.show && 'show'),
    style: { left: tt.x + 12, top: tt.y + 12 },
    dangerouslySetInnerHTML: { __html: tt.html }
  });
  return { show, move, hide, node };
}
window.useTooltip = useTooltip;

// Sparkline
function Sparkline({ values, color, width = 120, height = 28 }) {
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <polyline points={pts} fill="none" stroke={color || 'var(--accent)'} strokeWidth="1.5" />
    </svg>
  );
}
window.Sparkline = Sparkline;

// Heatmap color ramp — returns oklch based on intensity 0..1
function heatColor(intensity, accent = 'indigo') {
  const v = Math.max(0, Math.min(1, intensity));
  // Use accent-based ramp: lighter to darker of the accent color
  // We'll just use lightness ramp against the accent hue
  const hueMap = { indigo: 265, blue: 230, teal: 190, violet: 290, rose: 10, amber: 60 };
  const h = hueMap[accent] ?? 265;
  const l = 0.96 - v * 0.45;
  const c = 0.02 + v * 0.16;
  return `oklch(${l.toFixed(3)} ${c.toFixed(3)} ${h})`;
}
window.heatColor = heatColor;

// Heatmap color with fixed bins (for Q1 style)
function binColor(v, bins = [5, 10, 20, 30, 50], accent = 'indigo') {
  let bin = 0;
  for (let i = 0; i < bins.length; i++) { if (v >= bins[i]) bin = i + 1; }
  return heatColor(bin / bins.length, accent);
}
window.binColor = binColor;

      <div className="kpi">

        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>

      <div className="kpi">
        <div className="kpi-label">Master Topics</div>
        <div className="kpi-value mono">{kpi.masterTopics ?? '—'}</div>
        <div className="kpi-delta mono" style={{ color: 'var(--text-3)' }}>{kpi.subTopics ?? 0} sub-topics</div>

      <div className="kpi">

// PersonaByGroupChart — stacked bar (Count / 100%) of persona composition per
// community. Lives in Q1's section now, not in the topline.
function PersonaByGroupChart() {
  const D1 = window.ChiComData || {};
  const groups = D1.PERSONA_BY_GROUP || [];
  const personas = D1.PERSONAS || [];
  const tt = window.useTooltip();

  const [mode, setMode] = useState('count'); // 'count' | 'pct'

  // Persona palette: each segment-type gets one hue, sub-segments are shade variants.
  // Avoids red/green so sentiment colors (red=neg, green=pos) stay unambiguous.
  // High chroma so the colours stay distinct even at the lighter "Others" shade.
  //   Seller          → cobalt/navy blue (Amazon = deep saturated, Others = medium)
  //   Prospect        → vivid orange     (Amazon = deep,            Others = peach)
  //   Service Provider → teal             (Amazon = deep,            CBEC   = light)
  const PCOL = {
    p_seller_az:    'oklch(0.42 0.24 255)',
    p_seller_ot:    'oklch(0.70 0.16 250)',
    p_prospect_az:  'oklch(0.58 0.20 50)',
    p_prospect_ot:  'oklch(0.78 0.16 50)',
    p_svc_az:       'oklch(0.52 0.13 195)',
    p_svc_cbec:     'oklch(0.74 0.11 195)',
  };

  const visibleGroups = groups;

  // Compute max for axis scaling (count chart uses absolute totals)
  const maxTotal = Math.max(1, ...visibleGroups.map(g => g.total));

  // Nice round ticks for the Y-axis (count or percent mode)
  const niceTicks = (max, targetCount = 5) => {
    if (max <= 0) return { ticks: [0], niceMax: 1 };
    const rawStep = max / targetCount;
    const exp = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / exp;
    let step;
    if (norm <= 1)        step = 1;
    else if (norm <= 2)   step = 2;
    else if (norm <= 2.5) step = 2.5;
    else if (norm <= 5)   step = 5;
    else                  step = 10;
    step *= exp;
    const niceMax = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= niceMax + 1e-9; v += step) ticks.push(v);
    return { ticks, niceMax };
  };
  const axis = mode === 'pct'
    ? { ticks: [0, 25, 50, 75, 100], niceMax: 100 }
    : niceTicks(maxTotal, 5);

  // Render the SVG portion of a single stacked bar (just the bar, no labels)
  const renderBarSvg = (g, mode) => {
    const total = g.total || 0;
    const pieces = personas.map(p => ({
      id: p.id, vn: p.vn, count: g.personas[p.id] || 0,
      pct: total ? (g.personas[p.id] || 0) / total : 0,
      color: PCOL[p.id] || 'var(--text-3)',
    })).filter(x => x.count > 0);

    const VW = 100, VH = 600;
    const fillH = mode === 'pct' ? VH : VH * (total / axis.niceMax);
    let cum = 0;
    return (
      <div key={g.group_id} style={{ flex: '1 1 0', minWidth: 0, height: '100%', display: 'flex', alignItems: 'flex-end' }}>
        <svg viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="none"
             style={{ width: '100%', height: '100%', display: 'block' }}>
          {pieces.map(seg => {
            const segH = mode === 'pct' ? VH * seg.pct : fillH * seg.pct;
            const y = VH - fillH + cum;
            cum += segH;
            return (
              <g key={seg.id}>
                <rect x={0} y={y} width={VW} height={segH} fill={seg.color}
                  onMouseEnter={(e) => tt.show(e, `<b>${seg.vn}</b><br/>${seg.count.toLocaleString()} mentions · ${(seg.pct * 100).toFixed(1)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}
                />
                {segH > 24 && (
                  <text x={VW / 2} y={y + segH / 2 + 4} textAnchor="middle"
                    fontSize="11" fill="white" fontWeight="600" pointerEvents="none"
                    style={{ paintOrder: 'stroke' }}>
                    {mode === 'pct' ? `${(seg.pct * 100).toFixed(1)}%` : seg.count.toLocaleString()}
                  </text>
                )}
              </g>
            );
          })}
        </svg>
      </div>
    );
  };

  // Render the X-axis label for a single group (group name + total)
  const renderBarLabel = (g) => (
    <div key={g.group_id} style={{ flex: '1 1 0', minWidth: 0, fontSize: 11, color: 'var(--text-2)', textAlign: 'center', lineHeight: 1.2, padding: '0 4px', overflow: 'hidden' }}>
      {g.short}
      <div className="mono" style={{ fontSize: 10, color: 'var(--text-3)' }}>{g.total.toLocaleString()}</div>
    </div>
  );

  return (
    <div className="card" style={{ padding: '20px 24px', marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 8, marginBottom: 12 }}>
          <div className="card-title" style={{ margin: 0 }}>
            Persona distribution by group {mode === 'pct' ? '(100% Stacked)' : '(Stacked Count)'}
          </div>
          <select value={mode} onChange={e => setMode(e.target.value)} style={{
            fontSize: 11, padding: '4px 10px', border: '1px solid var(--border)',
            borderRadius: 6, background: 'var(--panel)', color: 'var(--text)',
          }}>
            <option value="count">Stacked Count</option>
            <option value="pct">100% Stacked</option>
          </select>
        </div>

        {/* Legend */}
        <div className="legend-inline" style={{ marginBottom: 20 }}>
          {personas.map(p => (
            <span key={p.id}><span className="dot" style={{ background: PCOL[p.id] }}></span>{p.vn}</span>
          ))}
        </div>

        {/* Chart area: Y-axis column + bars/gridlines + X-axis labels below */}
        <div style={{ display: 'flex', width: '100%', padding: '8px 0 4px' }}>
          {/* Y-axis labels (60px wide) */}
          <div style={{ width: 48, position: 'relative', flex: '0 0 auto', height: 600 }}>
            {axis.ticks.map((t) => {
              const pct = t / axis.niceMax;
              return (
                <div key={t} style={{
                  position: 'absolute', right: 8, top: (1 - pct) * 600,
                  fontSize: 10, color: 'var(--text-3)', fontFamily: 'var(--mono)',
                  transform: 'translateY(-50%)', textAlign: 'right', whiteSpace: 'nowrap',
                }}>
                  {mode === 'pct' ? `${t}%` : t.toLocaleString()}
                </div>
              );
            })}
          </div>

          {/* Bars + gridline overlay */}
          <div style={{ flex: 1, position: 'relative', minWidth: 0, height: 600 }}>
            {/* Horizontal gridlines */}
            {axis.ticks.map(t => {
              const pct = t / axis.niceMax;
              const isBase = t === 0;
              return (
                <div key={t} style={{
                  position: 'absolute', left: 0, right: 0,
                  top: (1 - pct) * 600,
                  borderTop: isBase ? '1px solid var(--text-3)' : '1px dashed var(--border)',
                  pointerEvents: 'none',
                }}/>
              );
            })}
            {/* Bars (positioned over the gridlines) */}
            <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', height: '100%', position: 'relative' }}>
              {visibleGroups.map(g => renderBarSvg(g, mode))}
            </div>
          </div>
        </div>

        {/* X-axis labels row, aligned under the bars (skip the 48px Y-axis gutter) */}
        <div style={{ display: 'flex', paddingLeft: 48, paddingBottom: 8 }}>
          <div style={{ display: 'flex', flex: 1, gap: 10, paddingTop: 6 }}>
            {visibleGroups.map(g => renderBarLabel(g))}
          </div>
        </div>
        <window.CardComments chartId="Q1_PERSONA_GROUP" />
        {tt.node}
    </div>
  );
}
window.PersonaByGroupChart = PersonaByGroupChart;

// HighlightsBar — topline highlight cards: hot topics, product category (Q10),

  // matches the Q10/Q11 section panels.
  const sumOf = rows => rows.reduce((acc, r) => acc + ((r.use ?? r.count) || 0), 0);

                <span className="mono" style={{ color: 'var(--text-2)' }}>{t.pct}%</span>
              </div>
              <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{
                  width: `${Math.min(100, t.pct * 2)}%`, height: '100%',

// Minimal horizontal strip of Q1..Q14 anchors. Lives in normal document
// flow (no fixed positioning), no border, just a thin line of text links.
function TimelineNav() {
  const qs = ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','Q8','Q9','Q10','Q11','Q12','Q13','Q14'];
  const [active, setActive] = useState(null);

  useEffect(() => {
    const nodes = qs.map(id => document.getElementById(id)).filter(Boolean);
    if (!nodes.length) return;
    const io = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (visible.length) setActive(visible[0].target.id);
    }, { rootMargin: '-30% 0px -60% 0px', threshold: 0 });
    nodes.forEach(n => io.observe(n));
    return () => io.disconnect();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return (
    <nav className="timeline-nav" aria-label="Section navigation">
      {qs.map(q => (
        <a key={q} href={'#' + q}
           className={'timeline-nav-item' + (q === active ? ' on' : '')}>
          {q}
        </a>
      ))}
    </nav>
  );
}

// Fetched once on page load. Each <Insight qId="Q1"/> merges KV overrides
// on top of the baked-in window.ChiComData.INSIGHTS, and in-place edits
// POST back to the same endpoint so every teammate sees the latest.

window.__kvInsights = window.__kvInsights || { loaded: false, data: {}, listeners: new Set() };

async function _fetchKvInsights() {
  if (window.__kvInsights.loaded || window.__kvInsights.loading) return;
  window.__kvInsights.loading = true;
  try {
    const r = await fetch('/api/insights', { cache: 'no-store' });
    if (r.ok) {
      window.__kvInsights.data = await r.json();
    }
  } catch (e) {
    /* endpoint not reachable (local / static) — silently fall back */
  } finally {
    window.__kvInsights.loaded = true;
    window.__kvInsights.loading = false;
    for (const fn of window.__kvInsights.listeners) fn();
  }
}
_fetchKvInsights();

async function _saveKvInsight(qId, text) {
  try {
    const r = await fetch('/api/insights', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qId, text }),
    });
    if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
    return true;
  } catch (e) {
    return false;
  }
}

async function _deleteKvInsight(qId) {
  try {
    await fetch('/api/insights', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qId }),
    });
    return true;
  } catch { return false; }
}

// Each has:
//   - compact state: single-line placeholder, auto-height
//   - expanded state on focus / when it has text: multi-line auto-grow
//   - only vertical height changes; width stays 50% of its row
// Saves on blur to /api/insights with id = `${chartId}:${slot}` (slot = a|b).
// Also mirrors to localStorage so edits survive refresh even offline.

function CommentBox({ chartId, slot, label }) {
  const [, forceRefresh] = useState(0);
  const [value, setValue] = useState('');
  const [focused, setFocused] = useState(false);
  const [status, setStatus] = useState(null);
  const ref = useRef(null);
  const id = `${chartId}:${slot}`;
  const storageKey = `Boost_note_${id}`;

  // Subscribe to the global KV fetch — once it lands we refresh
  useEffect(() => {
    const fn = () => forceRefresh(n => n + 1);
    window.__kvInsights.listeners.add(fn);
    return () => window.__kvInsights.listeners.delete(fn);
  }, []);

  // Initial value: localStorage → KV → empty
  useEffect(() => {
    const local = localStorage.getItem(storageKey);
    const remote = window.__kvInsights.data[id];
    setValue(local ?? remote ?? '');
  }, [id, storageKey, window.__kvInsights.loaded]);

  // Auto-grow textarea height to content
  const resize = () => {
    const el = ref.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = Math.min(600, el.scrollHeight) + 'px';
  };
  useEffect(resize, [value, focused]);

  const flashStatus = (type, text, ms = 1500) => {
    setStatus({ type, text });
    if (ms) setTimeout(() => setStatus(s => (s && s.text === text ? null : s)), ms);
  };

  const save = async () => {
    const next = (ref.current?.value ?? '').trim();
    const prior = (localStorage.getItem(storageKey) || '').trim();
    if (next === prior) return;
    if (!next) {
      localStorage.removeItem(storageKey);
    } else {
      localStorage.setItem(storageKey, next);
    }
    setValue(next);
    flashStatus('saving', 'Saving…', 0);
    try {
      const r = await fetch('/api/insights', {
        method: next ? 'POST' : 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(next ? { id, text: next } : { id }),
      });
      if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
      window.__kvInsights.data[id] = next || null;
      flashStatus('ok', 'Saved');
    } catch (e) {
      flashStatus('err', 'Network error — retry', 3500);
    }
  };

  const hasText = value.trim().length > 0;
  const expanded = focused || hasText;

  const statusColor =
    status?.type === 'ok'     ? 'oklch(0.55 0.14 155)' :
    status?.type === 'err'    ? 'oklch(0.55 0.18 25)'  :
    status?.type === 'saving' ? 'oklch(0.55 0.02 260)' :
    'var(--text-3)';

  return (
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 6,
        fontSize: 9, fontWeight: 600, textTransform: 'uppercase',
        letterSpacing: '0.05em', color: 'var(--text-3)',
        marginBottom: 3,
      }}>
        <span>{label || `Note ${slot.toUpperCase()}`}</span>
        {status && <span style={{ color: statusColor, textTransform: 'none' }}>{status.text}</span>}
      </div>
      <textarea
        ref={ref}
        value={value}
        placeholder={expanded ? 'Type a note…' : '+ add note'}
        onChange={e => setValue(e.target.value)}
        onFocus={() => setFocused(true)}
        onBlur={() => { setFocused(false); save(); }}
        rows={1}
        style={{
          width: '100%',
          minHeight: expanded ? 56 : 28,
          padding: expanded ? '8px 10px' : '5px 10px',
          border: `1px solid ${expanded ? 'oklch(0.75 0.06 260)' : 'var(--border)'}`,
          borderRadius: 4,
          background: expanded ? 'var(--panel)' : 'oklch(0.98 0.005 260)',
          fontSize: 11.5,
          fontFamily: 'inherit',
          color: 'var(--text)',
          resize: 'none',          // vertical size controlled by us only
          overflow: 'hidden',
          outline: 'none',
          lineHeight: 1.5,
          transition: 'min-height 120ms, padding 120ms, border-color 120ms, background 120ms',
          boxSizing: 'border-box',
        }}
      />
    </div>
  );
}

// Insight text-box under every chart.
// Resolution order per qId:
//   1. localStorage edit (instant, per-device)
//   2. KV override fetched from /api/insights (team-shared)
//   3. window.ChiComData.INSIGHTS[qId]   (baked-in LLM / manual)
//   4. children (terse fallback template)
// contentEditable → on blur, saves to localStorage + KV.
// "↺ Reset" button → clears both and falls back to the default.
//
// SHOW_INSIGHT: set to true to re-enable the AI Insight panel under every
// chart. Currently hidden because the Insights & Recommendations expert panel
// covers the same ground.
const SHOW_INSIGHT = false;

function Insight({ qId, children }) {
  const [, forceRefresh] = useState(0);
  const [status, setStatus] = useState(null);          // {type,text} or null
  const [edited, setEdited] = useState(null);          // local override text
  const ref = useRef(null);

  const storageKey = qId ? `Boost_insight_${qId}` : null;
  const kvText = qId ? (window.__kvInsights.data[qId] || null) : null;
  const llmText = qId ? (((window.ChiComData || {}).INSIGHTS || {})[qId] || null) : null;

  // Subscribe to KV-load event so the first fetch triggers a re-render
  useEffect(() => {
    const fn = () => forceRefresh(n => n + 1);
    window.__kvInsights.listeners.add(fn);
    return () => window.__kvInsights.listeners.delete(fn);
  }, []);

  // Load localStorage override once
  useEffect(() => {
    if (!storageKey) return;
    const saved = localStorage.getItem(storageKey);
    if (saved) setEdited(saved);
  }, [storageKey]);

  const defaultText = kvText || llmText || null;
  const currentText = edited ?? defaultText;
  const hasChildren = children && !(Array.isArray(children) && children.every(c => !c));
  const isOverridden = edited !== null || (kvText && kvText !== llmText);

  if (!currentText && !hasChildren) return null;

  const isAI = !!(currentText || llmText);
  const label = isAI ? (isOverridden ? 'AI Insight · edited' : 'AI Insight') : 'Insight';
  const accent     = isAI ? 'oklch(0.55 0.17 290)' : 'oklch(0.55 0.17 260)';
  const accentDark = isAI ? 'oklch(0.45 0.17 290)' : 'oklch(0.45 0.17 260)';
  const bg         = isAI ? 'oklch(0.97 0.02 290)' : 'oklch(0.97 0.01 260)';

  const flashStatus = (type, text, ms = 1800) => {
    setStatus({ type, text });
    if (ms) setTimeout(() => setStatus(s => s && s.text === text ? null : s), ms);
  };

  const saveEdit = async () => {
    if (!ref.current || !qId) return;
    const next = ref.current.innerText.trim();
    const baseline = (defaultText || '').trim();
    if (next === baseline) {
      // Reverted to default — clean up
      localStorage.removeItem(storageKey);
      setEdited(null);
      if (kvText) {
        await _deleteKvInsight(qId);
        window.__kvInsights.data[qId] = null;
        flashStatus('ok', 'Reverted to default');
      }
      return;
    }
    if (next === (edited || '').trim()) return; // unchanged from prior edit

    // Save locally first (instant, refresh-proof)
    localStorage.setItem(storageKey, next);
    setEdited(next);
    flashStatus('saving', 'Saving…', 0);
    const ok = await _saveKvInsight(qId, next);
    if (ok) {
      window.__kvInsights.data[qId] = next;
      flashStatus('ok', 'Saved');
    } else {
      flashStatus('err', 'Save failed — retry', 4000);
    }
  };

  const resetToDefault = async (e) => {
    e.stopPropagation();
    if (!qId) return;
    if (!confirm('Restore original AI insight? Your current edit will be discarded.')) return;
    localStorage.removeItem(storageKey);
    setEdited(null);
    flashStatus('saving', 'Clearing…', 0);
    const ok = await _deleteKvInsight(qId);
    window.__kvInsights.data[qId] = null;
    if (ref.current) ref.current.innerText = llmText || '';
    flashStatus(ok ? 'ok' : 'err', ok ? 'Reverted' : 'Network error — retry', ok ? 1800 : 4000);
  };

  const editable = !!qId; // only Qs with an id are persistable

  const statusColor =
    status?.type === 'ok'     ? 'oklch(0.55 0.14 155)' :
    status?.type === 'err'    ? 'oklch(0.55 0.18 25)'  :
    status?.type === 'saving' ? 'oklch(0.55 0.02 260)' :
    'transparent';

  return (
    <div style={{
      marginTop: 10,
      padding: '8px 12px',
      background: bg,
      borderLeft: `3px solid ${accent}`,
      borderRadius: 3,
      fontSize: 11,
      color: 'var(--text-2)',
      lineHeight: 1.55,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 8,
        fontSize: 9, fontWeight: 700, textTransform: 'uppercase',
        letterSpacing: '0.06em', color: accentDark, marginBottom: 4,
      }}>
        <span>{label}</span>
        {editable && isOverridden && (
          <button
            onClick={resetToDefault}
            title="Restore original AI insight"
            style={{
              border: 'none', background: 'transparent', cursor: 'pointer',
              color: accentDark, fontSize: 10, padding: '0 4px',
              fontWeight: 600, textDecoration: 'underline',
            }}
          >↺ Reset</button>
        )}
        {status && (
          <span style={{ color: statusColor, fontWeight: 600, textTransform: 'none' }}>
            {status.text}
          </span>
        )}
        {editable && !status && (
          <span style={{ marginLeft: 'auto', color: 'var(--text-3)', fontWeight: 500, textTransform: 'none' }}>
            click to edit
          </span>
        )}
      </div>
      {editable && currentText != null ? (
        <div
          ref={ref}
          contentEditable
          suppressContentEditableWarning
          onBlur={saveEdit}
          style={{
            outline: 'none', cursor: 'text',
            minHeight: 18, whiteSpace: 'pre-wrap',
          }}
        >{currentText}</div>
      ) : (
        <div>{currentText || children}</div>
      )}
    </div>
  );
}
// Gate the export rather than returning null inside the component (avoids

// Overview panel — Section 1 content (community + persona breakdown)
function OverviewPanel() {
  const tt = window.useTooltip();
  const ov = (window.ChiComData || {}).OVERVIEW;
  if (!ov) return null;

  // Non-sentiment palette — red and green are reserved for negative/positive
  // sentiment, so they're omitted here. Reuses TOPIC_COLORS where possible.
  const palette = window.TOPIC_COLORS || [
    'oklch(0.62 0.15 260)', 'oklch(0.62 0.15 80)',  'oklch(0.62 0.15 230)',
    'oklch(0.62 0.15 60)',  'oklch(0.62 0.15 320)', 'oklch(0.62 0.15 200)',
    'oklch(0.62 0.15 110)', 'oklch(0.62 0.15 290)', 'oklch(0.62 0.15 350)',
  ];

  const arc = (cx, cy, r, a0, a1) => {
    const large = a1 - a0 > 0.5 ? 1 : 0;
    const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
    const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
    const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
    return `M${cx},${cy} L${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} Z`;
  };

  const commTotal = ov.communities.reduce((a, b) => a + b.count, 0) || 1;
  let cAcc = 0;
  const commSeg = ov.communities.map((c, i) => {
    const s = cAcc; cAcc += c.count / commTotal;
    return { ...c, start: s, end: cAcc, color: palette[i % palette.length] };
  });

  // Persona-specific palette — must mirror PersonaByGroupChart's PCOL so
  // a given persona always renders in the same hue across the dashboard.
  // Red and green are reserved for negative / positive sentiment.
  const PERSONA_COLOR = {
    p_seller_az:   'oklch(0.42 0.24 255)',
    p_seller_ot:   'oklch(0.70 0.16 250)',
    p_prospect_az: 'oklch(0.58 0.20 50)',
    p_prospect_ot: 'oklch(0.78 0.16 50)',
    p_svc_az:      'oklch(0.52 0.13 195)',
    p_svc_cbec:    'oklch(0.74 0.11 195)',
  };
  const persTotal = ov.personas.reduce((a, b) => a + b.count, 0) || 1;
  let pAcc = 0;
  const persSeg = ov.personas.map((p) => {
    const s = pAcc; pAcc += p.count / persTotal;
    return { ...p, start: s, end: pAcc, color: PERSONA_COLOR[p.id] || 'oklch(0.55 0.10 290)' };
  });
  const maxComm = Math.max(...ov.communities.map(c => c.count), 1);

  const Narrative = ({ children }) => (
    <div style={{
      padding: '12px 16px',
      background: 'oklch(0.68 0.17 60 / 0.12)',
      borderLeft: '4px solid oklch(0.68 0.17 60)',
      borderRadius: 4,
      fontSize: 13,
      color: 'var(--text)',
      lineHeight: 1.55,
    }}>{children}</div>
  );

  return (
    <div style={{ display: 'grid', gap: 16 }}>
      <Narrative>
        <b>Post-IRR mentions by community:</b>{' '}
        Total mentions across <b>{ov.soaGroupCount} SOA groups</b> hold <b>{ov.soaPct}% SOV</b> trong{' '}
        <b>{ov.monthsCount} months</b>, . Within that, <b>{ov.topCommunity.name}</b> leads with{' '}
        <b>{ov.topCommunity.count.toLocaleString()}</b> mentions (~{ov.topCommunityPct}% SOV).
      </Narrative>

      <div className="grid-2" style={{ gap: 16 }}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Mentions by community</div>
            <span className="card-meta">{commTotal.toLocaleString()} total</span>
          </div>
          <div>
            {ov.communities.map((c, i) => (
              <div key={c.id} className="rowbar" style={{ gridTemplateColumns: '160px 1fr 60px' }}
                onMouseEnter={e => tt.show(e, `<b>${c.name}</b><br/>${c.count.toLocaleString()} mentions · ${c.type}`)}
                onMouseMove={tt.move} onMouseLeave={tt.hide}>
                <div style={{ fontSize: 11, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={c.name}>
                  <span className={`badge ${c.type === 'SOA' ? 'soa' : 'ec'}`} style={{ marginRight: 6 }}>{c.type}</span>
                  {c.short}
                </div>
                <div className="rowbar-track">
                  <div className="rowbar-fill" style={{ width: `${(c.count / maxComm) * 100}%`, background: palette[i % palette.length] }}></div>
                </div>
                <div className="rowbar-value mono">{c.count.toLocaleString()}</div>
              </div>
            ))}
          </div>
        
        <window.CardComments chartId="overview_1" />
      </div>

        <div className="card">
          <div className="card-head">
            <div className="card-title">Community distribution (% SOV)</div>
            <span className="card-meta">SOA {ov.soaPct}% · EC {ov.ecPct}%</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <svg width={200} height={200}>
              {commSeg.map(s => (
                <path key={s.id} d={arc(100, 100, 90, s.start, s.end)} fill={s.color}
                  stroke="var(--panel)" strokeWidth={1}
                  onMouseEnter={e => tt.show(e, `<b>${s.name}</b><br/>${s.count.toLocaleString()} · ${Math.round((s.count / commTotal) * 100)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
              ))}
            </svg>
            <div style={{ flex: 1, fontSize: 11, maxHeight: 200, overflowY: 'auto' }}>
              {commSeg.map(s => (
                <div key={s.id} style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 4 }}>
                  <span style={{ width: 9, height: 9, background: s.color, borderRadius: 2, flexShrink: 0 }}></span>
                  <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={s.name}>{s.short}</span>
                  <span className="mono" style={{ color: 'var(--text-3)' }}>{Math.round((s.count / commTotal) * 100)}%</span>
                </div>
              ))}
            </div>
          </div>
        
        <window.CardComments chartId="overview_2" />
      </div>
      </div>

      <Narrative>
        <b>Filtered mentions by persona:</b>{' '}
        {ov.topPersona && <><b>{ov.topPersona.vn}</b> dominates with <b>{ov.topPersona.count.toLocaleString()}</b> mentions</>}
        {ov.secondPersona && <>, followed by <b>{ov.secondPersona.vn}</b> with <b>{ov.secondPersona.count.toLocaleString()}</b> mentions.</>}
      </Narrative>

      <div className="grid-2" style={{ gap: 16 }}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Mentions by persona</div>
            <span className="card-meta">{persTotal.toLocaleString()} total</span>
          </div>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)', color: 'var(--text-3)', fontSize: 11 }}>
                <th style={{ textAlign: 'left', padding: '8px 6px', fontWeight: 600 }}>Seller Type</th>
                <th style={{ textAlign: 'right', padding: '8px 6px', fontWeight: 600 }}>mentions</th>
                <th style={{ textAlign: 'right', padding: '8px 6px', fontWeight: 600 }}>%</th>
              </tr>
            </thead>
            <tbody>
              {persSeg.map((p) => (
                <tr key={p.id} style={{ borderBottom: '1px solid var(--border)' }}>
                  <td style={{ padding: '7px 6px' }}>
                    <span style={{ display: 'inline-block', width: 8, height: 8, background: p.color, borderRadius: 2, marginRight: 8, verticalAlign: 'middle' }}></span>
                    {p.vn}
                  </td>
                  <td className="mono" style={{ textAlign: 'right', padding: '7px 6px' }}>{p.count.toLocaleString()}</td>
                  <td className="mono" style={{ textAlign: 'right', padding: '7px 6px', color: 'var(--text-3)' }}>{p.pct}%</td>
                </tr>
              ))}
            </tbody>
          </table>
        
        <window.CardComments chartId="overview_3" />
      </div>

        <div className="card">
          <div className="card-head">
            <div className="card-title">Persona distribution (%)</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <svg width={220} height={220}>
              {persSeg.map(s => (
                <path key={s.id} d={arc(110, 110, 100, s.start, s.end)} fill={s.color}
                  stroke="var(--panel)" strokeWidth={1}
                  onMouseEnter={e => tt.show(e, `<b>${s.vn}</b><br/>${s.count.toLocaleString()} · ${s.pct}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
              ))}
            </svg>
            <div style={{ flex: 1, fontSize: 11 }}>
              {persSeg.map(s => (
                <div key={s.id} style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 5 }}>
                  <span style={{ width: 10, height: 10, background: s.color, borderRadius: 2, flexShrink: 0 }}></span>
                  <span style={{ flex: 1 }}>{s.vn}</span>
                  <span className="mono" style={{ color: 'var(--text-3)' }}>{s.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        
        <window.CardComments chartId="overview_4" />
      </div>
      </div>
      {tt.node}
    </div>
  );
}
window.OverviewPanel = OverviewPanel;

      <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid var(--border)', fontSize: 11, color: 'var(--text-3)' }}>
        {window.D.MASTER_TOPICS.length} Master Topics · {(window.D.KPI && window.D.KPI.subTopics) || 0} sub-topics
      </div>
      <window.Insight qId="Q1">
        Leading master topic: <b>{q1[0].en || q1[0].vn}</b> ({q1[0].weight}%).
        Lowest with data: <b>{(() => { const m = [...q1].reverse().find(mt => mt.weight > 0); return m ? (m.en || m.vn) : '—'; })()}</b>.
        Top-bottom gap: {(q1[0].weight - (q1[q1.length - 1].weight || 0)).toFixed(1)} points.
      </window.Insight>
    
        <window.CardComments chartId="Q1_1" />
      </div>
  );

  const HeatGrid = ({ title, groups, accent }) => {
    const bins = [5, 10, 20, 30, 50];
    // Orientation: Master Topics as ROWS (full names, left), groups as COLUMNS (labels rotated at top)
    const cellW = 76;
    const cellH = 40;
    const rowGap = 4;
    const leftPad = 320;    // space for MT full names on the left
    const topPad = 140;     // space for rotated group labels at top
    const mts = window.D.MASTER_TOPICS;
    const svgHeight = topPad + mts.length * (cellH + rowGap) + 20;
    const svgWidth  = leftPad + groups.length * (cellW + 4) + 20;
    const cardMinHeight = svgHeight + 80;
    return (
      <div className="card" style={{ minHeight: cardMinHeight }}>
        <div className="card-head">
          <div>
            <div className="card-title">{title}</div>
          </div>
          <div className="legend legend-bins">
            {['0-5%', '5-10%', '10-20%', '20-30%', '30-50%'].map((label, i) => (
              <span key={label} className="legend">
                <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 5, accent) }}></span>
                {label}
              </span>
            ))}
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <svg width={svgWidth} height={svgHeight} style={{ display: 'block' }}>
            {/* Master Topic full names on the left (one row per MT) */}
            {mts.map((mt, mi) => {
              const y = topPad + mi * (cellH + rowGap) + cellH / 2 + 4;
              const label = mt.en.length > 46 ? mt.en.slice(0, 44) + '…' : mt.en;
              return (
                <text key={mt.id} x={leftPad - 10} y={y}
                  textAnchor="end" className="axis-tick"
                  style={{ fontSize: 11, fill: 'var(--text-2)' }}>
                  <title>{mt.vn}</title>{label}
                </text>
              );
            })}
            {/* Group labels — rotated at the top, one per column */}
            {groups.map((g, gi) => {
              const x = leftPad + gi * (cellW + 4) + cellW / 2;
              const anchorY = topPad - 12;
              return (
                <text key={g.id} x={x} y={anchorY}
                  textAnchor="start" className="axis-tick"
                  style={{ fontSize: 11 }}
                  transform={`rotate(-45 ${x} ${anchorY})`}>
                  <title>{g.name}</title>{g.short}
                </text>
              );
            })}
            {/* Cells: MT × Group */}
            {mts.map((mt, mi) => (
              groups.map((g, gi) => {
                const v = window.D.Q1_WEIGHTS[mt.id][g.id];
                const fill = window.binColor(v, bins, accent);
                const x0 = leftPad + gi * (cellW + 4);
                const y0 = topPad + mi * (cellH + rowGap);
                return (
                  <g key={g.id + mt.id}
                    onMouseEnter={e => tt.show(e, `<b>${g.short}</b><br/>${mt.en}<br/>${v}% mentions`)}
                    onMouseMove={tt.move} onMouseLeave={tt.hide}
                    style={{ cursor: 'pointer' }}>
                    <rect x={x0} y={y0} width={cellW} height={cellH} fill={fill} rx={3} />
                    <text x={x0 + cellW / 2} y={y0 + cellH / 2 + 4}
                      textAnchor="middle" className="axis-tick"
                      pointerEvents="none"
                      style={{ fill: v > 20 ? 'white' : 'var(--text-2)', fontSize: 11, fontWeight: 500 }}>
                      {v}%
                    </text>
                  </g>
                );
              })
            ))}
          </svg>
        </div>
        <div style={{ marginTop: 10, fontSize: 11, color: 'var(--text-3)' }}>
          {mts.length} Master Topics × {groups.length} groups · hover a cell for details
        </div>
        {(() => {
          // Find top (MT, group) cell
          let best = { mt: null, g: null, v: -1 };
          mts.forEach(mt => groups.forEach(g => {
            const v = window.D.Q1_WEIGHTS[mt.id][g.id];
            if (v > best.v) best = { mt, g, v };
          }));
          // Most concentrated group (highest max MT share)
          const grpMax = groups.map(g => ({
            g,
            top: mts.reduce((acc, mt) => {
              const v = window.D.Q1_WEIGHTS[mt.id][g.id];
              return v > acc.v ? { mt, v } : acc;
            }, { mt: null, v: 0 }),
          }));
          return (
            <window.Insight>
              Hottest cell: <b>{best.g.short}</b> allocates <b>{best.v}%</b> to <b>{best.mt.en}</b>.
              {grpMax[0] && <> Most concentrated group: <b>{grpMax.sort((a, b) => b.top.v - a.top.v)[0].g.short}</b> ({grpMax[0].top.v}%).</>}
            </window.Insight>
          );
        })()}
      
        <window.CardComments chartId="Q1_2" />
      </div>
    );
  };

  const SubTopicBars = () => {
    const displayedSubs = subTopics.filter(s => s.display !== false);
    const hiddenCount = subTopics.length - displayedSubs.length;
    const maxSubWDisplay = displayedSubs.length ? Math.max(...displayedSubs.map(s => s.weight)) : 1;

    return (
    <div className="card" style={{ minHeight: 440 }}>

      </div>
      <div>
        {displayedSubs.map((s, i) => (
          <div key={s.vn} className="rowbar"

            onMouseMove={tt.move} onMouseLeave={tt.hide}

  return (

        <div className="col-12">
          <HeatGrid
            title={<>SOA groups — Weight <span className="badge soa">{window.D.SOA_GROUPS.length} groups</span></>}

            groups={window.D.EC_GROUPS}

          />

      {tt.node}

}
