// ============ Q2 — Persona × Master Topic heatmap ============

// Shared heatmap renderer — takes a matrix + title + accent, renders the
// same structure as the original Q2 chart. Used for both SOA and EC splits
// when available (and as a fallback for the global view otherwise).
function Q2Heatmap({ matrix, title, badge, accent, chartId, tt, personas, mts }) {
  const max = Math.max(1, ...mts.flatMap(mt => personas.map(p => matrix[mt.id][p.id])));
  const cellW = 96, cellH = 42;
  const leftPad = 340;
  const topPad = 120;
  const w = leftPad + personas.length * cellW + 20;
  const h = topPad + mts.length * cellH + 20;
  const bins = ['0–50', '51–150', '151–300', '301–500', '500+'];

  return (
    <div className="card">
      <div className="card-head">
        <div>
          <div className="card-title">{title} {badge}</div>
        </div>
        <div className="legend legend-bins">
          {bins.map((label, i) => (
            <span key={label} className="legend">
              <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 5, accent) }}></span>
              {label}
            </span>
          ))}
        </div>
      </div>
      <div style={{ overflowX: 'auto' }}>
        <svg width={w} height={h} style={{ display: 'block' }}>
          {personas.map((p, pi) => {
            const x = leftPad + pi * cellW + cellW / 2;
            const anchorY = topPad - 14;
            const label = p.vn.length > 22 ? p.vn.slice(0, 21) + '…' : p.vn;
            return (
              <g key={p.id}>
                <text x={x} y={anchorY}
                  textAnchor="start" className="axis-tick"
                  style={{ fontSize: 11 }}
                  transform={`rotate(-45 ${x} ${anchorY})`}>
                  <title>{p.vn}</title>{label}
                </text>
              </g>
            );
          })}
          {mts.map((mt, mi) => (
            <g key={mt.id}>
              <text x={leftPad - 12} y={topPad + mi * cellH + cellH / 2 + 4}
                textAnchor="end" className="axis-tick" style={{ fontSize: 11, fill: 'var(--text-2)' }}>
                {mt.en.length > 48 ? mt.en.slice(0, 46) + '…' : mt.en}
              </text>
              {personas.map((p, pi) => {
                const v = matrix[mt.id][p.id];
                const intensity = Math.pow(v / max, 0.7);
                return (
                  <g key={p.id}>
                    <rect
                      x={leftPad + pi * cellW + 3}
                      y={topPad + mi * cellH + 3}
                      width={cellW - 6} height={cellH - 6}
                      fill={window.heatColor(intensity, accent)}
                      rx={3}
                      onMouseEnter={e => tt.show(e, `<b>${p.vn}</b> × ${mt.en.slice(0, 36)}…<br/>${v} mentions`)}
                      onMouseMove={tt.move} onMouseLeave={tt.hide}
                      style={{ cursor: 'pointer' }}
                    />
                    <text
                      x={leftPad + pi * cellW + cellW / 2}
                      y={topPad + mi * cellH + cellH / 2 + 4}
                      textAnchor="middle"
                      className="mono"
                      style={{ fontSize: 11, fill: intensity > 0.45 ? 'white' : 'var(--text-2)' }}>
                      {v}
                    </text>
                  </g>
                );
              })}
            </g>
          ))}
        </svg>
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q2() {
  const tt = window.useTooltip();
  const personas = window.D.PERSONAS;
  const mts = window.D.MASTER_TOPICS;

  // Prefer split matrices when the build pipeline has emitted them.
  const hasSplit = window.D.Q2_MATRIX_SOA && window.D.Q2_MATRIX_EC;
  const matrixForInsight = window.D.Q2_MATRIX;

  // Insight calc uses the global matrix so numbers align with KPIs.
  let best = { p: null, mt: null, v: -1 };
  mts.forEach(mt => personas.forEach(p => {
    const v = matrixForInsight[mt.id][p.id];
    if (v > best.v) best = { p, mt, v };
  }));
  const personaTotals = personas.map(p => ({
    p,
    total: mts.reduce((s, mt) => s + matrixForInsight[mt.id][p.id], 0),
  }));
  personaTotals.sort((a, b) => b.total - a.total);

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-12">
            <Q2Heatmap
              matrix={window.D.Q2_MATRIX_SOA}
              title="SOA — Master Topics by Persona"
              badge={<span className="badge soa">{window.D.SOA_GROUPS.length} groups</span>}
              accent="rose"
              chartId="Q2_1"
              tt={tt} personas={personas} mts={mts}
            />
          </div>
          <div className="col-12">
            <Q2Heatmap
              matrix={window.D.Q2_MATRIX_EC}
              title="EC — Master Topics by Persona"
              badge={<span className="badge ec">{window.D.EC_GROUPS.length} groups</span>}
              accent="teal"
              chartId="Q2_2"
              tt={tt} personas={personas} mts={mts}
            />
          </div>
        </>
      ) : (
        <div className="col-12">
          <Q2Heatmap
            matrix={window.D.Q2_MATRIX}
            title="Master Topics by Persona"
            badge={null}
            accent="indigo"
            chartId="Q2_1"
            tt={tt} personas={personas} mts={mts}
          />
        </div>
      )}

      <div className="col-12">
        <window.Insight qId="Q2">
          Densest cell: <b>{best.p.vn}</b> × <b>{best.mt.en}</b> with <b>{best.v.toLocaleString()}</b> mentions.
          Highest-total persona: <b>{personaTotals[0].p.vn}</b> ({personaTotals[0].total.toLocaleString()}).
        </window.Insight>
      </div>

      {tt.node}
    </div>
  );
}
window.Q2 = Q2;

<script type="text/babel">
/* global React, D, window */
const { useState: useStateQ3 } = React;

// ============ Q3 — Seller vs Prospect deep dive ============
function Q3() {
  const tt = window.useTooltip();
  const q3 = [...window.D.Q3_SELLER_PROSPECT].sort((a, b) => Math.max(b.sellerPct, b.prospectPct) - Math.max(a.sellerPct, a.prospectPct));
  const max = Math.max(...q3.flatMap(r => [r.sellerPct, r.prospectPct]));

  // Match the persona palette in shell.jsx (Seller=blue, Prospect=orange)
  const sellerColor = 'oklch(0.50 0.16 245)';
  const prospectColor = 'oklch(0.55 0.17 55)';

  // Sub-topic difference — each bar uses its parent master-topic color
  const subs = [...window.D.Q3_SUBS].sort((a, b) => b.diff - a.diff);
  const absMax = Math.max(...subs.map(s => Math.abs(s.diff))) + 1;
  // Fallback color for any sub-topic missing .color
  const defaultColor = 'oklch(0.62 0.15 260)';

  return (
    <div className="grid-12">
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">{window.D.MASTER_TOPICS.length} Master Topics — Seller vs Prospect</div>
            </div>
            <div className="legend-inline">
              <span><span className="dot" style={{ background: sellerColor }}></span>Seller</span>
              <span><span className="dot" style={{ background: prospectColor }}></span>Prospect</span>
            </div>
          </div>
          <div>
            {q3.map(r => (
              <div key={r.id} style={{ padding: '6px 0', borderBottom: '1px solid var(--border)' }}>
                <div style={{ fontSize: 12, marginBottom: 4, color: 'var(--text)', display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '70%' }}>{r.en}</span>
                  <span className="mono" style={{ fontSize: 11, color: 'var(--text-3)' }}>
                    S {r.sellerPct}% · P {r.prospectPct}%
                  </span>
                </div>
                <div style={{ display: 'flex', gap: 4, alignItems: 'center' }}
                  onMouseEnter={e => tt.show(e, `<b>${r.en}</b><br/>Seller ${r.sellerPct}% · Prospect ${r.prospectPct}%<br/>diff ${r.diff > 0 ? '+' : ''}${r.diff}pp`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}>
                  <div style={{ flex: 1, display: 'flex', gap: 2, flexDirection: 'column' }}>
                    <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 2 }}>
                      <div style={{ width: `${(r.sellerPct / max) * 100}%`, height: '100%', background: sellerColor, borderRadius: 2 }}></div>
                    </div>
                    <div style={{ height: 6, background: 'var(--panel-2)', borderRadius: 2 }}>
                      <div style={{ width: `${(r.prospectPct / max) * 100}%`, height: '100%', background: prospectColor, borderRadius: 2 }}></div>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          {(() => {
            const sellerLead = [...q3].sort((a, b) => b.diff - a.diff)[0];
            const prospectLead = [...q3].sort((a, b) => a.diff - b.diff)[0];
            return (
              <window.Insight qId="Q3">
                Seller dominates: <b>{sellerLead.en}</b> (+{sellerLead.diff}pp) ·
                Prospect dominates: <b>{prospectLead.en}</b> ({prospectLead.diff}pp).
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q3_1" />
      </div>
      </div>

      <div className="col-6">
        <div className="card" style={{ minHeight: 520 }}>
          <div className="card-head">
            <div>
              <div className="card-title">Sub-topic difference</div>
              <div className="card-sub">Bars colored by parent master topic</div>
            </div>
          </div>
          <div style={{
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            fontSize: 10, color: 'var(--text-3)', padding: '0 6px 4px',
          }}>
            <span>← Prospect dominates</span>
            <span style={{ color: 'var(--text-2)' }}>{subs.length} sub-topics</span>
            <span>Seller dominates →</span>
          </div>
          <svg width="100%" height={subs.length * 20 + 30} viewBox={`0 0 640 ${subs.length * 20 + 30}`} preserveAspectRatio="none">
            <line x1={320} y1={0} x2={320} y2={subs.length * 20} className="axis-line" />
            {subs.map((s, i) => {
              const y = i * 20;
              const barW = (Math.abs(s.diff) / absMax) * 300;
              const x = s.diff >= 0 ? 320 : 320 - barW;
              return (
                <g key={i}
                  onMouseEnter={e => tt.show(e, `<b>${s.en || s.vn}</b><br/>${s.vn}<br/>Seller ${s.seller}% · Prospect ${s.prospect}%<br/>diff ${s.diff > 0 ? '+' : ''}${s.diff}pp`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}>
                  <text x={315} y={y + 14} textAnchor={s.diff >= 0 ? 'end' : 'start'} className="axis-tick" style={{ fontSize: 10 }}>
                    {(s.en || s.vn).length > 34 ? (s.en || s.vn).slice(0, 32) + '…' : (s.en || s.vn)}
                  </text>
                  <rect x={x} y={y + 5} width={barW} height={12} fill={s.color || defaultColor} rx={2} />
                  <text x={s.diff >= 0 ? x + barW + 4 : x - 4} y={y + 14}
                    textAnchor={s.diff >= 0 ? 'start' : 'end'}
                    className="mono" style={{ fontSize: 10, fill: 'var(--text-3)' }}>
                    {s.diff > 0 ? '+' : ''}{s.diff}
                  </text>
                </g>
              );
            })}
          </svg>
          {(() => {
            const biggestGap = [...subs].sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff))[0];
            return (
              <window.Insight>
                Sub-topic with the largest Seller/Prospect gap: <b>{biggestGap.en || biggestGap.vn}</b> ({biggestGap.diff > 0 ? '+' : ''}{biggestGap.diff}pp).
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q3_2" />
      </div>
      </div>

      {tt.node}
    </div>
  );
}
window.Q3 = Q3;

// ============ Q4 — Trends over time ============
function Q4() {
  const tt = window.useTooltip();
  // Single-month datasets (e.g. April-only build) collapse the monthly view to
  // a single point. Auto-switch to weekly granularity in that case so the
  // chart has something to draw across the time axis.
  const useWeekly = (window.D.MONTHS || []).length < 2;
  const trends = useWeekly ? window.D.Q4_WEEKLY : window.D.Q4_TRENDS;
  const months = useWeekly ? window.D.WEEKS : window.D.MONTHS;
  const granLabel = useWeekly ? 'weekly' : 'monthly';
  const W = 700, H = 280, pad = { t: 20, r: 20, b: 30, l: 40 };
  const maxY = Math.max(...trends.flatMap(t => t.points));
  const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;

  const linePts = (pts) => pts.map((v, i) => {
    const x = pad.l + (i / Math.max(pts.length - 1, 1)) * plotW;
    const y = pad.t + plotH - (v / maxY) * plotH;
    return [x, y];
  });

  // Stacked percentage area chart
  const stacked = months.map((m, mi) => {
    const total = trends.reduce((a, t) => a + (t.points[mi] || 0), 0) || 1;
    let acc = 0;
    return trends.map(t => {
      const frac = (t.points[mi] || 0) / total;
      const seg = { start: acc, end: acc + frac, id: t.id, color: t.color };
      acc += frac;
      return seg;
    });
  });

  const stackedPath = (tIdx) => {
    const topPts = stacked.map((s, mi) => [pad.l + (mi / Math.max(months.length - 1, 1)) * plotW, pad.t + plotH - s[tIdx].end * plotH]);
    const botPts = stacked.map((s, mi) => [pad.l + (mi / Math.max(months.length - 1, 1)) * plotW, pad.t + plotH - s[tIdx].start * plotH]).reverse();
    return [...topPts, ...botPts].map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ') + ' Z';
  };

  // weekly with events
  const weekly = window.D.Q4_WEEKLY;
  const weeks = window.D.Q4_EVENTS;
  const WW = 820, WH = 320, wpad = { t: 64, r: 240, b: 32, l: 44 };
  const maxWY = Math.max(...weekly.flatMap(t => t.points));
  const wPlotW = WW - wpad.l - wpad.r, wPlotH = WH - wpad.t - wpad.b;
  const weekRangeLabel = (window.D.WEEKS && window.D.WEEKS.length)
    ? `${window.D.WEEKS[0]} — ${window.D.WEEKS[window.D.WEEKS.length - 1]} · weekly`
    : 'weekly';

  return (
    <div className="grid-12">
      <div className="col-6">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Master Topics — absolute counts</div>
            </div>
            <span className="card-meta">{granLabel}</span>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <g key={i}>
                <line x1={pad.l} y1={pad.t + plotH * f} x2={W - pad.r} y2={pad.t + plotH * f} className="grid-line" />

            {trends.map((t, ti) => {
              const pts = linePts(t.points);
              const d = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');

            </div>
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
            {trends.map((t, ti) => (
              <path key={t.id} d={stackedPath(ti)} fill={t.color} opacity={0.85}
                onMouseEnter={e => tt.show(e, `<b>${t.en.slice(0, 40)}…</b>`)}
                onMouseMove={tt.move} onMouseLeave={tt.hide} />
            ))}
            {months.map((m, i) => (
              <text key={m} x={pad.l + (i / Math.max(months.length - 1, 1)) * plotW} y={H - 10} textAnchor="middle" className="axis-tick">{m}</text>
            ))}
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <text key={i} x={pad.l - 6} y={pad.t + plotH * f + 3} textAnchor="end" className="axis-tick">
                {Math.round((1 - f) * 100)}%
              </text>
            ))}
          </svg>
        
        <window.CardComments chartId="Q4_2" />
      </div>
      </div>

      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Weekly topic trends</div>
            </div>
            <span className="card-meta">{weekRangeLabel}</span>
          </div>
          <svg width="100%" viewBox={`0 0 ${WW} ${WH}`} style={{ display: 'block' }}>
            {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
              <line key={i} x1={wpad.l} y1={wpad.t + wPlotH * f} x2={WW - wpad.r} y2={wpad.t + wPlotH * f} className="grid-line" />
            ))}
            {weeks.map((ev, i) => {
              const x = wpad.l + (ev.week / (window.D.WEEKS.length - 1)) * wPlotW;
              // 3-row stagger so adjacent spike labels don't collide
              const yOffset = [-46, -30, -14][i % 3];
              return (
                <g key={i}>
                  <line x1={x} y1={wpad.t} x2={x} y2={wpad.t + wPlotH} stroke="var(--neg)" strokeDasharray="3 3" strokeWidth={1} opacity={0.6} />
                  <line x1={x} y1={wpad.t + yOffset + 2} x2={x} y2={wpad.t} stroke="var(--neg)" strokeWidth={1} opacity={0.35} />
                  <text x={x} y={wpad.t + yOffset} textAnchor="middle" className="axis-tick" style={{ fill: 'var(--neg)', fontSize: 10 }}>{ev.label}</text>
                </g>
              );
            })}
            {weekly.map(t => {
              const pts = t.points.map((v, i) => {
                const x = wpad.l + (i / (t.points.length - 1)) * wPlotW;
                const y = wpad.t + wPlotH - (v / maxWY) * wPlotH;
                return [x, y];
              });
              const d = pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x},${y}`).join(' ');
              return (
                <g key={t.id}>
                  <path d={d} fill="none" stroke={t.color} strokeWidth={2} />
                  {pts.map(([x, y], pi) => (
                    <circle key={pi} cx={x} cy={y} r={2.5} fill={t.color} />
                  ))}
                </g>
              );
            })}
            {window.D.WEEKS.map((w, i) => i % 2 === 0 && (
              <text key={w} x={wpad.l + (i / (window.D.WEEKS.length - 1)) * wPlotW} y={WH - 10} textAnchor="middle" className="axis-tick">{w}</text>
            ))}
            {weekly.map((t, i) => {
              const label = t.en.length > 24 ? t.en.slice(0, 22) + '…' : t.en;
              return (
                <g key={t.id + 'leg'}>
                  <rect x={WW - wpad.r + 10} y={wpad.t + i * 22} width={10} height={10} fill={t.color} rx={2} />
                  <text x={WW - wpad.r + 26} y={wpad.t + i * 22 + 9} className="axis-tick" style={{ fontSize: 10 }}>
                    <title>{t.en || t.vn}</title>{label}
                  </text>
                </g>
              );
            })}
          </svg>
          {(() => {
            const spikeCount = (window.D.Q4_EVENTS || []).length;
            // For multi-week single-month builds, find the topic with the
            // largest peak across the weeks of the month and report it.
            const peakOf = (t) => Math.max(...t.points);
            const topTrend = [...(window.D.Q4_WEEKLY || [])].sort((a, b) => peakOf(b) - peakOf(a))[0];
            const peakIdx = topTrend ? topTrend.points.indexOf(peakOf(topTrend)) : -1;
            const peakWk = peakIdx >= 0 ? (window.D.WEEKS || [])[peakIdx] : '';
            const peakVal = peakIdx >= 0 ? topTrend.points[peakIdx] : 0;
            const first = topTrend?.points[0] || 0;
            const last  = topTrend ? topTrend.points[topTrend.points.length - 1] : 0;
            const delta = first > 0 ? Math.round((last / first - 1) * 100) : 0;
            return (
              <window.Insight qId="Q4">
                {spikeCount > 0 && <>Detected <b>{spikeCount}</b> weeks with volume exceeding 1.5× avg. </>}
                {topTrend && (
                  useWeekly
                    ? <>Top topic this April: <b>{topTrend.en}</b> — peaked at <b>{peakVal.toLocaleString()}</b> mentions in week of <b>{peakWk}</b>, closing at {last.toLocaleString()} ({delta >= 0 ? '+' : ''}{delta}% vs first week).</>
                    : <>Leading topic last month: <b>{topTrend.en}</b> ({last.toLocaleString()} mentions, {delta >= 0 ? '+' : ''}{delta}% vs first month).</>
                )}
              </window.Insight>
            );
          })()}
        
        <window.CardComments chartId="Q4_3" />
      </div>
      </div>

      {tt.node}
    </div>
  );
}
window.Q4 = Q4;

</script>
<script type="text/babel">
/* global React, D, window */

// ============ Shared helpers ============

// SVG donut-arc path — used by the Q6 peak-hour breakdown.
function _arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx  = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy  = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex  = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey  = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

// ============ Q5 — Negative by day-of-week ============

// Single weekday bar chart — used for SOA, EC, or global view.
function DayBar({ daily, title, badge, chartId, tt }) {
  const maxDay = Math.max(1, ...daily.map(d => d.count));
  const topDay = [...daily].sort((a, b) => b.count - a.count)[0] || { day: '—', en: '—', count: 0 };
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
        <span className="card-meta mono">Q5</span>
      </div>
      <svg width="100%" viewBox="0 0 320 220">
        {daily.map((d, i) => {
          const x = 32 + i * 38;
          const barH = (d.count / maxDay) * 160;
          return (
            <g key={d.day}
              onMouseEnter={e => tt.show(e, `<b>${d.day}</b> (${d.en})<br/>${d.count} negative mentions`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }}>
              <rect x={x} y={180 - barH} width={28} height={barH} fill="var(--neg)" rx={2} opacity={0.85} />
              <text x={x + 14} y={195} textAnchor="middle" className="axis-tick">{d.day}</text>
              <text x={x + 14} y={180 - barH - 4} textAnchor="middle" className="mono" style={{ fontSize: 10, fill: 'var(--text-2)' }}>{d.count}</text>
            </g>
          );
        })}
        <line x1={20} y1={180} x2={300} y2={180} className="axis-line" />
      </svg>
      <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4 }}>
        Peak: <b style={{ color: 'var(--text)' }}>{topDay.day} / {topDay.en}</b> ({topDay.count.toLocaleString()})
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

// Single top-neg-topics row-bar list.
function TopNegTopics({ items, title, badge, chartId, tt }) {
  const maxTop = Math.max(1, ...items.map(t => t.count));
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
      </div>
      <div>
        {items.map(t => (
          <div key={t.vn} className="rowbar" style={{ gridTemplateColumns: '1fr 60px' }}
            onMouseEnter={e => tt.show(e, `<b>${t.en || t.vn}</b><br/>${t.vn}<br/>${t.count} negative mentions`)}
            onMouseMove={tt.move} onMouseLeave={tt.hide}>
            <div>
              <div style={{ fontSize: 11, marginBottom: 4, color: 'var(--text)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{t.en || t.vn}</div>
              <div className="rowbar-track">
                <div className="rowbar-fill" style={{ width: `${(t.count / maxTop) * 100}%`, background: 'var(--neg)' }}></div>
              </div>
            </div>
            <div className="rowbar-value">{t.count}</div>
          </div>
        ))}
      </div>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q5() {
  const tt = window.useTooltip();
  const hasSplit = window.D.Q5_BY_DAY_SOA && window.D.Q5_BY_DAY_EC && window.D.Q5_TOP_NEG_SOA && window.D.Q5_TOP_NEG_EC;

  const daily  = window.D.Q5_BY_DAY;
  const topDay = [...daily].sort((a, b) => b.count - a.count)[0] || { day: '—', count: 0 };
  const topNeg = window.D.Q5_TOP_NEG[0] || { vn: '—', count: 0 };

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-6">
            <DayBar daily={window.D.Q5_BY_DAY_SOA} title="Day of week" badge={soaBadge} chartId="Q5_1" tt={tt} />
          </div>
          <div className="col-6">
            <DayBar daily={window.D.Q5_BY_DAY_EC} title="Day of week" badge={ecBadge} chartId="Q5_3" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG_SOA} title="Top negative topics" badge={soaBadge} chartId="Q5_2" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG_EC} title="Top negative topics" badge={ecBadge} chartId="Q5_4" tt={tt} />
          </div>
        </>
      ) : (
        <>
          <div className="col-6">
            <DayBar daily={daily} title="Distribution by day of week" chartId="Q5_1" tt={tt} />
          </div>
          <div className="col-6">
            <TopNegTopics items={window.D.Q5_TOP_NEG} title="Top 6 negative topics" chartId="Q5_2" tt={tt} />
          </div>
        </>
      )}

      <div style={{ marginTop: 12, gridColumn: '1 / -1' }}>
        <window.Insight qId="Q5">
          Peak day: <b>{topDay.day}</b> ({topDay.count.toLocaleString()} negative mentions) ·
          Top negative topic: <b>{topNeg.en || topNeg.vn}</b> ({topNeg.count.toLocaleString()}).
        </window.Insight>
      </div>

      {tt.node}
    </div>
  );
}
window.Q5 = Q5;


// ============ Q6 — Negative by hour-of-day ============

// Single hour-line chart — used for SOA, EC, or global view. Peak-window
// band comes from the global `peakWindow` (shared band across all segments).
function HourLine({ hourly, title, badge, chartId, peakWindow, tt }) {
  const maxHour = Math.max(1, ...hourly.map(d => d.count));
  const pw = peakWindow;
  return (
    <div className="card">
      <div className="card-head">
        <div><div className="card-title">{title} {badge}</div></div>
        <span className="card-meta mono">Q6</span>
      </div>
      <svg width="100%" viewBox="0 0 680 220">
        {[0, 0.5, 1].map((f, i) => (
          <line key={i} x1={30} y1={30 + 150 * f} x2={660} y2={30 + 150 * f} className="grid-line" />
        ))}
        <path
          d={hourly.map((d, i) => {
            const x = 30 + (i / 23) * 630;
            const y = 180 - (d.count / maxHour) * 150;
            return `${i === 0 ? 'M' : 'L'}${x},${y}`;
          }).join(' ')}
          fill="none" stroke="var(--neg)" strokeWidth={1.8}
        />
        <path
          d={
            hourly.map((d, i) => {
              const x = 30 + (i / 23) * 630;
              const y = 180 - (d.count / maxHour) * 150;
              return `${i === 0 ? 'M' : 'L'}${x},${y}`;
            }).join(' ') + ` L${30 + 630},180 L30,180 Z`
          }
          fill="var(--neg)" opacity={0.1}
        />
        {hourly.map((d, i) => {
          const x = 30 + (i / 23) * 630;
          const y = 180 - (d.count / maxHour) * 150;
          return (
            <circle key={i} cx={x} cy={y} r={3} fill="var(--neg)"
              onMouseEnter={e => tt.show(e, `<b>${d.hour}h</b><br/>${d.count} posts`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
          );
        })}
        {[0, 4, 8, 12, 16, 20, 23].map(h => (
          <text key={h} x={30 + (h / 23) * 630} y={200} textAnchor="middle" className="axis-tick">{h}h</text>
        ))}
        {pw && pw.windowSize > 0 && (() => {
          const bands = [];
          if (pw.startHour + pw.windowSize <= 24) {
            bands.push([pw.startHour, pw.windowSize]);
          } else {
            bands.push([pw.startHour, 24 - pw.startHour]);
            bands.push([0, pw.windowSize - (24 - pw.startHour)]);
          }
          return (
            <>
              {bands.map(([s, w], i) => (
                <rect key={i} x={30 + (s / 23) * 630} y={30} width={(w / 23) * 630} height={150} fill="var(--neg)" opacity={0.06} />
              ))}
              <text x={30 + ((pw.startHour + pw.windowSize / 2) / 23) * 630} y={26} textAnchor="middle" className="axis-tick" style={{ fill: 'var(--neg)', fontSize: 10 }}>
                {pw.startHour}h–{pw.endHour}h peak
              </text>
            </>
          );
        })()}
      </svg>
      {chartId && <window.CardComments chartId={chartId} />}
    </div>
  );
}

function Q6() {
  const tt = window.useTooltip();
  const heatmap = window.D.Q56_HEATMAP;
  const maxHeat = Math.max(1, ...heatmap.flat());
  const hourly  = window.D.Q6_BY_HOUR;
  const topHour = [...hourly].sort((a, b) => b.count - a.count)[0] || { hour: 0, count: 0 };
  const pw      = window.D.Q5_PEAK_WINDOW;

  const hasSplit = window.D.Q6_BY_HOUR_SOA && window.D.Q6_BY_HOUR_EC;

  // Donut for peak-window distribution (stays cross-cutting / combined)
  const earlyTotal = window.D.Q5_EARLY_DIST.reduce((a, b) => a + b.slot, 0);
  let donutAcc = 0;
  const donutSeg = window.D.Q5_EARLY_DIST.map((t, i) => {
    const frac = t.slot / earlyTotal;
    const start = donutAcc;
    donutAcc += frac;
    return { ...t, start, end: donutAcc, color: `oklch(0.${65 - i * 5} 0.14 ${25 + i * 8})` };
  });

  const soaBadge = <span className="badge soa">SOA</span>;
  const ecBadge  = <span className="badge ec">EC</span>;

  return (
    <div className="grid-12">
      {hasSplit ? (
        <>
          <div className="col-6">
            <HourLine hourly={window.D.Q6_BY_HOUR_SOA} title="Hour of day" badge={soaBadge} chartId="Q6_1" peakWindow={pw} tt={tt} />
          </div>
          <div className="col-6">
            <HourLine hourly={window.D.Q6_BY_HOUR_EC}  title="Hour of day" badge={ecBadge}  chartId="Q6_4" peakWindow={pw} tt={tt} />
          </div>
        </>
      ) : (
        <div className="col-12">
          <HourLine hourly={hourly} title="Distribution by hour (VN time)" chartId="Q6_1" peakWindow={pw} tt={tt} />
        </div>
      )}

      {/* Heatmap day × hour */}
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Heatmap — day × hour</div>
            </div>
            <div className="legend legend-bins">
              {['Low', 'Medium', 'High'].map((l, i) => (
                <span key={l} className="legend">
                  <span className="legend-swatch" style={{ background: window.heatColor((i + 1) / 3, 'rose') }}></span>
                  {l}
                </span>
              ))}
            </div>
          </div>
          <svg width="100%" viewBox="0 0 680 230">
            {window.D.DAYS_VN.map((d, di) => (
              <text key={d} x={24} y={38 + di * 26} textAnchor="end" className="axis-tick">{d}</text>
            ))}
            {window.D.DAYS_VN.map((d, di) => (
              Array.from({ length: 24 }, (_, h) => {
                const v = heatmap[di][h];
                const intensity = Math.pow(v / maxHeat, 0.6);
                return (
                  <rect key={`${d}-${h}`}
                    x={34 + h * 26} y={28 + di * 26}
                    width={24} height={22}
                    fill={window.heatColor(intensity, 'rose')}
                    rx={2}
                    onMouseEnter={e => tt.show(e, `<b>${d} · ${h}h</b><br/>${v} posts`)}
                    onMouseMove={tt.move} onMouseLeave={tt.hide}
                    style={{ cursor: 'pointer' }}
                  />
                );
              })
            ))}
            {[0, 4, 8, 12, 16, 20, 23].map(h => (
              <text key={h} x={34 + h * 26 + 12} y={220} textAnchor="middle" className="axis-tick">{h}</text>
            ))}
          </svg>
          <div style={{ fontSize: 11, color: 'var(--text-3)', marginTop: 4 }}>
            {pw && pw.windowSize > 0
              ? <>Peak window: <b style={{ color: 'var(--text)' }}>Mon–Sun, {pw.startHour}h–{pw.endHour}h</b> — {pw.totalMentions.toLocaleString()} negative mentions over {pw.windowSize} hours.</>
              : <>Insufficient data to detect a peak window.</>}
          </div>
        
        <window.CardComments chartId="Q6_2" />
      </div>
      </div>

      {/* Donut — peak window distribution */}
      <div className="col-12">
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">
                Negative peak hour window (Mon–Sun, {pw ? `${pw.startHour}h–${pw.endHour}h` : '—'}) — topic distribution
              </div>
            </div>
            <span className="card-meta mono">
              {(pw && pw.totalMentions) || earlyTotal} mentions trong peak window
            </span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 48 }}>
            <svg width={220} height={220}>
              {donutSeg.map((s) => (
                <path key={s.vn}
                  d={_arc(110, 110, 90, 60, s.start, s.end)}
                  fill={s.color}
                  onMouseEnter={e => tt.show(e, `<b>${s.en || s.vn}</b><br/>${s.slot} mentions · ${Math.round((s.slot / earlyTotal) * 100)}%`)}
                  onMouseMove={tt.move} onMouseLeave={tt.hide}
                  style={{ cursor: 'pointer' }}
                />
              ))}
              <text x={110} y={106} textAnchor="middle" className="mono" style={{ fontSize: 22, fontWeight: 600, fill: 'var(--text)' }}>{earlyTotal}</text>
              <text x={110} y={124} textAnchor="middle" className="axis-tick" style={{ fontSize: 10 }}>peak window</text>
            </svg>
            <div style={{ flex: 1 }}>
              {donutSeg.map(s => (
                <div key={s.vn} style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6, fontSize: 12 }}>
                  <span style={{ width: 10, height: 10, borderRadius: 2, background: s.color, flexShrink: 0 }}></span>
                  <span style={{ flex: 1 }}>{s.en || s.vn}</span>
                  <span className="mono" style={{ color: 'var(--text-3)' }}>{s.slot}</span>
                  <span className="mono" style={{ width: 42, textAlign: 'right', color: 'var(--text-2)' }}>{Math.round((s.slot / earlyTotal) * 100)}%</span>
                </div>
              ))}
            </div>

<script type="text/babel">

function HBars({ items, colorKey = 'color', labelKey = 'name', valueKey = 'count', defaultColor = 'var(--accent)', height = 260, tooltip }) {

const Q7_GRAY  = 'oklch(0.70 0.02 260)';

function _donutArc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function Q7BarCard({ items, title, badge, chartId, tt }) {
  return (
    <div className="card">

}

function Q7SentimentCard({ sentiment, title, badge, chartId, tt }) {
  const total = Math.max(1, sentiment.positive + sentiment.neutral + sentiment.negative);

    { label: 'Positive', v: sentiment.positive, color: Q7_GREEN },
    { label: 'Neutral',  v: sentiment.neutral,  color: Q7_GRAY },
    { label: 'Negative', v: sentiment.negative, color: Q7_RED },

    const start = acc; acc += s.v / total;
    return { ...s, start, end: acc };

function _q9Arc(cx, cy, r, r2, a0, a1) {

}

function Q9Donut({ title, badge, items, chartId, tt }) {
  const total = items.reduce((a, b) => a + b.count, 0) || 1;

    return { ...it, start, end: acc };

function Q9() {

<script type="text/babel">

// Data is keyword-matched from post content (backend/keywords.py:Q10_CATEGORY_KW)

// Helper: convert keyword-match rows into the shape the table/donut expects.

function _q10Shape(rows, denom) {

    cat:   r.en || r.name || r.vn,
    n:     r.count || 0,
    pct:   ((r.count || 0) / safeDenom * 100).toFixed(1),

function _q10Arc(cx, cy, r, r2, a0, a1) {
  const large = a1 - a0 > 0.5 ? 1 : 0;
  const sx = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const sy = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r;
  const ex = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const ey = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r;
  const sx2 = cx + Math.cos(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const sy2 = cy + Math.sin(a1 * Math.PI * 2 - Math.PI / 2) * r2;
  const ex2 = cx + Math.cos(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  const ey2 = cy + Math.sin(a0 * Math.PI * 2 - Math.PI / 2) * r2;
  return `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey} L${sx2},${sy2} A${r2},${r2} 0 ${large} 0 ${ex2},${ey2} Z`;
}

function Q10DonutCard({ data, total, headerLabel, tt }) {
  // Drop "Other / Undisclosed" from donut so categories of interest get the full ring
  const slice = data.filter(d => !d.cat.toLowerCase().startsWith('other'));
  const sum = slice.reduce((a, b) => a + b.n, 0) || 1;
  let acc = 0;
  const seg = slice.map(d => {
    const start = acc; acc += d.n / sum;
    return { ...d, start, end: acc };
  });
  return (
    <div className="card" style={{ padding: 0 }}>
      <div className="card-head" style={{ padding: '14px 18px' }}>
        <div className="card-title">{headerLabel}</div>
      </div>
      <div style={{ padding: 18, display: 'flex', justifyContent: 'center' }}>
        <svg width={220} height={220}>
          {seg.map(s => (
            <path key={s.cat} d={_q10Arc(110, 110, 95, 60, s.start, s.end)} fill={s.color}
              onMouseEnter={e => tt.show(e, `<b>${s.cat}</b><br/>${s.n.toLocaleString()} mentions · ${s.pct}%`)}
              onMouseMove={tt.move} onMouseLeave={tt.hide} style={{ cursor: 'pointer' }} />
          ))}
          <text x={110} y={106} textAnchor="middle" className="mono" style={{ fontSize: 18, fontWeight: 700, fill: 'var(--text)' }}>
            {total.toLocaleString()}
          </text>
          <text x={110} y={124} textAnchor="middle" className="axis-tick" style={{ fontSize: 10 }}>mentions</text>
        </svg>
      </div>
      <div style={{ padding: '0 18px 18px', display: 'flex', flexDirection: 'column', gap: 5 }}>
        {seg.map(s => (
          <div key={s.cat} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, fontSize: 11 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, color: 'var(--text-2)', minWidth: 0 }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: s.color, flexShrink: 0 }}></span>
              <span style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.cat}</span>
            </div>
            <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>

            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

        </div>
      </div>

      <TweaksPanel theme={theme} setTheme={setTheme} accent={accent} setAccent={setAccent} />
    </>
  );
}

if (window.D && window.D2) {
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
} else {
  setTimeout(() => {
    if (window.D && window.D2) {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    }
  }, 100);
}


</script>
</body>
</html>
