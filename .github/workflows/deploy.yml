name: Deploy to EC2

on:
  push:
    branches: [ AWS_deployment ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/Boost.pem
        chmod 600 ~/.ssh/Boost.pem
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy
      run: |
        rsync -az --delete \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.next' \
          -e "ssh -i ~/.ssh/Boost.pem" \
          ./nextjs/ ec2-user@${{ secrets.EC2_HOST }}:~/app/

        ssh -i ~/.ssh/Boost.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd ~/app
          npm install --production=false
          npm run build
          pm2 delete chicom 2>/dev/null || true
          pm2 start npm --name chicom -- start
          pm2 save
          echo "Done — $(date)"
        EOF
