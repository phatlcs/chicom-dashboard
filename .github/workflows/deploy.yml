name: Deploy to EC2

on:
  push:
    branches: [ AWS_deployment, aws-deployment ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/Boost.pem
        chmod 600 ~/.ssh/Boost.pem
        echo "Host ${{ secrets.EC2_HOST }}
          StrictHostKeyChecking no
          IdentityFile ~/.ssh/Boost.pem" >> ~/.ssh/config

    - name: Sync project to EC2
      run: |
        rsync -az --delete \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.next' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='output/' \
          --exclude='.insight_cache.json' \
          --exclude='*.xlsx' \
          --exclude='.env' \
          --exclude='data/' \
          --exclude='/nextjs/public/*.html' \
          -e "ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no" \
          ./ ${EC2_USER}@${{ secrets.EC2_HOST }}:~/app/

    - name: Write .env from GitHub secret
      run: |
        ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no ${EC2_USER}@${{ secrets.EC2_HOST }} \
          "echo 'ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}' > ~/app/.env && chmod 600 ~/app/.env"

        # Sync public assets to where nginx serves them (~/app/public/)
        # No --delete so generated files (overview.html etc.) are preserved
        rsync -az \
          -e "ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no" \
          ./nextjs/public/ ${EC2_USER}@${{ secrets.EC2_HOST }}:~/app/public/

    - name: Build and restart
      run: |
        ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no ${EC2_USER}@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          sudo dnf install -y python3-pip
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user -r /home/ec2-user/app/backend/requirements.txt
          cd ~/app/nextjs
          npm install --production=false
          rm -rf .next
          npm run build
          pm2 delete chicom 2>/dev/null || true
          pm2 start npm --name chicom --cwd /home/ec2-user/app/nextjs -- start
          pm2 save
          echo "Done — $(date)"
        EOF
