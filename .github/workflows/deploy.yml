name: Deploy to EC2

on:
  push:
    branches: [ AWS_deployment ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/Boost.pem
        chmod 600 ~/.ssh/Boost.pem
        echo "Host ${{ secrets.EC2_HOST }}
          StrictHostKeyChecking no
          IdentityFile ~/.ssh/Boost.pem" >> ~/.ssh/config

    - name: Sync project to EC2
      run: |
        rsync -az --delete \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.next' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='output/' \
          --exclude='.insight_cache.json' \
          --exclude='*.xlsx' \
          -e "ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no" \
          ./ ec2-user@${{ secrets.EC2_HOST }}:~/app/

        # Sync public assets to where nginx serves them (~/app/public/)
        # --existing on *.html means we update committed pages but never delete generated ones
        rsync -az \
          --exclude='*.html' \
          -e "ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no" \
          ./nextjs/public/ ec2-user@${{ secrets.EC2_HOST }}:~/app/public/
        rsync -az \
          -e "ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no" \
          ./nextjs/public/q1.html \
          ./nextjs/public/april.html \
          ./nextjs/public/may.html \
          ec2-user@${{ secrets.EC2_HOST }}:~/app/public/

    - name: Build and restart
      run: |
        ssh -i ~/.ssh/Boost.pem -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          set -e
          cd ~/app/nextjs
          npm install --production=false
          npm run build
          pm2 delete chicom 2>/dev/null || true
          pm2 start npm --name chicom --cwd /home/ec2-user/app/nextjs -- start
          pm2 save
          echo "Done — $(date)"
        EOF
